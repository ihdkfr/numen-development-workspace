/* NUMEN V2 readability and dedicated workspaces */
:root{--font:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
body{font-size:15px}
.content{max-width:1550px}
.pageLead{font-size:14px;max-width:920px;line-height:1.7}
.infoBox{font-size:14px;line-height:1.75}
.tasktitle{font-size:14px}
.taskdesc{font-size:12px}
.panel .cardTitle{font-size:16px}
.mission{border:1px solid var(--blue);border-radius:16px;padding:24px 26px;background:linear-gradient(140deg,var(--bluebg),var(--panel) 72%);margin:16px 0 22px}
.mission h2{font-size:clamp(20px,2.2vw,27px);line-height:1.2;margin:9px 0 12px;max-width:900px}
.mission p{max-width:950px;line-height:1.7;margin:8px 0 13px}
.mission-metadata{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0 18px}
.mission-metadata span{background:var(--panel);border:1px solid var(--border);padding:6px 10px;border-radius:8px;font-size:12px;color:var(--text)}
.dash-fast{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:13px 0 17px}
.dash-feature{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:7px;border:1px solid var(--border);background:var(--panel);border-radius:12px;padding:18px 20px;color:var(--text);min-height:132px}
.dash-feature:hover,.combat-entry:hover,.idea-card:hover,.template-idea:hover{border-color:var(--blue)}
.dash-feature strong{font-size:18px}.dash-feature small{color:var(--muted);font-size:13px}.dash-feature span{color:var(--blue);font-size:12px;font-weight:750;margin-top:auto}
.guide-note{background:var(--panel2);padding:15px 19px;border:1px solid var(--border);border-radius:10px;font-size:13px;color:var(--muted);line-height:1.65}
.dashboard-more{margin-top:15px}.dashboard-more>summary{cursor:pointer;color:var(--blue);font-weight:650;padding:12px 0}.dashboard-more>.eyebrow,.dashboard-more>.pageTitle,.dashboard-more>.pageLead{display:none}
.guide-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
.guide-grid .panel{min-height:180px}.guide-grid .panel .cardTitle{margin:8px 0}.guide-grid p{font-size:13px;line-height:1.7;color:var(--muted);margin:8px 0 0}
.job-head{border:1px solid var(--blue);background:var(--panel);border-radius:13px;padding:19px 23px;margin:0 0 18px}
.job-head-line{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin:13px 0 16px}
.job-head-line h2{font-size:19px;margin:0 0 5px}.job-head-line p{font-size:14px;line-height:1.7;margin:0;max-width:720px;color:var(--muted)}
.job-actions{white-space:nowrap}
.job-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:14px 0}
.job-kpis>div{padding:12px 13px;border-radius:9px;background:var(--panel2);border:1px solid var(--border)}
.job-kpis span{font-size:10px;font-weight:800;color:var(--muted);display:block;margin-bottom:6px;letter-spacing:.06em}
.job-kpis strong{font-size:12px;line-height:1.55;font-weight:600;display:block;overflow-wrap:anywhere}
.job-steps summary{cursor:pointer;font-size:14px;font-weight:750;padding:11px 0;color:var(--blue)}
.job-steps ol{padding-left:25px;margin:5px 0 3px;line-height:1.8;font-size:14px}
.job-steps li{padding:4px 0}
.combat-columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;gap:13px}
.combat-column{background:var(--panel);border:1px solid var(--border);padding:16px;border-radius:12px;min-height:300px}
.combat-column h3,.idea-col h3{margin:0;font-size:15px}
.combat-entry{width:100%;text-align:left;display:flex;flex-direction:column;gap:6px;border:1px solid var(--border);background:var(--panel2);padding:13px;margin:12px 0;border-radius:10px;color:var(--text)}
.combat-entry strong{font-size:14px}.combat-entry span{font-size:12px;color:var(--muted)}.combat-entry small{font-size:11px;color:var(--blue)}
.template-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:15px}
.template-idea{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--border);border-radius:9px;background:var(--panel2);color:var(--text);padding:13px}
.template-idea small{font-size:12px;color:var(--muted)}
.library-head{padding:25px 0 20px}.library-head h1{margin:10px 0}.library-head p{font-size:15px;color:var(--muted);max-width:900px;line-height:1.65}
.related-link{display:block;background:var(--panel2);border:1px solid var(--border);width:100%;padding:11px;margin:9px 0;text-align:left;border-radius:8px;color:var(--text)}
.related-link:hover{border-color:var(--blue)}.related-link small{color:var(--muted)}
.resource-row{border-bottom:1px solid var(--border);padding:8px 0;overflow-wrap:anywhere}
.lib-media-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:13px}
.idea-columns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.idea-col{border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:14px;min-height:230px}
.idea-card{padding:13px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);margin:13px 0}
.idea-title{font-weight:750;font-size:14px;background:none;border:0;text-align:left;padding:5px 0;color:var(--text);width:100%}.idea-title:hover{color:var(--blue)}
.idea-card p{margin:6px 0 14px;font-size:12px;color:var(--muted);line-height:1.55}
.pick-list{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:10px 13px;display:flex;flex-direction:column;gap:9px;margin-bottom:10px;max-height:190px;overflow:auto}
.pick-list label{font-size:13px;display:block!important}.pick-list input{margin-right:8px}
.modal .label{margin-top:13px}
@media(max-width:1190px){.combat-columns{grid-template-columns:repeat(2,minmax(0,1fr))}.idea-columns{grid-template-columns:repeat(2,minmax(0,1fr))}.guide-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.dash-fast,.combat-columns,.idea-columns,.guide-grid,.template-grid,.job-kpis{grid-template-columns:1fr}.job-head-line{flex-direction:column}.mission{padding:17px}.job-head{padding:16px}.content{padding:19px 14px 65px}}

.btn.mobiletoggle{display:none}
@media(max-width:850px){.btn.mobiletoggle{display:inline-flex}}

/* Soul Survival plan (13 Oct 2026) */
.plan-banner{margin-bottom:16px;border-left:3px solid var(--blue)}
.plan-notes>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.plan-notes>summary::-webkit-details-marker{display:none}
.plan-notes>summary .cardTitle{margin:0}
.plan-notes>summary .cardTitle::before{content:'▸ ';color:var(--blue)}
.plan-notes[open]>summary .cardTitle::before{content:'▾ '}

<script>

const NAV=[['dashboard','▦','Dashboard'],['roadmap','▤','Roadmap'],['workshop','▥','Workshop'],['codex','▧','Codex'],['tree','◇','System tree'],['assets','▣','Assets & references'],['team','♧','Team & activity'],['settings','⚙','Settings']];

const NUMEN_CLOUD_DEFAULT=Object.freeze({url:'https://rvvilkqxphdpkepojwnr.supabase.co',key:'sb_publishable_cGXQ6SgpQqigQzXkKShtjA_P0lxeQ1k'});
const state={page:'dashboard',modal:null,selectedTask:null,openPhases:new Set(['01']),search:'',filterStatus:'all',filterPriority:'all',filterPerson:'all',filterPhase:'all',workFilter:'all',docSection:0,treeKind:'all',assetsQuery:'',records:{},versions:{},events:[],members:[],mode:'local',team:null,user:null,config:null,theme:localStorage.getItem('numen_theme')||'dark',mobileMenu:false,cloud:null,saveBusy:false,connecting:false,lastCloudError:'',codexCustom:false,focusSearch:false};

const $$=s=>Array.from(document.querySelectorAll(s));

function openModal(type,more={}){state.modal={type,...more};renderModal()}

function isOwner(){return state.mode==='local'||state.members.some(m=>m.user_id===personId()&&m.role==='owner')}
function getPeople(){return state.mode==='cloud'?state.members:state.members.length?state.members:[{user_id:'local-you',display_name:'You',role:'owner'},{user_id:'local-teammate',display_name:'Teammate',role:'member'}]}
function personName(id){return getPeople().find(p=>p.user_id===id)?.display_name|| (id?'Unknown member':'Unassigned')}

function getRec(key){return state.records[key]?.data||{}}
function aliasRecordKey(id){if(state.records[taskIdKey(id)])return null;for(const a of SEED_BY_ID[id]?.aliases||[]){if(state.records[taskIdKey(a)])return taskIdKey(a)}return null}
function taskState(id){const ak=aliasRecordKey(id);const o=ak?getRec(ak):getRec(taskIdKey(id));const sd=SEED_BY_ID[id];return {status:sd?.seed_status||'todo',workshop:false,assignees:[],checklist:sd?seedChecklist(sd):[],notes:[],links:[],media:[],history:[],...o}}

function getTask(id){let t=allTasks().find(x=>x.id===id);if(!t)return null;let st=taskState(id);return {...t,title:st.titleOverride??t.title,why:st.whyOverride??t.why,implementation_instructions:st.instructionsOverride??t.implementation_instructions,acceptance_test:st.acceptanceOverride??t.acceptance_test,suggested_tools:st.toolsOverride??t.suggested_tools,priority:st.priorityOverride??t.priority,effort:st.effortOverride??t.effort}}

function safeUrl(url){try{const u=new URL(String(url));return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch(e){return '#'}}
function mdInline(str){let t=esc(str);t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,label,url)=>`<a href="${attr(safeUrl(url))}" target="_blank" rel="noopener noreferrer">${label}</a>`);t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>');return t}
function markdownToHtml(input){let lines=String(input||'').replace(/\r/g,'').split('\n'),out=[],inList='',inCode=false,code=[];function closeList(){if(inList){out.push('</'+inList+'>');inList=''}}for(let i=0;i<lines.length;i++){let l=lines[i],trim=l.trim();if(trim.startsWith('```')){closeList();if(!inCode){inCode=true;code=[]}else{out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);inCode=false}continue}if(inCode){code.push(l);continue}if(!trim){closeList();continue}if(/^\|/.test(trim)&&i+1<lines.length&&/^\|[\s:|-]+\|?$/.test(lines[i+1].trim())){closeList();let cols=x=>x.trim().replace(/^\||\|$/g,'').split('|').map(s=>s.trim());let headers=cols(trim);out.push('<table><thead><tr>'+headers.map(h=>`<th>${mdInline(h)}</th>`).join('')+'</tr></thead><tbody>');i+=1;while(i+1<lines.length&&/^\|/.test(lines[i+1].trim())){i++;out.push('<tr>'+cols(lines[i]).map(c=>`<td>${mdInline(c)}</td>`).join('')+'</tr>')}out.push('</tbody></table>');continue}let heading=trim.match(/^(#{1,4})\s+(.+)$/);if(heading){closeList();let level=Math.min(4,heading[1].length+1);out.push(`<h${level}>${mdInline(heading[2])}</h${level}>`);continue}if(trim.startsWith('>')){closeList();out.push(`<blockquote>${mdInline(trim.replace(/^>\s*/,''))}</blockquote>`);continue}let bullet=trim.match(/^([-*]|\d+\.)\s+(.+)$/);if(bullet){let typ=/\d/.test(bullet[1])?'ol':'ul';if(inList!==typ){closeList();out.push('<'+typ+'>');inList=typ}out.push('<li>'+mdInline(bullet[2])+'</li>');continue}closeList();out.push(`<p>${mdInline(trim)}</p>`)}closeList();if(inCode)out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);return out.join('')}
function treePage(){let groups=['foundation','systems','path','world','production','release'],opts=['all',...new Set(allPhases().map(p=>p.kind||'other'))];let arr=allPhases().filter(p=>state.treeKind==='all'||(p.kind||'other')===state.treeKind);return pageHeader('04 / Dependencies','Game system tree','A readable dependency map. Choose a system to inspect its prerequisites, exit tests and associated tasks.',`<button class="btn" data-act="nav" data-page="roadmap">Open roadmap →</button>`)+`<div class="filterbar"><label class="label">Show:</label><select class="sel" data-change="tree-kind">${opts.map(o=>`<option value="${attr(o)}" ${state.treeKind===o?'selected':''}>${esc(o==='all'?'All system categories':o)}</option>`).join('')}</select></div><div class="grid3">${arr.map(p=>{let c=calcCounts(tasksOfPhase(p.idx));return `<button class="treeNode" style="width:auto;text-align:left" data-act="open-phase" data-id="${attr(p.idx)}"><div class="eyebrow">PHASE ${p.idx}</div><b style="margin:8px 0">${esc(p.title)}</b><small>Needs: ${esc(snip(p.depends,75))}</small><div style="margin-top:11px">${progressHTML(tasksOfPhase(p.idx))}</div><small>${c.done}/${c.total} approved · Click for tasks</small></button>`}).join('')}</div><div class="panel" style="margin-top:17px"><h2 class="cardTitle">How to use this system map</h2><p class="muted small">These are phase-level relationships stated in the blueprint. Task-level dependencies can be added individually as development progresses; the app does not invent dependencies absent from the source.</p></div>`}

function inputValue(id){return document.getElementById(id)?.value||''}
function recordHistory(obj,action){obj.history=[...(obj.history||[]),{at:now(),by:personId(),action}].slice(-100);obj.updatedAt=now();obj.updatedBy=personId();return obj}
async function updateTask(id,change,summary='updated task'){if(state.mode==='cloud'&&!state.records[taskIdKey(id)]&&taskState(id).status==='done'&&!isOwner()){toast('This task is approved in the plan. Only the team owner can change it.',true);render();return false}let rec=taskState(id);const updated=recordHistory({...rec,...change},summary);const saved=await saveRecord(taskIdKey(id),updated,summary);if(saved){render()}return saved}
async function modifyTask(id,fn,label){let obj=taskState(id);fn(obj);return updateTask(id,obj,label)}
function canApprove(){return isOwner()}
async function changeTaskStatus(id,newStatus){let old=taskState(id);if(newStatus===old.status)return;if(newStatus==='done'&&!canApprove()){toast('Only the team owner can approve work. Submit for review instead.',true);render();return}let data={status:newStatus};if(newStatus==='review'){data.completedBy=personId();data.approvedBy='';data.approvedAt=''}if(newStatus==='done'){data.approvedBy=personId();data.approvedAt=now();if(!old.completedBy)data.completedBy=personId()}if(old.status==='done'&&newStatus!=='done'){data.approvedBy='';data.approvedAt=''}await updateTask(id,data,`changed status to ${STATUSNAME[newStatus]}`)}
async function saveRecord(key,data,summary){if(state.saveBusy){toast('A previous save is still finishing; please try again.',true);return false}state.saveBusy=true;try{if(state.mode==='cloud'){if(!state.cloud||!state.team)throw Error('Cloud connection is unavailable');let expected=state.versions[key]||0;const {data:res,error}=await state.cloud.rpc('numen_save_record',{p_team_id:state.team.id,p_item_id:key,p_payload:data,p_expected_revision:expected,p_summary:summary});if(error)throw error;state.records[key]={data:res.data};state.versions[key]=res.version;state.events.unshift({actor_id:personId(),summary,item_id:key,created_at:now()});state.events=state.events.slice(0,80)}else{state.records[key]={data};state.versions[key]=(state.versions[key]||0)+1;state.events.unshift({by:personId(),summary,item_id:key,at:now()});state.events=state.events.slice(0,100);await persistLocal()}return true}catch(e){if(/NUMEN_CONFLICT/i.test(e.message||'')){await cloudRefresh();toast('This task changed on your teammate’s computer. Latest version reloaded; review before saving again.',true)}else showErr(e);return false}finally{state.saveBusy=false}}
async function persistLocal(){await idbPut('state','workspace',{records:state.records,versions:state.versions,events:state.events,members:state.members})}
function copyText(s){if(navigator.clipboard&&window.isSecureContext){return navigator.clipboard.writeText(s).then(()=>toast('Copied to clipboard')).catch(()=>fallbackCopy(s))}fallbackCopy(s)}
function fallbackCopy(s){let a=document.createElement('textarea');a.value=s;document.body.append(a);a.select();let ok=document.execCommand('copy');a.remove();toast(ok?'Copied':'Copy unavailable; use the displayed text',!ok)}
function copyPrompt(id){let t=getTask(id),p=allPhases().find(x=>x.idx===t.phase_id);let prompt=`NUMEN Roblox development task ${id}: ${t.title}\n\nSOURCE: Independent NUMEN game blueprint, not existing Soul Survival implementation.\nPHASE: ${p?.title||t.phase_title}\nRELEASE PRIORITY: ${t.priority}; ESTIMATE: ${t.effort}\nWHY: ${t.why}\n\nBUILD INSTRUCTIONS:\n${t.implementation_instructions}\n\nRECOMMENDED TOOLS:\n${t.suggested_tools}\n\nPHASE DEPENDENCIES:\n${p?.depends||'None listed'}\n\nACCEPTANCE TEST (must run in Roblox Studio):\n${t.acceptance_test}\n\nPHASE COMPLETION GATE:\n${p?.gate||'None listed'}\n\nIMPLEMENTATION RULES:\n1. Inspect existing files and report affected systems before coding.\n2. Keep the change small, reusable and server-authoritative where gameplay is affected.\n3. State files created/changed and tests, with actual results rather than claims.\n4. Do not mark the planner task approved. A human reviews Studio captures and approves.\n5. No paid assets/plugins without permission; prioritise free tools.\n\nTASK CHECKLIST:\n${taskState(id).checklist.map(x=>'- '+(x.done?'[x] ':'[ ] ')+x.text).join('\n')||'No subtasks added yet.'}`;copyText(prompt)}
async function removeMedia(id,mediaId){await modifyTask(id,s=>{s.media=s.media.filter(a=>a.id!==mediaId)},'removed an attachment')}
async function cloudImageUrl(a){if(a.path){let{data,error}=await state.cloud.storage.from('numen-assets').createSignedUrl(a.path,3600);if(error)throw error;return data.signedUrl}return null}
const assetCache={};async function getAssetUrl(a){if(assetCache[a.id]&&assetCache[a.id].expiresAt>Date.now())return assetCache[a.id].url;let url;if(a.localKey){const rec=await idbGet('files',a.localKey);if(!rec)throw Error('Local file not found on this device. Use a full JSON backup to restore it.');url=URL.createObjectURL(rec.blob)}else if(a.path&&state.mode==='cloud'){url=await cloudImageUrl(a)}else if(a.inlineData){url=a.inlineData}else throw Error('Attachment is unavailable.');assetCache[a.id]={url,expiresAt:Date.now()+(a.path?50*60*1000:365*24*60*60*1000)};return url}
async function fillAssetPreviews(){const els=$$('img[data-media]');for(const img of els){let st=taskState(img.dataset.task),a=st.media.find(x=>x.id===img.dataset.media);if(!a)continue;try{img.src=await getAssetUrl(a)}catch(e){img.alt='Unavailable: '+a.name}}}
async function chooseFile(id,group){let field=$('#fileUpload');if(!field){go('roadmap',id);return}field.dataset.group=group;field.click()}
async function attachFiles(id,group,files){for(const file of files){try{if(file.size>8*1024*1024){toast(`${file.name}: over the 8 MB limit`,true);continue}let asset={id:uid(),name:file.name,size:file.size,mime:file.type||'application/octet-stream',group,by:personId(),at:now()};if(state.mode==='cloud'){let clean=file.name.replace(/[^a-zA-Z0-9_.-]/g,'_').slice(-80),path=`${state.team.id}/${id}/${asset.id}_${clean}`;const {error}=await state.cloud.storage.from('numen-assets').upload(path,file,{upsert:false,contentType:asset.mime});if(error)throw error;asset.path=path}else{asset.localKey='asset:'+asset.id;await idbPut('files',asset.localKey,{blob:file})}const ok=await modifyTask(id,s=>{s.media.push(asset)},`attached ${file.name} (${group})`);if(ok)toast('Attached '+file.name)}catch(e){showErr(e)}}}
async function openAsset(id,mediaId,forDownload=false){let a=taskState(id).media.find(x=>x.id===mediaId);if(!a)return;try{let url=await getAssetUrl(a);if(forDownload||!(a.mime||'').startsWith('image/')){let el=document.createElement('a');el.href=url;el.target='_blank';el.rel='noopener';if(!a.path)el.download=a.name;el.click()}else openModal('view-image',{url,name:a.name,id,mediaId,caption:a.caption})}catch(e){showErr(e)}}

async function exportBackup(){try{toast('Preparing full backup including attachments…');const records=state.records;const embeddedFiles={};for(const [key,r] of Object.entries(records)){const data=r.data;for(const a of data.media||[]){if(a.localKey){let file=await idbGet('files',a.localKey);if(file?.blob)embeddedFiles[a.id]=await blobToDataUrl(file.blob)}else if(a.path&&state.mode==='cloud'){const url=await getAssetUrl(a);const res=await fetch(url);if(!res.ok)throw Error('Could not download cloud attachment '+a.name);embeddedFiles[a.id]=await blobToDataUrl(await res.blob())}}}let backup={format:'NUMEN_WORKSPACE_V1',savedAt:now(),source:'Soul Survival plan '+SOURCE.metadata.version,records,embeddedFiles,members:getPeople(),teamName:state.team?.name||'Local workspace'};await downloadText(JSON.stringify(backup,null,2),'NUMEN_Workspace_Backup_'+new Date().toISOString().slice(0,10)+'.json','application/json');toast('Full backup downloaded')}catch(e){showErr(e)}}
function blobToDataUrl(blob){return new Promise((res,rej)=>{let f=new FileReader();f.onload=()=>res(f.result);f.onerror=()=>rej(f.error);f.readAsDataURL(blob)})}
function dataUrlBlob(dataUrl){const [header,base64]=dataUrl.split(','),type=(header.match(/data:(.*?);/)||[])[1]||'application/octet-stream',raw=atob(base64),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new Blob([bytes],{type})}

async function idbGet(store,key){let db=await idb();return new Promise((resolve,reject)=>{let t=db.transaction(store,'readonly'),r=t.objectStore(store).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}

// Import ONLY browser-local work that does not already exist in the shared team.
// Never erase local IndexedDB records, silently overwrite shared work or discard attachments.
async function importLocalWorkToCloud(){
  if(state.mode!=='cloud'||!state.team||!state.user)throw Error('Sign in to your shared team first.');
  const saved=await idbGet('state','workspace');
  const entries=Object.entries(saved?.records||{});
  const missing=entries.filter(([key])=>!Object.prototype.hasOwnProperty.call(state.versions,key));
  const already=entries.length-missing.length;
  if(!entries.length){toast('No locally saved edits were found on this browser. The plan tasks are already included.');return}
  if(!missing.length){toast('All '+entries.length+' local records already exist in the shared team. Nothing was overwritten.');return}
  const msg='Import '+missing.length+' locally saved record(s) into '+state.team.name+'? '+already+' matching team record(s) will be SKIPPED to avoid overwrites. Local originals will remain on this computer.\n\nReview your local backup first if you have important existing work.';
  if(!confirm(msg))return;
  let done=0,failed=0;
  for(const [key,record] of missing){
    try{
      const data=structuredClone(record.data);
      if(!data||typeof data!=='object')throw Error('Invalid local record');
      for(const a of data.media||[]){
        if(!a.localKey)continue;
        const found=await idbGet('files',a.localKey);
        if(!found?.blob)throw Error('Missing local attachment '+a.name);
        const clean=String(a.name||'asset').replace(/[^a-zA-Z0-9_.-]/g,'_').slice(-80);
        const path=state.team.id+'/'+key.replace(/[^a-zA-Z0-9_.:-]/g,'_')+'/'+a.id+'_'+clean;
        const {error}=await state.cloud.storage.from('numen-assets').upload(path,found.blob,{upsert:false,contentType:a.mime||'application/octet-stream'});
        if(error&&error.statusCode!=='409')throw error;
        a.path=path;delete a.localKey;
      }
      const ok=await saveRecord(key,data,'imported saved local work');
      if(ok)done++;else failed++;
    }catch(err){failed++;console.error('NUMEN local import failed for',key,err);toast('Could not import '+key+': '+(err.message||err),true)}
  }
  await cloudRefresh();
  alert('Local import complete: '+done+' records added; '+already+' existing shared records skipped; '+failed+' failed. Local originals are still saved on this browser.');
}

function onboardingNext(){

  if(ongoing)return {t:ongoing,reason:'Your assigned job is already in progress'};
  let assigned=all.find(t=>taskState(t.id).status==='todo'&&mine(t));
  if(assigned)return {t:assigned,reason:'Earliest assigned unfinished job'};
  let next=all.find(t=>taskState(t.id).status==='todo'&&free(t));
  if(next)return {t:next,reason:'Earliest unassigned unfinished job in build order'};
  next=all.find(t=>taskState(t.id).status==='todo');

}

// Default layout: phases in two columns either side of the game, each open phase's tasks in a column further out.
function mapLayout(){let phases=allPhases(),pos={},saved=mapSaved(),half=Math.ceil(phases.length/2),ROW=46,GAP=34,PH=92;
  for(const side of [0,1]){let list=phases.slice(side?half:0,side?phases.length:half);if(side)list=list.slice().reverse();
    let blocks=list.map(p=>{let n=state.map.expanded.has(p.idx)?tasksOfPhase(p.idx).length:0;return {p,n,h:Math.max(PH,n*ROW)}});
    let total=blocks.reduce((a,b)=>a+b.h+GAP,-GAP),y=-total/2,dir=side?-1:1;
    for(const b of blocks){let cy=y+b.h/2;pos['p:'+b.p.idx]={x:dir*430,y:cy};
      tasksOfPhase(b.p.idx).forEach((t,j)=>{pos['t:'+t.id]={x:dir*790,y:cy-(b.n-1)*ROW/2+j*ROW}});y+=b.h+GAP}}
  for(const k of Object.keys(saved))if(pos[k]||k.startsWith('t:')||k.startsWith('p:'))pos[k]={...pos[k],...saved[k]};
  pos.root={x:0,y:0,...(saved.root||{})};
  // A moved phase drags its unmoved tasks with it.

 case'map-note-save':{let n=libraryItem('mapnote',id);let ok=await saveLibrary('mapnote',id,{...n,title:inputValue('mapNoteTitle').trim()||'Note',text:inputValue('mapNoteText'),parent:inputValue('mapNoteParent')},'edited a note on the master map');if(ok){toast('Note saved');render()}return}
 case'map-note-color':{let n=libraryItem('mapnote',id);if(await saveLibrary('mapnote',id,{...n,color:el.dataset.value},'changed a note colour'))render();return}
 case'map-note-delete':{if(!confirm('Delete this note from the map?'))return;let n=libraryItem('mapnote',id);if(await saveLibrary('mapnote',id,{...n,deleted:true},'deleted a note from the master map')){m.sel=null;render()}return}
 case'map-add-link':{let url=inputValue('mapLinkUrl').trim();if(safeUrl(url)==='#'){toast('Enter a link starting with https://',true);return}let kind=el.dataset.kind,o=libraryItem(kind,id);if(await saveLibrary(kind,id,{...o,links:[...(o.links||[]),{title:url.replace(/^https?:\/\//,''),url}],createdAt:o.createdAt||now()},'added a link on the master map'))render();return}
 case'save-new-phase':case'save-new-task':{let wasMap=state.page==='map',before=new Set(allPhases().map(p=>p.idx));await mapOldHandleAct(act,el);if(wasMap&&!state.modal){let task=state.selectedTask;state.page='map';state.selectedTask=null;history.replaceState(null,'','#map');if(act==='save-new-phase'){let p=allPhases().find(x=>!before.has(x.idx));if(p)m.sel={key:'p:'+p.idx}}else if(task){m.sel={key:'t:'+task};let t=getTask(task);if(t)m.expanded.add(t.phase_id)}mapRemember();render()}return}
}return await mapOldHandleAct(act,el)};
const mapOldPageRender=pageRender;
pageRender=function(){if(state.page==='map')return mapPage();return mapOldPageRender()};

init();

</script>
</body></html>
