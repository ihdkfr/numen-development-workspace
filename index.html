function ideasPage(){let all=libraryItems('idea');if(state.ideaOpen)return ideaDetail(state.ideaOpen);let use=all.filter(x=>state.ideaFilter==='all'||(state.ideaFilter==='active'?x.status!=='archived':x.status===state.ideaFilter));return pageHeader('FUTURE CONCEPTS','NUMEN Ideas Board','Capture ideas now without interrupting current development. Add descriptions, images, discussion and reference links; promote strong ideas into real roadmap tasks later.',`<button class="btn primary" data-act="lib-edit" data-kind="idea">+ New idea</button>`)+`<div class="filterbar">${[['active','Active ideas'],['all','Everything'],['shortlist','Shortlisted'],['planned','Added to plan'],['archived','Archived']].map(([v,l])=>`<button class="btn sm ${state.ideaFilter===v?'primary':''}" data-act="ideas-filter" data-value="${v}">${l}</button>`).join('')}</div><div class="idea-columns">${Object.entries(IDEA_STATUSES).filter(([k])=>k!=='archived'||state.ideaFilter!=='active').map(([status,label])=>`<section class="idea-col"><div class="row between"><h3>${esc(label)}</h3>${badge(use.filter(x=>x.status===status).length)}</div>${use.filter(x=>x.status===status).map(x=>`<article class="idea-card"><div class="tiny muted">${esc(x.category||'General')} · ${(x.media||[]).length} images/files</div><button class="idea-title" data-act="lib-open" data-kind="idea" data-id="${attr(x.id)}">${esc(x.title)}</button><p>${esc(snip(x.description,160))}</p><div class="row between"><span class="tiny muted">${esc(personName(x.createdBy))}</span><button class="btn sm" data-act="lib-open" data-kind="idea" data-id="${attr(x.id)}">Open →</button></div></article>`).join('')||'<p class="small muted">No ideas here.</p>'}</section>`).join('')}</div>${all.length?'':`<div class="panel" style="margin-top:16px"><strong>No ideas yet.</strong><p class="small muted">Try adding a new move, story event, map location, progression mechanic or UI concept. Ideas are separate from approved development tasks.</p><button class="btn primary" data-act="lib-edit" data-kind="idea">Create first idea</button></div>`}`}
function ideaDetail(id){let o=libraryItem('idea',id);if(!o.title){state.ideaOpen=null;return ideasPage()}return `<div class="row between wrap"><button class="btn" data-act="lib-back" data-kind="idea">← Ideas board</button><button class="btn primary" data-act="lib-edit" data-kind="idea" data-id="${attr(id)}">Edit idea</button></div><div class="library-head"><div class="eyebrow">IDEA · ${esc(o.category||'General')} · ${esc(IDEA_STATUSES[o.status]||'New ideas')}</div><h1 class="pageTitle">${esc(o.title)}</h1><p>${esc(o.description||'')}</p></div><div class="grid2"><div class="stack"><div class="panel"><h3 class="cardTitle">Why might this improve NUMEN?</h3><div class="infoBox">${esc(o.benefit||'Add player benefits, fun factor, or inspiration.')}</div></div><div class="panel"><h3 class="cardTitle">Possible way to build it</h3><div class="infoBox">${esc(o.approach||'Record a small first prototype, required systems and unknowns.')}</div></div>${libraryAttachments('idea',o)}${libraryNotes('idea',o)}</div><aside class="stack"><div class="panel"><h3 class="cardTitle">Next decision</h3><p class="small muted">Moving an idea to Planned does not automatically add a development task. Use the button below to create a linked task, keeping both records.</p>${o.taskId&&getTask(o.taskId)?`<button class="btn wide" data-act="task" data-id="${attr(o.taskId)}">Open linked task ${esc(o.taskId)} →</button>`:`<button class="btn primary wide" data-act="promote-idea" data-id="${attr(id)}">Turn into roadmap task →</button>`}<label class="label" style="margin-top:15px">Idea stage</label><select class="sel" style="width:100%" data-change="idea-status" data-id="${attr(id)}">${Object.entries(IDEA_STATUSES).map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="panel"><h3 class="cardTitle">Research links</h3>${libraryLinks(o)}</div><div class="panel"><h3 class="cardTitle">Idea author</h3><p>${esc(personName(o.createdBy))}</p><div class="small muted">Created ${prettyDate(o.createdAt)}</div></div></aside></div>${libFileInput()}`}
const oldRenderModal=renderModal;
renderModal=function(){if(!state.modal)return oldRenderModal();let m=state.modal;if(m.type==='lib-edit'){let o=m.id?libraryItem(m.kind,m.id):{},isIdea=m.kind==='idea';let out=isIdea?`<h2>${m.id?'Edit':'Capture new'} idea</h2><p class="small muted">Brainstorm first. You can turn an approved idea into a development task later.</p><label class="label">Idea title</label><input class="inp" id="libTitle" value="${attr(o.title||'')}" placeholder="What if NUMEN had…"><label class="label">Category</label><select class="sel" id="libCategory">${['Gameplay','Move / combat','VFX / animations','World / map','Progression','Story / events','UI / quality of life','Other'].map(x=>`<option ${o.category===x?'selected':''}>${x}</option>`).join('')}</select><label class="label">Describe the idea</label><textarea class="area" id="libDescription" style="min-height:105px">${esc(o.description||'')}</textarea><label class="label">Why would players like it?</label><textarea class="area" id="libBenefit">${esc(o.benefit||'')}</textarea><label class="label">Possible implementation / next experiment</label><textarea class="area" id="libApproach">${esc(o.approach||'')}</textarea><label class="label">Reference links (one URL per line)</label><textarea class="area" id="libLinks" style="min-height:68px">${esc((o.links||[]).map(l=>l.url).join('\n'))}</textarea><div class="foot"><button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" data-act="lib-save" data-kind="idea" data-id="${attr(m.id||'')}">Save idea</button></div>`:`<h2>${m.id?'Edit':'Create'} combat / VFX design</h2><p class="small muted">This is a technical design record, not a development phase. Link a move to the combat rules and the VFX it requires.</p><label class="label">Type</label><select class="sel" id="libType">${Object.entries(LIB_KINDS).map(([k,v])=>`<option value="${k}" ${o.kind===(k)||(!o.kind&&m.typeHint===k)?'selected':''}>${esc(v)}</option>`).join('')}</select><label class="label">Design stage</label><select class="sel" id="libDesignStatus">${['Concept','In design','In production','Testing','Approved'].map(x=>`<option ${o.status===x?'selected':''}>${x}</option>`).join('')}</select><label class="label">Name</label><input class="inp" id="libTitle" placeholder="e.g. Cero projectile" value="${attr(o.name||'')}"><label class="label">Quick description</label><textarea class="area" id="libDescription">${esc(o.summary||'')}</textarea><label class="label">How it plays / combat mechanics</label><textarea class="area" id="libGameplay" style="min-height:105px">${esc(o.gameplay||'')}</textarea><label class="label">VFX, animation and sound direction</label><textarea class="area" id="libVfx" style="min-height:105px">${esc(o.vfx||'')}</textarea><label class="label">How to test it</label><textarea class="area" id="libAcceptance">${esc(o.acceptance||'')}</textarea><label class="label">Connect other combat systems / moves / VFX</label><div class="pick-list">${libraryItems('combat').filter(x=>x.id!==m.id).map(x=>`<label><input class="libRelated" type="checkbox" value="${attr(x.id)}" ${(o.related||[]).includes(x.id)?'checked':''}> ${esc(x.name)} <span class="tiny muted">${esc(LIB_KINDS[x.kind])}</span></label>`).join('')||'<span class="small muted">Save another combat design first, then link it here.</span>'}</div><label class="label">Related roadmap task IDs (comma-separated)</label><input class="inp" id="libTasks" placeholder="04.01, 06.03" value="${attr((o.taskIds||[]).join(', '))}"><label class="label">Reference links (one URL per line)</label><textarea class="area" id="libLinks" style="min-height:65px">${esc((o.links||[]).map(x=>x.url).join('\n'))}</textarea><div class="foot"><button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" data-act="lib-save" data-kind="combat" data-id="${attr(m.id||'')}">Save design</button></div>`;$('#modalRoot').innerHTML=`<div class="modalShade" data-act="shade-close"><div class="modal large" role="dialog" aria-modal="true">${out}</div></div>`;return}if(m.type==='promote-idea'){let o=libraryItem('idea',m.id);$('#modalRoot').innerHTML=`<div class="modalShade" data-act="shade-close"><div class="modal"><h2>Add this idea to the Roadmap</h2><p class="muted">"${esc(o.title)}" will become a new editable task, linked to this idea. Existing tasks stay unchanged.</p><label class="label">Choose the development phase</label><select id="ideaPhase" class="sel" style="width:100%"><option value="">Select where this belongs…</option>${allPhases().map(p=>`<option value="${attr(p.idx)}">${esc(p.idx)} · ${esc(p.title)}</option>`).join('')}</select><label class="label">Completion test / owner approval standard</label><textarea id="ideaAcceptance" class="area" placeholder="Write an objective pass/fail test before the task is assigned…"></textarea><div class="foot"><button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" data-act="save-promote" data-id="${attr(m.id)}">Create linked task</button></div></div></div>`;return}return oldRenderModal()};
async function saveLibraryForm(kind,id){let name=inputValue('libTitle').trim();if(!name)throw Error('Give the idea or system a clear name');let original=id?libraryItem(kind,id):{},newId=id||uid().slice(0,12);let links=safeLines(inputValue('libLinks')).filter(x=>safeUrl(x)!=='#').map(url=>({title:url.replace(/^https?:\/\//,''),url}));let entry=kind==='idea'?{...original,title:name,category:inputValue('libCategory'),description:inputValue('libDescription'),benefit:inputValue('libBenefit'),approach:inputValue('libApproach'),status:original.status||'inbox',createdAt:original.createdAt||now(),createdBy:original.createdBy||personId(),links,media:original.media||[],notes:original.notes||[]}:{...original,kind:inputValue('libType'),name,summary:inputValue('libDescription'),gameplay:inputValue('libGameplay'),vfx:inputValue('libVfx'),acceptance:inputValue('libAcceptance'),related:[...document.querySelectorAll('.libRelated:checked')].map(x=>x.value),taskIds:inputValue('libTasks').split(/[\s,;]+/).filter(Boolean),links,status:inputValue('libDesignStatus')||original.status||'Concept',createdAt:original.createdAt||now(),createdBy:original.createdBy||personId(),media:original.media||[],notes:original.notes||[]};let ok=await saveLibrary(kind,newId,entry,(id?'edited ':'created ')+kind+' '+name);if(ok){closeModal();state.page=kind==='idea'?'ideas':'tree';state.ideaOpen=kind==='idea'?newId:null;state.combatOpen=kind==='combat'?newId:null;render();jumpTop()} }
async function promoteIdea(id){let o=libraryItem('idea',id);if(o.taskId){toast('This idea is already linked to task '+o.taskId);return}let phase=inputValue('ideaPhase'),p=allPhases().find(x=>x.idx===phase);if(!p)throw Error('Choose a development phase before creating a roadmap task');let acceptance=inputValue('ideaAcceptance').trim();if(acceptance.length<12)throw Error('Write a specific acceptance test before adding this to the development plan');let taskId='N-'+uid().slice(0,8).toUpperCase(),meta={id:taskId,phase_id:phase,phase_title:p.title,title:o.title,priority:'LATER',effort:'M',why:o.benefit||o.description,implementation_instructions:o.approach||o.description,acceptance_test:acceptance,suggested_tools:'Choose free tools after inspecting dependencies',phase_dependencies:p.depends,phase_exit_gate:p.gate};let ok=await saveRecord(taskIdKey(taskId),{taskMeta:meta,status:'todo',workshop:false,assignees:[],checklist:[],notes:[{body:'Originated from Ideas Board idea '+id,at:now(),by:personId()}],links:o.links||[],media:[],history:[],createdAt:now(),updatedBy:personId()},'created task from idea');if(ok){o.taskId=taskId;o.status='planned';await saveLibrary('idea',id,o,'promoted idea to task '+taskId);closeModal();state.ideaOpen=id;state.page='ideas';render();jumpTop();toast('Created linked task '+taskId)}}
const oldHandleAct=handleAct;
handleAct=async function(act,el){let id=el.dataset.id,kind=el.dataset.kind;switch(act){
case'lib-edit':openModal('lib-edit',{kind:kind||'idea',id:id||'',typeHint:el.dataset.type});return;
case'lib-save':await saveLibraryForm(kind,id);return;
case'lib-open':state.page=kind==='idea'?'ideas':'tree';state.selectedTask=null;if(kind==='idea')state.ideaOpen=id;else state.combatOpen=id;render();jumpTop();return;
case'lib-back':if(kind==='idea')state.ideaOpen=null;else state.combatOpen=null;render();jumpTop();return;
case'nav':if(el.dataset.page==='ideas')state.ideaOpen=null;if(el.dataset.page==='tree')state.combatOpen=null;return await oldHandleAct(act,el);
case'ideas-filter':state.ideaFilter=el.dataset.value;render();return;
case'combat-example':{let x=EXAMPLE_SYSTEMS[Number(el.dataset.i)];openModal('lib-edit',{kind:'combat',typeHint:x.kind});$('#libTitle').value=x.name;$('#libDescription').value=x.summary;return}
case'lib-add-note':{let body=inputValue('libNote').trim();if(!body)throw Error('Write a note first');let obj=libraryItem(kind,id);obj.notes=[...(obj.notes||[]),{body,by:personId(),at:now()}];await saveLibrary(kind,id,obj,'added note to '+kind);render();return}
case'lib-file-choose':{let field=$('#libraryUpload');if(!field)throw Error('Open this record first to attach files');field.dataset.kind=kind;field.dataset.id=id;field.click();return}
case'lib-file-open':await showLibraryAsset(kind,id,el.dataset.media);return;
case'lib-file-remove':{if(!confirm('Remove this attachment from the library record?'))return;let o=libraryItem(kind,id);o.media=(o.media||[]).filter(x=>x.id!==el.dataset.media);await saveLibrary(kind,id,o,'removed attachment');render();return}
case'promote-idea':openModal('promote-idea',{id});return;
case'save-promote':await promoteIdea(id);return;
case'start-job':{let st=taskState(id);if(!st.workshop)st.workshop=true;st.status='doing';if(!st.assignees?.length)st.assignees=[personId()];await updateTask(id,st,'started job');return}
case'submit-job':await changeTaskStatus(id,'review');return;
case'go-task-guide':go('guide');return;
}return await oldHandleAct(act,el)};
const oldHandleChange=handleChange;
handleChange=async function(el){if(el.dataset.change==='idea-status'){let o=libraryItem('idea',el.dataset.id);if(o.taskId&&el.value!=='planned'){if(!confirm('This idea is already linked to a Roadmap task. Change its idea stage anyway?')){render();return}}o.status=el.value;await saveLibrary('idea',el.dataset.id,o,'changed idea stage');render();return}if(el.dataset.change==='combat-filter'){state.combatFilter=el.value;render();return}return await oldHandleChange(el)};
const oldChangeStatus=changeTaskStatus;
changeTaskStatus=async function(id,to){if(to==='review'){let s=taskState(id),proof=(s.media||[]).some(x=>x.group==='evidence')||(s.notes||[]).some(x=>String(x.body||'').trim().length>=15);if(!proof){toast('Before submitting: attach finished work OR write a meaningful test/report note.',true);render();return}if((s.checklist||[]).some(x=>!x.done)){toast('Please complete or remove unfinished checklist steps before submitting.',true);render();return}}return await oldChangeStatus(id,to)};
const oldCopyPrompt=copyPrompt;
copyPrompt=function(id){let t=getTask(id),s=taskState(id);let extras=`\n\nHANDOFF / EVIDENCE RULES:\n- Leave the Roblox project working and avoid unrelated changes.\n- Return a list of modified files and precise Studio test results.\n- If a test cannot be run, say so explicitly.\n- Provide screenshots or an exact reproduction path where applicable.\n- The human owner reviews and approves; do not mark this task done yourself.\n- Assigned developers: ${(s.assignees||[]).map(personName).join(', ')||'Unassigned'}.`;
let p=allPhases().find(x=>x.idx===t.phase_id);let instructions=`NUMEN BUILD JOB ${id}: ${t.title}\n\nPURPOSE: ${t.why}\n\nEXACT INSTRUCTIONS:\n${t.implementation_instructions}\n\nUSE THESE TOOLS: ${t.suggested_tools}\n\nPHASE PREREQUISITES: ${p?.depends||'None specified'}\n\nPASS / FAIL ACCEPTANCE TEST:\n${t.acceptance_test}\n\nDELIVERABLE FILE: ${outputFileGuess(t)||'Identify and report the exact changed file(s)'}${extras}`;
copyText(instructions)};
const oldEventRow=eventRow;
eventRow=function(e){let key=e.item_id||'';if(key.startsWith('idea:')||key.startsWith('combat:')){let kind=key.split(':')[0],id=key.slice(kind.length+1),o=libraryItem(kind,id),title=o.title||o.name||kind;return `<div class="activity"><b>${esc(personName(e.actor_id||e.by))}</b> ${esc(e.summary||'edited')} <button class="btn sm ghost" data-act="lib-open" data-kind="${kind}" data-id="${attr(id)}">${esc(title)}</button> <span class="muted">· ${prettyDate(e.created_at||e.at)}</span></div>`}return oldEventRow(e)};
const oldAssetsPage=assetsPage;
assetsPage=function(){let saved=oldAssetsPage(),ex=[];for(let type of ['idea','combat'])for(let x of libraryItems(type))for(let m of x.media||[])ex.push({x,m,type});return saved+`<div class="panel" style="margin-top:18px"><h2 class="cardTitle">Idea and combat reference library</h2>${ex.length?`<div class="assetsGrid">${ex.map(({x,m,type})=>`<div class="assetTile"><div class="small" style="padding:9px">${esc(type==='idea'?x.title:x.name)}</div>${(m.mime||'').startsWith('image/')?`<img class="assetThumb" data-library-file="${attr(m.id)}" data-library-kind="${type}" data-library-id="${attr(x.id)}" data-act="lib-file-open" data-kind="${type}" data-id="${attr(x.id)}" data-media="${attr(m.id)}">`:'<div class="assetFile">▤</div>'}<div class="assetMeta"><div>${esc(m.name)}</div><button class="btn sm" data-act="lib-open" data-kind="${type}" data-id="${attr(x.id)}">Open record</button></div></div>`).join('')}</div>`:'<p class="small muted">Images saved on your Ideas Board and Combat & VFX pages will appear here.</p>'}</div>`};
// Reusable event listeners are attached once, independent of page re-renders.
document.addEventListener('change',async e=>{if(e.target.id!=='libraryUpload')return;let el=e.target;try{if(el.files.length)await uploadLibraryFiles(el.dataset.kind,el.dataset.id,[...el.files])}catch(err){showErr(err)}finally{el.value=''}});
document.addEventListener('input',e=>{if(e.target.id==='combatSearch'){let v=e.target.value;state.combatSearch=v;clearTimeout(searchDebounce);searchDebounce=setTimeout(()=>{render();let box=$('#combatSearch');if(box){box.focus();box.setSelectionRange(v.length,v.length)}},200)}});

init();

</script>
</body></html>
