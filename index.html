ATER]` `[M]`\n  - **Why:** Retention without endless level inflation\n  - **Build:** Periodic high-level threats, mentor new recruits, division campaigns and mastery cosmetics\n  - **Proof:** Reward horizontal unlocks not 10x stat inflation\n  - **Tool:** Claude\n\n"},{"title":"09 — Hollow and Arrancar journey: predation, evolution and mastery (21 deliverables)","content":"### 09 — Hollow and Arrancar journey: predation, evolution and mastery (21 deliverables)\n\n**Goal:** Distinct predatory progression with solo/co-op/PvP risk.  \n**Prerequisites:** 06 rewards, 05 AI, 12 ability framework  \n**Exit gate:** Alpha: basic Hollow, feeding, growth and one evolution; full ladder and releases extend later.\n\n- [ ] **09.01 — Define Hollow evolution graph** `[CORE]` `[M]`\n  - **Why:** Avoid 'just another Soul Reaper'\n  - **Build:** Start corrupted soul → basic Hollow → Menos/Gillian → Adjuchas → Vasto Lorde → Arrancar → Resurrección → rare final form; allow design-appropriate branching\n  - **Proof:** Each transition has an unlock, fail state and replay safety\n  - **Tool:** ChatGPT\n- [ ] **09.02 — Build controlled path entry** `[ALPHA]` `[M]`\n  - **Why:** Player can choose this without griefing\n  - **Build:** Opening corruption/capture route with warning, checkpoint and safe starter spawn\n  - **Proof:** Starting player cannot soft-lock by selecting Hollow\n  - **Tool:** Claude + Studio\n- [ ] **09.03 — Create starter Hollow rig** `[ALPHA]` `[L]`\n  - **Why:** Visual language distinct from player swordfighter\n  - **Build:** One R15-compatible warped body with white mask, hole and 2 movement/attack animations; original sculpt for shipping\n  - **Proof:** Walk/run/eat/cast animations play without clipping\n  - **Tool:** Blender + Studio\n- [ ] **09.04 — Implement feeding interaction** `[ALPHA]` `[M]`\n  - **Why:** Unique loop, not automatic XP\n  - **Build:** Defeated spirit/NPC leaves temporary edible essence; hold interact exposed to interruption; server awards feed meter\n  - **Proof:** Combat and feeding cannot award loot twice\n  - **Tool:** Claude\n- [ ] **09.05 — Build hunger and instinct choices** `[ALPHA]` `[M]`\n  - **Why:** A Hollow should feel predatory\n  - **Build:** Simple hunger pressure encourages hunting without unavoidable constant death; choose target type/route\n  - **Proof:** Casual solo can progress without other player kills\n  - **Tool:** Claude\n- [ ] **09.06 — Create hunt territories** `[ALPHA]` `[M]`\n  - **Why:** Guide progression geographically\n  - **Build:** 3 small sectors with weak prey, dangerous predator, safe retreat and scent clues\n  - **Proof:** Level 1 Hollow reaches useful target under 90 sec\n  - **Tool:** Studio\n- [ ] **09.07 — Build Hollow abilities tier 1** `[ALPHA]` `[M]`\n  - **Why:** Distinct attacks with low content cost\n  - **Build:** Claw M1, lunge, roar/debuff and charging spiritual projectile; share CombatService\n  - **Proof:** All moves use server checks and useful counterplay\n  - **Tool:** Claude\n- [ ] **09.08 — Implement adaptation meter** `[BETA]` `[M]`\n  - **Why:** Encourage diverse actions\n  - **Build:** Track different kills/escapes, dodges, feed completion and challenge tags; saturating rewards stop farm\n  - **Proof:** Repeating one trivial target gives diminishing benefit\n  - **Tool:** Claude\n- [ ] **09.09 — Create first evolution test** `[ALPHA]` `[L]`\n  - **Why:** Meaningful early transformation\n  - **Build:** Defeat hunter, gather essence, survive a short chase; new silhouette/skills on success\n  - **Proof:** Evolution saved; no full reset after disconnect\n  - **Tool:** Claude + Blender\n- [ ] **09.10 — Build Gillian phase** `[BETA]` `[L]`\n  - **Why:** Avoid a slow walking punishment\n  - **Build:** Transformation becomes large high-pressure form in instance/training, with beam and pack voice; optional condensed segment\n  - **Proof:** Players do not become trapped for hours as an unwieldy giant\n  - **Tool:** Claude + Studio\n- [ ] **09.11 — Build Gillian identity challenge** `[BETA]` `[L]`\n  - **Why:** Keep individuality in the crowd\n  - **Build:** Choice/trial determines a persistent aspect/trait; escape crowd mind sequence\n  - **Proof:** Unique character state saved; failures are retryable\n  - **Tool:** ChatGPT + Claude\n- [ ] **09.12 — Create Adjuchas form** `[BETA]` `[L]`\n  - **Why:** Main midgame predator\n  - **Build:** Smaller agile model, 3 evolved skills, Hierro-like defence and aerial mobility option\n  - **Proof:** Can duel comparable NPC without massive collision bugs\n  - **Tool:** Blender + Claude\n- [ ] **09.13 — Build pack/territory progression** `[BETA]` `[M]`\n  - **Why:** Hollows need social play\n  - **Build:** Opt-in packs with shared hunts, fair loot contribution, no forced servitude mechanic\n  - **Proof:** Solo route remains viable, group route faster but not mandatory\n  - **Tool:** Claude\n- [ ] **09.14 — Create high-tier hunt boss** `[BETA]` `[L]`\n  - **Why:** Preparation for apex form\n  - **Build:** Multi-stage challenger with poison/grab/line AoE, adaptive AI and tell windows\n  - **Proof:** Boss consistently clearable with correct skill not only rare equipment\n  - **Tool:** Claude\n- [ ] **09.15 — Implement Vasto Lorde-style apex** `[LATER]` `[L]`\n  - **Why:** Reward changes silhouette strongly\n  - **Build:** More humanoid apex form, distinct aura/moveset, high control and one unique drawback\n  - **Proof:** Silhouette readable at distance; all animations and gear compatible\n  - **Tool:** Blender + Claude\n- [ ] **09.16 — Create Arrancar conversion** `[BETA]` `[L]`\n  - **Why:** Different build identity than pure Hollow\n  - **Build:** Mask fracture ceremony, partial mask fragment, sealed weapon, ability shift; old progression preserved\n  - **Proof:** No permanent loss of essential achievements/skills\n  - **Tool:** Claude + Blender\n- [ ] **09.17 — Build Arrancar weapon and sword styles** `[BETA]` `[L]`\n  - **Why:** Introduce melee depth\n  - **Build:** At least 2 weapon styles with variant combo timings, signature skill and clear counters\n  - **Proof:** One shared combat service handles claws, sword and blasts\n  - **Tool:** Claude + Studio\n- [ ] **09.18 — Create Resurrección** `[LATER]` `[L]`\n  - **Why:** Large transformation reward\n  - **Build:** Model change and 4 curated powers built from same skill system; theme carries from previous line\n  - **Proof:** PvP risk/recovery and activation checked server-side\n  - **Tool:** Blender + Claude\n- [ ] **09.19 — Design rare upper-tier release** `[LATER]` `[L]`\n  - **Why:** Not required to enjoy beta\n  - **Build:** Optional story relic/duel chain; new gameplay mechanic beyond recolour and burst\n  - **Proof:** Does not invalidate other endgame builds\n  - **Tool:** ChatGPT + Claude\n- [ ] **09.20 — Build Garganta-style world travel** `[BETA]` `[L]`\n  - **Why:** Hollow world access feels earned\n  - **Build:** Instinctive portal → controlled destinations → group travel; server verifies destination and safe teleport\n  - **Proof:** Cannot portal to protected/locked region via forged args\n  - **Tool:** Claude + TeleportService\n- [ ] **09.21 — Create Hollow endgame loop** `[LATER]` `[M]`\n  - **Why:** Predation + bosses + raids must coexist\n  - **Build:** Territory incursions, mask hunts, apex trials and faction warfare with protected newcomer zone\n  - **Proof:** Any solo apex has repeatable content without preying on novices\n  - **Tool:** Claude\n\n"},{"title":"10 — Quincy journey: precision, spirit particles and elite powers (14 deliverables)","content":"### 10 — Quincy journey: precision, spirit particles and elite powers (14 deliverables)\n\n**Goal:** A ranged/counterplay route, not a reskinned sword fighter.  \n**Prerequisites:** 06 progression and 12 ability framework  \n**Exit gate:** Beta: beginner→elite release with precision identity, gear, spiritual absorption and shared PvP balance.\n\n- [ ] **10.01 — Define Quincy progression ladder** `[BETA]` `[M]`\n  - **Why:** Give unique identity\n  - **Build:** Awakened human → apprentice → spirit archer → specialist → elite combatant → Schrift-like personal power → Vollständig-style release; rank titles proposed not canon\n  - **Proof:** Each step has training, trial and ability milestones\n  - **Tool:** ChatGPT\n- [ ] **10.02 — Build discovery and mentor quest** `[BETA]` `[M]`\n  - **Why:** Route doesn't require immediate combat\n  - **Build:** Visible spirit attack reveals perception; mentor teaches particle gathering in short safe area\n  - **Proof:** Every player can start route from original human hub\n  - **Tool:** Claude + Studio\n- [ ] **10.03 — Implement spiritual particle resource** `[BETA]` `[L]`\n  - **Why:** Ranged kit needs strategic positioning\n  - **Build:** Nearby ambient reishi nodes/regen, cap, absorption channel vulnerability and spirit reserve interface\n  - **Proof:** Cannot absorb endlessly through walls or in safe exploits\n  - **Tool:** Claude\n- [ ] **10.04 — Create modular bow models** `[BETA]` `[L]`\n  - **Why:** Distinct silhouette and readable aiming\n  - **Build:** Starter bow, heavy bow and fast bow; bows share projectile service and animation markers\n  - **Proof:** Models line up at all camera distances and controller aim\n  - **Tool:** Blender + Studio\n- [ ] **10.05 — Build projectile validation** `[BETA]` `[L]`\n  - **Why:** Anti-cheat at the heart of Quincy\n  - **Build:** Server checks origin, aim cone, travel/LOS, ammo/energy, target allegiance and rate\n  - **Proof:** Cannot use forged ray hit to damage across map\n  - **Tool:** Claude\n- [ ] **10.06 — Make precision training** `[BETA]` `[M]`\n  - **Why:** Rewards skill, not grind\n  - **Build:** Target motion range, timed weakpoint and moving-platform shot; score, medals and earnable perks\n  - **Proof:** Player with accurate timing passes below brute force level\n  - **Tool:** Claude + Studio\n- [ ] **10.07 — Add spirit archery branches** `[BETA]` `[L]`\n  - **Why:** Meaningful builds\n  - **Build:** Sniper (charge/pierce), Skirmisher (mobile volley), Support (defensive arrows); 3 moves each using same projectile schema\n  - **Proof:** 3 builds solve same trial differently\n  - **Tool:** Claude\n- [ ] **10.08 — Create mobility step** `[BETA]` `[M]`\n  - **Why:** Reposition without sword dash copy\n  - **Build:** One high-speed air step with trajectory tell, spirit cost and landing vulnerability\n  - **Proof:** Good movement with punishable end-state\n  - **Tool:** Claude\n- [ ] **10.09 — Build defensive technique** `[BETA]` `[M]`\n  - **Why:** Give counters to melee rush\n  - **Build:** Energy barrier or blut-like choice: one defensive burst and explicit cooldown\n  - **Proof:** Can stop one engage but cannot turtle forever\n  - **Tool:** Claude\n- [ ] **10.10 — Create elite military mission chain** `[BETA]` `[L]`\n  - **Why:** Differentiate faction story\n  - **Build:** Three missions: tracking incursion, sealing gateway, group escort under pressure\n  - **Proof:** No forced PvP for promotion\n  - **Tool:** Claude\n- [ ] **10.11 — Implement personal letter/power selection** `[LATER]` `[L]`\n  - **Why:** Unique flagship ability\n  - **Build:** 2–3 original signature powers selected through trials (not random power dominance); 2 upgrades each\n  - **Proof:** Rarity doesn't decide DPS advantage\n  - **Tool:** Claude + ChatGPT\n- [ ] **10.12 — Build celestial release form** `[LATER]` `[L]`\n  - **Why:** High-tier transformation\n  - **Build:** Wing/light motif originalised for shipping; spirit burst and 3 release abilities, clear drain/recovery\n  - **Proof:** Transformation cannot be stacked/duplicated\n  - **Tool:** Blender + Claude\n- [ ] **10.13 — Create Quincy vs Hollow ecological interaction** `[BETA]` `[M]`\n  - **Why:** Factions matter beyond costumes\n  - **Build:** Distinct quest/reputation responses, lore consequences and carefully limited balancing bonuses\n  - **Proof:** No side gets effortless PvE farming superiority\n  - **Tool:** Claude\n- [ ] **10.14 — Build Quincy elite endgame** `[LATER]` `[L]`\n  - **Why:** Endgame alternative to PvP\n  - **Build:** Containment missions, spirit experiments, shooting challenge tower and group hunts\n  - **Proof:** Skill and support roles remain valuable at highest tier\n  - **Tool:** Claude\n\n"},{"title":"11 — Optional Fullbringer/human specialist expansion (8 deliverables)","content":"### 11 — Optional Fullbringer/human specialist expansion (8 deliverables)\n\n**Goal:** Future fourth identity built on item bonds and mobility tricks.  \n**Prerequisites:** All three main races working  \n**Exit gate:** Expansion path has a complete design but implementation starts only after beta validation.\n\n- [ ] **11.01 — Decide whether fourth route adds value** `[LATER]` `[S]`\n  - **Why:** Complexity should justify itself\n  - **Build:** Survey players about a tool/object-bond human route compared with improving existing races\n  - **Proof:** Enough interest and capacity before greenlight\n  - **Tool:** ChatGPT + survey\n- [ ] **11.02 — Write beginner human specialist arc** `[LATER]` `[M]`\n  - **Why:** Start relatable\n  - **Build:** Ordinary human discovers object resonance during crisis and enters a small mentor challenge\n  - **Proof:** Can start without resetting existing characters\n  - **Tool:** ChatGPT\n- [ ] **11.03 — Build object affinity schema** `[LATER]` `[M]`\n  - **Why:** One framework for multiple objects\n  - **Build:** Ability theme from object tags: speed, protection, reach, trap, summon; visuals change but services shared\n  - **Proof:** Create third test item only with metadata\n  - **Tool:** Claude\n- [ ] **11.04 — Implement awakening item** `[LATER]` `[L]`\n  - **Why:** Signature identity\n  - **Build:** Player picks earned object, learns 2 actions and modifies it through mastery\n  - **Proof:** No item loss on disconnect\n  - **Tool:** Claude + Studio\n- [ ] **11.05 — Create three combat archetypes** `[LATER]` `[L]`\n  - **Why:** Prevent weak cosmetic faction\n  - **Build:** Brawler, trickster, support; each has 3 abilities and distinctive movement\n  - **Proof:** All pass baseline duel and PvE test\n  - **Tool:** Claude\n- [ ] **11.06 — Create human specialist story missions** `[LATER]` `[L]`\n  - **Why:** Justify endgame\n  - **Build:** City investigation, capture rogue spirit, protect civilian district, duel mentor\n  - **Proof:** Repeatable but not endless kill quests\n  - **Tool:** Claude\n- [ ] **11.07 — Build final object manifestation** `[LATER]` `[L]`\n  - **Why:** Endgame transformation\n  - **Build:** Upgrade changes item function, 1 powerful new mechanic and silhouette\n  - **Proof:** Release does not outclass all prior races\n  - **Tool:** Blender + Claude\n- [ ] **11.08 — Add endgame faction neutrality** `[LATER]` `[M]`\n  - **Why:** This route's unique social value\n  - **Build:** Contract missions and exploration bonuses for choosing alliances\n  - **Proof:** Can cooperate with every faction without exploit\n  - **Tool:** Claude\n\n"},{"title":"12 — Reiatsu, abilities, status effects and transformation framework (15 deliverables)","content":"### 12 — Reiatsu, abilities, status effects and transformation framework (15 deliverables)\n\n**Goal:** One extensible power engine for all races; starts alongside combat and underpins their content phases.  \n**Prerequisites:** 02 authoritative resources and 04 combat  \n**Exit gate:** Adding a new skill requires a definition, animation and VFX config rather than a new service.\n\n- [ ] **12.01 — Create ability metadata schema** `[CORE]` `[M]`\n  - **Why:** Scale to many powers\n  - **Build:** Cost, cooldown, cast time, move hit shape, damage/CC tags, animation/VFX/SFX, interrupt rules and eligibility\n  - **Proof:** Schema rejects omitted critical fields\n  - **Tool:** Luau + tests\n- [ ] **12.02 — Build AbilityService** `[CORE]` `[L]`\n  - **Why:** Central authoritative cast handling\n  - **Build:** Validate faction/unlock/state/cost/time/range before entering cast; fail feedback without wasting resources\n  - **Proof:** Fake cast requests never deal damage\n  - **Tool:** Claude\n- [ ] **12.03 — Build reusable shape hitboxes** `[CORE]` `[L]`\n  - **Why:** Many moves share geometry\n  - **Build:** Cone, box, ray, sphere, projectile and multi-tick zone effects via server spatial queries\n  - **Proof:** Debug overlays match actual hit regions\n  - **Tool:** Claude + Studio\n- [ ] **12.04 — Build projectile service** `[ALPHA]` `[L]`\n  - **Why:** Avoid hundreds of independent ray loops\n  - **Build:** Support hitscan-like thin beam, travel bolt, explosive end, server-owned collision\n  - **Proof:** Long-range attacks cannot pass through walls\n  - **Tool:** Claude\n- [ ] **12.05 — Build area effect service** `[ALPHA]` `[M]`\n  - **Why:** Bosses and elemental skills need it\n  - **Build:** Persistent circle/wall/trap with periodic ticks, stacking rules and lifetimes\n  - **Proof:** No player receives duplicate tick damage from reconnect\n  - **Tool:** Claude\n- [ ] **12.06 — Make status effect registry** `[CORE]` `[M]`\n  - **Why:** One slow/burn/bind policy\n  - **Build:** Effect IDs, stack policy, duration, cleanse tags, source ownership and immunity; one cleanup loop\n  - **Proof:** Stuns/burns cannot stack infinitely\n  - **Tool:** Claude + tests\n- [ ] **12.07 — Create transformation state service** `[ALPHA]` `[L]`\n  - **Why:** Multiple races use releases\n  - **Build:** Prerequisites, cast windup, duration/upkeep, buff cap, cancel, cooldown, death cleanup\n  - **Proof:** Two release buttons cannot stack forms\n  - **Tool:** Claude\n- [ ] **12.08 — Define personal spirit/identity attributes** `[BETA]` `[M]`\n  - **Why:** Supports deep RPG goals\n  - **Build:** One compact authored trait model from story choices/play patterns; no live generative powers required\n  - **Proof:** Same inputs regenerate correct saved style\n  - **Tool:** ChatGPT + Claude\n- [ ] **12.09 — Build spiritual sensing** `[BETA]` `[M]`\n  - **Why:** Bleach-like feel, not compulsory combat UI\n  - **Build:** Client-side sensed aura/markers based on observer capability, range, concealment and permission\n  - **Proof:** A stronger observer can read a weaker target without server trust violation\n  - **Tool:** Claude\n- [ ] **12.10 — Build release and conceal mechanics** `[BETA]` `[L]`\n  - **Why:** Encourage stealth and pressure management\n  - **Build:** Define reserve, actual output, concealed state, action-driven output, reveal on cast and decaying signatures\n  - **Proof:** Concealed player still pays correct energy; visual response is smooth\n  - **Tool:** Claude\n- [ ] **12.11 — Implement pressure field prototype** `[LATER]` `[L]`\n  - **Why:** Spectacle must not grief\n  - **Build:** Compute server field only in eligible zones; viewer-relative audiovisual intensity; resist/escape counteractions\n  - **Proof:** No collapse or lethal damage in spawn safe area\n  - **Tool:** Claude\n- [ ] **12.12 — Build PvE-only effect variants** `[ALPHA]` `[M]`\n  - **Why:** Make impressive skills mobile-safe\n  - **Build:** Central emitter budgets, client-local far FX, pooled parts and level of detail\n  - **Proof:** 20 simultaneous impacts don't create thousands of lingering instances\n  - **Tool:** Studio + Claude\n- [ ] **12.13 — Create ability editor data audit** `[CORE]` `[M]`\n  - **Why:** Consistency speeds balancing\n  - **Build:** Script prints cooldown/damage/cost/CC/pvpMultiplier and spots outliers for each skill\n  - **Proof:** No missing VFX key or unreachable unlock\n  - **Tool:** Python/Claude\n- [ ] **12.14 — Build two base element libraries** `[ALPHA]` `[M]`\n  - **Why:** No need to reinvent the wheel\n  - **Build:** Shared beam, sliver, ring, trail, slash, aura, projectile modules with palette swaps\n  - **Proof:** 3 visually different abilities can reuse same mesh/effect family\n  - **Tool:** Studio + Blender\n- [ ] **12.15 — Make transformation regression suite** `[ALPHA]` `[L]`\n  - **Why:** Forms are easy to break\n  - **Build:** Cast while stunned, cross realm, die mid animation, unequip, join late, mobile cast, PvP zone boundary\n  - **Proof:** Every test ends in a legal state and synchronized appearance\n  - **Tool:** Studio tests\n\n"},{"title":"13 — World building, realms and travel (14 deliverables)","content":"### 13 — World building, realms and travel (14 deliverables)\n\n**Goal:** Build dense navigable play spaces before expanding size.  \n**Prerequisites:** 07 opening world, 09/10 route destinations  \n**Exit gate:** Each realm contains repeatable activity, clear landmarks and a tested entry/exit route.\n\n- [ ] **13.01 — Draw high-level world route map** `[CORE]` `[M]`\n  - **Why:** Geography serves gameplay\n  - **Build:** Human city, spiritual realm, Hollow desert, remote Quincy stronghold, training instances; define who can access when\n  - **Proof:** Every location exists for a quest/event/loop\n  - **Tool:** ChatGPT diagram\n- [ ] **13.02 — Greybox main city first** `[CORE]` `[L]`\n  - **Why:** Test traversal not visuals\n  - **Build:** One town block plus outskirts with 5 landmarks, quest lanes, safety regions and travel times\n  - **Proof:** Player navigates without teleport spamming\n  - **Tool:** Studio Parts\n- [ ] **13.03 — Create region and biome tags** `[CORE]` `[M]`\n  - **Why:** Quest and spawn systems need consistent areas\n  - **Build:** Tag boundaries, default PvP rule, enemy pool, atmosphere preset, teleport restrictions\n  - **Proof:** Changing region changes rule/UI correctly\n  - **Tool:** Claude + CollectionService\n- [ ] **13.04 — Build interactive props/doors** `[ALPHA]` `[M]`\n  - **Why:** World should have systems\n  - **Build:** Doors, noticeboards, benches, vendors, portals, shortcuts, checkpoints from reusable interaction schema\n  - **Proof:** New interactable is configuration only\n  - **Tool:** Claude\n- [ ] **13.05 — Build spiritual district destination** `[ALPHA]` `[L]`\n  - **Why:** First faction home\n  - **Build:** Distinct safe town with barracks/training, bridge to field mission and useful vendors\n  - **Proof:** Reaper route can complete first chapter without huge map\n  - **Tool:** Studio + Blender\n- [ ] **13.06 — Build Hollow desert entry** `[ALPHA]` `[L]`\n  - **Why:** Different mood and traversal\n  - **Build:** Small dunes, dead trees, caves, ring arena and visible far fortress silhouette; scale after test\n  - **Proof:** Beginner Hollow finds prey and escape within 2 min\n  - **Tool:** Studio Terrain + Blender\n- [ ] **13.07 — Build Quincy base** `[BETA]` `[L]`\n  - **Why:** Faction differentiation\n  - **Build:** One compact training fort with bow lanes, materials node and mission board\n  - **Proof:** Quincy test loop works without full mega-map\n  - **Tool:** Studio\n- [ ] **13.08 — Design procedural prop kit** `[ALPHA]` `[L]`\n  - **Why:** Solo creator needs modular construction\n  - **Build:** 6 wall types, 4 roofs, 3 doors, 6 rocks, 4 trees, 5 clutter assets with snap grid and LOD\n  - **Proof:** Build a district from kit with no bespoke modelling\n  - **Tool:** Blender + Studio\n- [ ] **13.09 — Create atmosphere presets** `[ALPHA]` `[M]`\n  - **Why:** Mood comes from controlled lighting\n  - **Build:** Per-zone ColorCorrection, Atmosphere, reverb and ambient sound; accessible contrast presets\n  - **Proof:** Players and telegraphs readable under all presets\n  - **Tool:** Studio\n- [ ] **13.10 — Add travel portals** `[BETA]` `[L]`\n  - **Why:** Multi-realm access\n  - **Build:** Server checks unlock + party size + destination; graceful TeleportAsync fallback; never grant rewards via TeleportData\n  - **Proof:** Published cross-place round trip preserves profile\n  - **Tool:** Claude + published test\n- [ ] **13.11 — Add streamed world optimisation** `[BETA]` `[L]`\n  - **Why:** Large maps need isolation\n  - **Build:** Enable/test streaming in appropriate places, prioritise collision near spawn and required landmarks\n  - **Proof:** No falls into unloaded terrain in test\n  - **Tool:** Studio\n- [ ] **13.12 — Design hidden discovery rewards** `[BETA]` `[M]`\n  - **Why:** Exploration gives purpose\n  - **Build:** Add rare enemy, lore fragments, cosmetics, achievement route and vertical secret\n  - **Proof:** At least 3 reasons to explore each map\n  - **Tool:** ChatGPT + Studio\n- [ ] **13.13 — Create safe navigation and recovery** `[ALPHA]` `[M]`\n  - **Why:** Death cannot strand users\n  - **Build:** World fallback positions, invalid spawn check, return-to-hub, portal recovery from failure\n  - **Proof:** Character never persists in void after teleport fail\n  - **Tool:** Claude\n- [ ] **13.14 — Benchmark server population** `[BETA]` `[L]`\n  - **Why:** Do not guess capacity\n  - **Build:** Test 8, 16, 24 and 30 players with representative NPC/VFX, choose server cap from frame/network results\n  - **Proof:** Recorded FPS/memory/ping before decision\n  - **Tool:** Studio + real testers\n\n"},{"title":"14 — Bosses, events, dungeons and repeatable PvE (14 deliverables)","content":"### 14 — Bosses, events, dungeons and repeatable PvE (14 deliverables)\n\n**Goal:** Build varied group content that lasts beyond first level cap.  \n**Prerequisites:** 05 AI, 06 rewards, 12 skills, 13 world  \n**Exit gate:** One polished solo boss and one group encounter work repeatedly without quest/data issues.\n\n- [ ] **14.01 — Define boss rules & budgets** `[ALPHA]` `[M]`\n  - **Why:** Bosses should be fun not damage sponges\n  - **Build:** Write telegraph/windup, phase transition, arena sizes, time targets, stagger, reset, loot contribution and accessibility\n  - **Proof:** Boss phase does not trigger at arbitrary client HP\n  - **Tool:** ChatGPT + Claude\n- [ ] **14.02 — Build first tutorial mini-boss** `[CORE]` `[L]`\n  - **Why:** Reuse G2 assets\n  - **Build:** Two telegraphed patterns, a guard-break, interruptible skill and death reward\n  - **Proof:** Solo level-appropriate tester succeeds in 2–4 attempts\n  - **Tool:** Claude + Studio\n- [ ] **14.03 — Build first realm boss** `[ALPHA]` `[L]`\n  - **Why:** A headline co-op goal\n  - **Build:** Unique silhouette and 3 attack patterns; at 50% enters phase 2, adds area denial and new timing\n  - **Proof:** 2-player party wins by learning tells not exploit\n  - **Tool:** Blender + Studio\n- [ ] **14.04 — Create encounter instance manager** `[BETA]` `[L]`\n  - **Why:** Dungeons can't depend on overworld griefing\n  - **Build:** Reserve small private instance or safe zoned interior, join/exit/cleanup, hard timeout\n  - **Proof:** Leaving/disconnecting cleans encounter without duplication\n  - **Tool:** Claude\n- [ ] **14.05 — Build dungeon objective sequence** `[BETA]` `[L]`\n  - **Why:** More than a boss room\n  - **Build:** Explore → puzzle/interact → defend point → mini-boss → final boss with checkpoints\n  - **Proof:** Group can finish in 15–25 min without resetting all on wipe\n  - **Tool:** Claude + Studio\n- [ ] **14.06 — Implement adaptive party scaling** `[BETA]` `[M]`\n  - **Why:** Balance 1–4 players\n  - **Build:** Scale adds and attack density by team size, capped HP scaling, revive budget and contribution thresholds\n  - **Proof:** Solo and four-player encounter both manageable\n  - **Tool:** Claude\n- [ ] **14.07 — Create fair boss loot tables** `[BETA]` `[M]`\n  - **Why:** Replay matters without gambling pressure\n  - **Build:** Guaranteed XP/material, earnable progression tokens, low-chance cosmetics disclosed in in-game preview\n  - **Proof:** No need to pay real money for random essential power\n  - **Tool:** Claude\n- [ ] **14.08 — Build rescue and revive system** `[BETA]` `[M]`\n  - **Why:** Make co-op collaborative\n  - **Build:** Downed window with invulnerability limits, teammate hold-to-revive, diminishing repeats and safe respawn\n  - **Proof:** No chain revive immortality in boss room\n  - **Tool:** Claude\n- [ ] **14.09 — Build dynamic city incursion event** `[BETA]` `[L]`\n  - **Why:** World feels alive\n  - **Build:** At safe intervals mark attack zone, NPC alert, waves, mini-boss, cleanup, contributor rewards\n  - **Proof:** Event never destroys safe new-player hub progress\n  - **Tool:** Claude + Studio\n- [ ] **14.10 — Create Hollow hunting event** `[BETA]` `[M]`\n  - **Why:** Faction fantasy distinct\n  - **Build:** Predators compete for food/territory against AI; optional player conflict with opt-in zone\n  - **Proof:** Solo Hollow has non-PvP route\n  - **Tool:** Claude\n- [ ] **14.11 — Create spiritual defence event** `[BETA]` `[M]`\n  - **Why:** Reaper faction social role\n  - **Build:** Protect lanes, escort spirits, use binding and healing for contribution, reward protection\n  - **Proof:** Support players earn appropriate rewards\n  - **Tool:** Claude\n- [ ] **14.12 — Create elite ranged defence** `[BETA]` `[M]`\n  - **Why:** Quincy faction identity\n  - **Build:** Moving targets and shield/objective integrity, precision rewards not merely damage\n  - **Proof:** Archer support and precision matter to success\n  - **Tool:** Claude\n- [ ] **14.13 — Instrument encounter performance** `[BETA]` `[M]`\n  - **Why:** Many bosses cause FX spikes\n  - **Build:** Record 4 players, 15 enemies, overlapping abilities, visual tier; test across mobile\n  - **Proof:** No unbounded emitter growth; boss network remains stable\n  - **Tool:** Studio Profiler\n- [ ] **14.14 — Build seasonal rotating challenges** `[LATER]` `[M]`\n  - **Why:** Endgame without huge dev labour\n  - **Build:** Modify enemy loadouts, objective timers, boss attack patterns from approved configs\n  - **Proof:** Weekly rotation requires data change, not new script rewrite\n  - **Tool:** Claude\n\n"},{"title":"15 — PvP, factions, social and competitive integrity (14 deliverables)","content":"### 15 — PvP, factions, social and competitive integrity (14 deliverables)\n\n**Goal:** Make competition a rewarding optional layer, not grief-based progression.  \n**Prerequisites:** 04 multiplayer combat and 06 profiles  \n**Exit gate:** Two-person arena is fair; no beginner can be repeatedly forced into PvP at spawn.\n\n- [ ] **15.01 — Define PvP eligibility** `[CORE]` `[M]`\n  - **Why:** Avoid forced beginner harassment\n  - **Build:** Safe zones, level brackets, opt-in duel, event zones and clear faction-war warnings\n  - **Proof:** Attacks in protected hubs do zero PvP damage\n  - **Tool:** Claude + design\n- [ ] **15.02 — Create duel invitations** `[ALPHA]` `[M]`\n  - **Why:** Friends need practice\n  - **Build:** Consent request/accept, countdown, arena rules, surrender and result; limit repeat requests\n  - **Proof:** Duel does not consume permanent quest lives\n  - **Tool:** Claude\n- [ ] **15.03 — Build normalized training arena** `[ALPHA]` `[M]`\n  - **Why:** Find real skill imbalances\n  - **Build:** Equalized stats and loadout presets for practice mode separate from open world\n  - **Proof:** Same build testable with/without gear\n  - **Tool:** Claude\n- [ ] **15.04 — Implement combat anti-grief rules** `[ALPHA]` `[M]`\n  - **Why:** Respect player time\n  - **Build:** No spawn-kill loops, new-player shields, combat logout consequences proportional, safe exits\n  - **Proof:** Player can reach quests despite stronger enemy nearby\n  - **Tool:** Claude\n- [ ] **15.05 — Create party system** `[BETA]` `[M]`\n  - **Why:** Co-op is essential to retention\n  - **Build:** Invite/join/leave/leader, display markers, consent before transfer, small party cap 4\n  - **Proof:** Invite recipient joining mid-mission handled correctly\n  - **Tool:** Claude\n- [ ] **15.06 — Build party quest contribution** `[BETA]` `[M]`\n  - **Why:** Prevent carry exploits\n  - **Build:** Track participation, eligible range, objective ownership and recovery on disconnect\n  - **Proof:** Inactive party member cannot AFK farm indefinitely\n  - **Tool:** Claude\n- [ ] **15.07 — Implement faction reputation** `[BETA]` `[M]`\n  - **Why:** Race choice should matter\n  - **Build:** Reputation tasks, unlocked uniforms/titles/quests, no huge permanent damage bonuses\n  - **Proof:** Reputation changes visible but can't ruin PvP balance\n  - **Tool:** Claude\n- [ ] **15.08 — Create ranked match queue** `[LATER]` `[L]`\n  - **Why:** Ranked requires measured concurrency\n  - **Build:** Opt-in 1v1 and later 2v2 queue, skill bands, match timeout and no punishment on server failure\n  - **Proof:** No rank lost due to Roblox teleport error\n  - **Tool:** Claude + MemoryStore\n- [ ] **15.09 — Build match results authority** `[LATER]` `[L]`\n  - **Why:** Prevent forged wins\n  - **Build:** Server signs result, rate limits, records participants, verifies match state and unique match ID\n  - **Proof:** Cannot call win RemoteEvent to award rank\n  - **Tool:** Claude\n- [ ] **15.10 — Create seasonal ladder and rewards** `[LATER]` `[L]`\n  - **Why:** Retention without power escalation\n  - **Build:** Seasons, cosmetic rank rewards, resets with placement retention, anti-boost rules\n  - **Proof:** Rank prizes do not confer direct combat advantage\n  - **Tool:** Claude\n- [ ] **15.11 — Design cross-faction conflict events** `[LATER]` `[L]`\n  - **Why:** Large-scale play shouldn't force ganking\n  - **Build:** Scheduled opt-in fronts with NPC objectives, defensible capture points, contribution rewards\n  - **Proof:** Outnumbered defenders have non-damage objectives\n  - **Tool:** ChatGPT + Claude\n- [ ] **15.12 — Create social moderation features** `[BETA]` `[M]`\n  - **Why:** Teen community needs safety\n  - **Build:** Mute/report entry points, Roblox native chat/filter integration, no unfiltered user text\n  - **Proof:** Abusive usernames/text are not re-rendered unfiltered\n  - **Tool:** Roblox TextChatService\n- [ ] **15.13 — Build friend party travel** `[BETA]` `[L]`\n  - **Why:** People must stay together\n  - **Build:** Teleport same party, handle failure individually, reunion offer at destination\n  - **Proof:** Failed member can rejoin without data loss\n  - **Tool:** Claude + TeleportService\n- [ ] **15.14 — Create accessibility parity rules for PvP** `[BETA]` `[M]`\n  - **Why:** VFX shouldn't be mandatory\n  - **Build:** Telegraphs visible under low FX and reduced motion; attacks remain fair on mobile\n  - **Proof:** Low graphics player reads same threat timings\n  - **Tool:** Studio + testers\n\n"},{"title":"16 — Visual identity, character modelling, VFX, UI and sound (16 deliverables)","content":"### 16 — Visual identity, character modelling, VFX, UI and sound (16 deliverables)\n\n**Goal:** Polish proven gameplay in reusable asset families rather than isolated effects.  \n**Prerequisites:** G1 gameplay and 12 ability framework  \n**Exit gate:** Recognisable original brand, clear UI and strong but controlled effects across three device classes.\n\n- [ ] **16.01 — Create UI wireframe before decoration** `[CORE]` `[M]`\n  - **Why:** Navigation matters more than ornaments\n  - **Build:** Draft main menu, character slots, progression, quest journal, inventory, settings and map in grayscale\n  - **Proof:** All pages reachable in max 3 actions from gameplay\n  - **Tool:** ChatGPT + Studio UI\n- [ ] **16.02 — Build HUD layout** `[CORE]` `[M]`\n  - **Why:** Combat data must remain readable\n  - **Build:** Health, stamina, spirit, equipped moves, selected target, interaction and current quest; anchored with safe areas\n  - **Proof:** Small phone HUD does not overlap jump/attack\n  - **Tool:** Studio UI\n- [ ] **16.03 — Build responsive UI components** `[ALPHA]` `[L]`\n  - **Why:** One consistent system\n  - **Build:** Reusable button, tabs, toast, modal, tooltip, scroll list, icon+label and controller focus handling\n  - **Proof:** Switch screen sizes without rebuilding each menu\n  - **Tool:** Claude\n- [ ] **16.04 — Create brand kit** `[BETA]` `[M]`\n  - **Why:** Original aesthetic sells identity\n  - **Build:** Use small original NUMEN emblem, 2 fonts, 1 accent palette, panels, 3 icon styles; document use rules\n  - **Proof:** UI screenshots read as one product\n  - **Tool:** Inkscape + Krita\n- [ ] **16.05 — Build visual effects core** `[CORE]` `[L]`\n  - **Why:** Avoid unpooled dozens of spells\n  - **Build:** VFXService with definitions, emitters, Beam attachments, lifetimes, pooling and quality tiers\n  - **Proof:** Repeated use leaves no orphan effects\n  - **Tool:** Claude + Studio\n- [ ] **16.06 — Create hit feedback family** `[CORE]` `[L]`\n  - **Why:** Combat feel first\n  - **Build:** Small slash trails, impact sparks, guard flash, parry flash, screen response and distinct audio; test with no large glow\n  - **Proof:** Tester distinguishes hit, miss, guard and parry\n  - **Tool:** Studio + Audacity\n- [ ] **16.07 — Create elemental effect library** `[ALPHA]` `[L]`\n  - **Why:** Reuse rather than hand-craft every cast\n  - **Build:** Core/sliver/ring/bolt/cloud classes, colour/size/animation variants, LOD; no camera-facing fake 3D on important geometry\n  - **Proof:** Three effects share common defs and look different\n  - **Tool:** Studio + Blender\n- [ ] **16.08 — Create animation naming/export standard** `[CORE]` `[M]`\n  - **Why:** Hundreds of lost asset IDs are a risk\n  - **Build:** Source .blend or Studio animation, animation ID manifest, rig type, priority, markers, credits\n  - **Proof:** Every skill resolves valid asset ID\n  - **Tool:** Studio Animation Editor\n- [ ] **16.09 — Design starter faction character kits** `[ALPHA]` `[L]`\n  - **Why:** Consistent character silhouettes\n  - **Build:** One Reaper outfit, one Hollow base, one Quincy outfit; layer accessory/costume variants\n  - **Proof:** Works on selected rig in Idle/run/dodge/attack\n  - **Tool:** Blender + Studio\n- [ ] **16.10 — Create modular weapon library** `[ALPHA]` `[L]`\n  - **Why:** Model once and iterate\n  - **Build:** Simple katana, guardless blade, heavy sword, bow, claw attachments with standardized handles\n  - **Proof:** All weapons equip without changing combat code\n  - **Tool:** Blender\n- [ ] **16.11 — Build sound design bus** `[ALPHA]` `[M]`\n  - **Why:** Avoid deafening effects\n  - **Build:** Master/Music/SFX/Ambience/Voice groups, dynamic volume and roll-off presets; accessible mix sliders\n  - **Proof:** Overlapping abilities never clip excessively\n  - **Tool:** Audacity + SoundService\n- [ ] **16.12 — Create original ambience for three areas** `[BETA]` `[M]`\n  - **Why:** World atmosphere\n  - **Build:** Wind/city/quiet district layers and region transitions with approved licenses\n  - **Proof:** Transitions do not restart tracks every frame\n  - **Tool:** Audacity + Studio\n- [ ] **16.13 — Create character preview and emotes** `[BETA]` `[M]`\n  - **Why:** Cosmetics enhance identity\n  - **Build:** Inventory preview rig, simple pose, colour/pattern variant and 4 emotes\n  - **Proof:** Preview matches in-game appearance\n  - **Tool:** Studio\n- [ ] **16.14 — Implement graphic settings presets** `[ALPHA]` `[M]`\n  - **Why:** Phone performance matters\n  - **Build:** Low/Medium/High for particles, lights, reflections, atmosphere and shadows; respect user choice\n  - **Proof:** Low tier retains readable attack tells\n  - **Tool:** Claude + Studio\n- [ ] **16.15 — Build ability teaser cinematics** `[LATER]` `[M]`\n  - **Why:** Marketing after actual functionality\n  - **Build:** 6–12 second captured game clips showing clear combat rather than unrealistic fake art\n  - **Proof:** Trailer matches attainable in-game visual quality\n  - **Tool:** OBS + free video editor\n- [ ] **16.16 — Create effects photosensitivity pass** `[ALPHA]` `[M]`\n  - **Why:** Flashes and shaking can alienate\n  - **Build:** Cap brightness, avoid rapid strobing, add reduced-flash/reduced-shake toggles\n  - **Proof:** VFX remains readable under accessibility settings\n  - **Tool:** Studio\n\n"},{"title":"17 — Quality assurance, performance, data safety and exploit tests (14 deliverables)","content":"### 17 — Quality assurance, performance, data safety and exploit tests (14 deliverables)\n\n**Goal:** Measure reliability across PC, phone and real multiplayer sessions.  \n**Prerequisites:** All prototype systems; repeat throughout development  \n**Exit gate:** Every public gate has a reproducible test report and no P0 blocker.\n\n- [ ] **17.01 — Create test matrix** `[CORE]` `[M]`\n  - **Why:** No 'works on my machine' assumptions\n  - **Build:** List desktop, low-end phone simulator, controller, 1/2/4 players, different ping and graphics tiers\n  - **Proof:** All core actions checked on matrix\n  - **Tool:** Markdown + Studio\n- [ ] **17.02 — Automate unit fixture suite** `[CORE]` `[M]`\n  - **Why:** AI refactors frequently break basic rules\n  - **Build:** Tests for calculations, migrations, inventory, quest requirements and cooldowns\n  - **Proof:** Every commit runs fixtures successfully\n  - **Tool:** TestEZ/Claude\n- [ ] **17.03 — Build 2/4-player integration scripts** `[CORE]` `[L]`\n  - **Why:** Networking bugs hide in solo test\n  - **Build:** Spawn, fight, duel, party, simultaneous reward, leave/join using Server & Clients or StudioTestService\n  - **Proof:** No different HP or duplicate reward across clients\n  - **Tool:** Studio\n- [ ] **17.04 — Test profiles under failure** `[CORE]` `[L]`\n  - **Why:** Data integrity above all\n  - **Build:** Simulate throttled saves, disconnect, server shutdown, migration, teleports and double join\n  - **Proof:** No profile loss or double item after 50 iterations\n  - **Tool:** Studio published test\n- [ ] **17.05 — Audit all RemoteEvents** `[CORE]` `[L]`\n  - **Why:** Exploit resistance\n  - **Build:** List input schema, rate limit, server permission, cooldown, distance and authority for each remote\n  - **Proof:** Every remote has tests for malformed/infinite/untrusted payloads\n  - **Tool:** Claude + Studio\n- [ ] **17.06 — Benchmark representative busy fight** `[ALPHA]` `[M]`\n  - **Why:** FX/AI scales with players\n  - **Build:** 4 players + 12 NPCs casting combos in same arena, measure client FPS, server script/frame, memory and bandwidth\n  - **Proof:** Numbers recorded before each optimisation claim\n  - **Tool:** Studio MicroProfiler\n- [ ] **17.07 — Test load and streaming** `[BETA]` `[L]`\n  - **Why:** Big realms suffer join bugs\n  - **Build:** Profile loading, initial terrain availability, mission NPC and portal visibility on low graphics\n  - **Proof:** Spawn safe and interactive on baseline test device\n  - **Tool:** Studio\n- [ ] **17.08 — Check asset memory and draw calls** `[ALPHA]` `[M]`\n  - **Why:** Lower tier should not overheat\n  - **Build:** Inspect mesh count, triangle budget, texture resolution, transparency and sound instances\n  - **Proof:** Remove biggest bottlenecks before adding more effects\n  - **Tool:** Studio profiler\n- [ ] **17.09 — Run input/accessibility audit** `[ALPHA]` `[M]`\n  - **Why:** Players use different devices\n  - **Build:** Small phone, touch, controller, colour contrast, motion off and subtitles\n  - **Proof:** Every tutorial and boss can be completed without keyboard\n  - **Tool:** Studio Device Emulator\n- [ ] **17.10 — Conduct novice test cohort** `[ALPHA]` `[M]`\n  - **Why:** Design clarity is empirical\n  - **Build:** 5–10 testers not involved in development; observe first 30 min, confusion points, FPS and return intention\n  - **Proof:** Record top 5 blockers and retest after fixes\n  - **Tool:** OBS + feedback form\n- [ ] **17.11 — Record balancing evidence** `[BETA]` `[M]`\n  - **Why:** Avoid anecdotal 'OP' fixes\n  - **Build:** Duel win rate by style, enemy time-to-kill, skill hit rate, deaths and resource constraints\n  - **Proof:** Patch based on data and footage not only one loud player\n  - **Tool:** Analytics + Python\n- [ ] **17.12 — Create release regression checklist** `[ALPHA]` `[M]`\n  - **Why:** Updates must not destroy older paths\n  - **Build:** Test new slot, save, combat, quests, keybinds, all faction awakenings, teleport, shop and bosses each patch\n  - **Proof:** No critical regression prior to deploy\n  - **Tool:** GitHub + Studio\n- [ ] **17.13 — Define disaster rollback drill** `[BETA]` `[M]`\n  - **Why:** Live issues need calm response\n  - **Build:** Backup last good place/source and data migrations; rehearse disabling feature and rolling back via flags\n  - **Proof:** Recovery demonstrated in nonproduction test\n  - **Tool:** Git + Studio\n- [ ] **17.14 — Measure server-size scaling** `[BETA]` `[L]`\n  - **Why:** Pick population from evidence\n  - **Build:** 8/16/24/30 player stress with AI and attacks; compare memory, ping, CPU and player spread\n  - **Proof:** Select safe maxPlayers backed by test report\n  - **Tool:** Published test + Studio\n\n"},{"title":"18 — Fair monetisation, legal checks and player trust (10 deliverables)","content":"### 18 — Fair monetisation, legal checks and player trust (10 deliverables)\n\n**Goal:** Finance development only after people love playing.  \n**Prerequisites:** Playable beta and legal review  \n**Exit gate:** Every monetised product is accurately advertised, safe and not competitive pay-to-win.\n\n- [ ] **18.01 — Create IP permission checklist** `[CORE]` `[M]`\n  - **Why:** Anime content is protected\n  - **Build:** Check rights to name, art, anime music, character likenesses, specific maps, voice lines and logo; seek approved licence or original replacements\n  - **Proof:** Every shipped asset has origin/permission entry\n  - **Tool:** Creator Hub + asset ledger\n- [ ] **18.02 — Define cosmetic catalogue** `[BETA]` `[M]`\n  - **Why:** Fair paid options\n  - **Build:** Original sword trails, outfits, poses, emotes, profile styles and noncompetitive effects\n  - **Proof:** Never changes hitbox, reach, damage or PvP visibility\n  - **Tool:** ChatGPT + Studio\n- [ ] **18.03 — Define convenience boundaries** `[BETA]` `[M]`\n  - **Why:** Convenience cannot pressure minors\n  - **Build:** Reasonable cosmetics/extra storage; avoid skipping major paid gates and XP multipliers in competitive environment\n  - **Proof:** Free player can earn every combat-relevant power\n  - **Tool:** ChatGPT\n- [ ] **18.04 — Avoid paid random abilities** `[LATER]` `[M]`\n  - **Why:** Policy + trust risk\n  - **Build:** No pay-to-spin powers; if any random paid cosmetic later, follow odds, regional PolicyService restrictions and age rules\n  - **Proof:** No restricted player can access prohibited purchase\n  - **Tool:** Claude + Roblox PolicyService\n- [ ] **18.05 — Implement safe purchase service** `[BETA]` `[L]`\n  - **Why:** Robux needs exact receipt processing\n  - **Build:** MarketplaceService.ProcessReceipt on server; idempotent grants, receipt ledger and failure retry\n  - **Proof:** Duplicate receipt cannot grant twice\n  - **Tool:** Claude\n- [ ] **18.06 — Create clear shop previews** `[BETA]` `[M]`\n  - **Why:** Players know what they pay for\n  - **Build:** Show exact item, price, permanence and effect; avoid false timers or pressure language\n  - **Proof:** UI accurately previews applied cosmetic\n  - **Tool:** Studio UI\n- [ ] **18.07 — Plan free retention rewards** `[BETA]` `[M]`\n  - **Why:** Returning shouldn't feel like work\n  - **Build:** Daily/weekly challenges with optional milestones and catch-up; no gambling dependency\n  - **Proof:** Missing a day doesn't permanently punish player\n  - **Tool:** ChatGPT + Claude\n- [ ] **18.08 — Test purchases in sandbox** `[BETA]` `[M]`\n  - **Why:** Never test first transaction in production\n  - **Build:** Roblox sandbox/appropriate test workflows, cancelled transaction, insufficient funds, receipt retry\n  - **Proof:** Correct purchase or no grant, never silent disappearance\n  - **Tool:** Studio test\n- [ ] **18.09 — Write community standards** `[BETA]` `[S]`\n  - **Why:** Teen safety and tone\n  - **Build:** Moderation, exploit reporting, no real-money trading, credits, privacy and spoiler policy\n  - **Proof:** Rules accessible in game and community space\n  - **Tool:** Markdown + Creator Hub\n- [ ] **18.10 — Plan real spending cap** `[CORE]` `[S]`\n  - **Why:** Stay within your budget\n  - **Build:** All foundational software £0; don't buy plugin or asset exceeding £5; larger purchases are proposals requiring explicit review\n  - **Proof:** Purchase ledger and optional spend rationale maintained\n  - **Tool:** Spreadsheet\n\n"},{"title":"19 — Publishing, discovery, telemetry and sustainable live operations (10 deliverables)","content":"### 19 — Publishing, discovery, telemetry and sustainable live operations (10 deliverables)\n\n**Goal:** Turn a working game into a responsibly maintained experience.  \n**Prerequisites:** G3 closed alpha for beta; G4 for public launch  \n**Exit gate:** Public build has correct descriptions, measurable funnel, rollback and content cadence.\n\n- [ ] **19.01 — Prepare game metadata** `[BETA]` `[M]`\n  - **Why:** Players must recognise genre and quality\n  - **Build:** Accurate title, original icon, 3 true in-game thumbnails, description, keyboard/controller info and safety disclosures\n  - **Proof:** A newcomer understands playstyle without misrepresentation\n  - **Tool:** Studio + Krita\n- [ ] **19.02 — Build tutorial funnel tracking** `[ALPHA]` `[M]`\n  - **Why:** Data directs improvements\n  - **Build:** Record non-sensitive tutorial start, first ability, chapter completion, session end, device category\n  - **Proof:** Dashboard identifies largest drop-off point\n  - **Tool:** Roblox Analytics\n- [ ] **19.03 — Plan alpha invitation protocol** `[ALPHA]` `[S]`\n  - **Why:** Few testers need clear instructions\n  - **Build:** Private access, fresh profiles, feedback form, bug template, no paid products or broad marketing yet\n  - **Proof:** Each tester supplies reproducible notes\n  - **Tool:** Roblox Creator Hub\n- [ ] **19.04 — Define release KPIs and context** `[BETA]` `[M]`\n  - **Why:** Judge success fairly\n  - **Build:** Watch tutorial completion, D1/D7 return, crashes, FPS, combat satisfaction and session time; compare to suitable genre benchmarks\n  - **Proof:** Do not launch because of one viral video\n  - **Tool:** Analytics\n- [ ] **19.05 — Create update release train** `[BETA]` `[M]`\n  - **Why:** Solo dev cannot patch constantly\n  - **Build:** Small two-week stability/polish cycle, larger content every 6–10 weeks as capacity allows; no promises to public before stable\n  - **Proof:** Patch notes tied to known builds\n  - **Tool:** GitHub/Markdown\n- [ ] **19.06 — Build feedback triage** `[BETA]` `[S]`\n  - **Why:** Avoid direction from loudest comments\n  - **Build:** Tag bug, exploit, balance, onboarding, content request; severity and reproduction before work\n  - **Proof:** Weekly review creates at most 3 actionable priorities\n  - **Tool:** GitHub Issues\n- [ ] **19.07 — Plan community moderation** `[BETA]` `[M]`\n  - **Why:** Safe conversation\n  - **Build:** Use Roblox-native community tools, clear reports/mutes and avoid exposing underage users' personal data\n  - **Proof:** No private user identifiers in shared bug videos\n  - **Tool:** Roblox\n- [ ] **19.08 — Prepare rollback/hotfix plan** `[BETA]` `[M]`\n  - **Why:** Avoid live data disasters\n  - **Build:** Staging, release candidate, smoke test, deploy, monitor 60 min, kill switch/rollback method\n  - **Proof:** Can disable broken portal without full reset\n  - **Tool:** Claude + Git\n- [ ] **19.09 — Create long-term content matrix** `[LATER]` `[M]`\n  - **Why:** Expansions should be efficient\n  - **Build:** Rotate faction stories, bosses, kit variants, PvP maps and cosmetic progression; add mechanics only where needed\n  - **Proof:** Next three content releases have dependencies & estimates\n  - **Tool:** ChatGPT\n- [ ] **19.10 — Conduct post-launch review** `[LATER]` `[M]`\n  - **Why:** Know what users actually value\n  - **Build:** At 7/30 days review cohorts, most-used abilities, deaths, returns, device performance and monetisation fairness\n  - **Proof:** Written stop/start/continue decisions before large new features\n  - **Tool:** Analytics + ChatGPT\n\n"},{"title":"7. The actual Soul Reaper progression — start as nothing, finish as captain-class","content":"## 7. The actual Soul Reaper progression — start as nothing, finish as captain-class\n\nThis is an **original proposed quest/story progression** inspired by the broad Bleach career fantasy. The labels *Soul Reaper, Shikai, Bankai, Kidō* are Bleach terminology for private design discussion and require the IP decision described above for public shipping. **Level 60 is a prototype design cap, not a canon or competing-game level cap.** Level and title are separate: a powerful player is *captain-class* without automatically occupying a finite Gotei 13 office. The ranges are suggested content bands; always make repeatable side activities so late joiners or solo players can progress.\n\n| Chapter and proposed level | Player experience — actual actions | Reward / power earned | Proof this stage works |\n|---|---|---|---|\n| **0: Unaware human (L1–3)** | Investigate strange lights in town, survive two spirits, rescue an NPC and witness mentor demonstration. | Spiritual sight, starter dodge, journal and choice of route. | First action ≤1 min; first satisfying fight ≤5 min. |\n| **1: Newly arrived soul (L3–5)** | Follow a spirit guide, navigate a poor residential district, help a resident, discover energy hunger/sensing. | Access to recruitment and first noncombat spirit action. | Waypoint unnecessary after one introduction. |\n| **2: Academy applicant (L5–7)** | Three tests: hit timing, spirit output at target, protect civilian dummy. If weak, receive coaching rather than rejection. | Student record, uniform and short blade. | A low-skill player can succeed with retries. |\n| **3: First academy lessons (L7–10)** | Wooden sword spar, perfect guard practice, dodge lane and introductory spell cast. | Four basic combat arts, first talent point. | Each art has one input tutorial and meaningful use. |\n| **4: Field apprentice (L10–13)** | Use soul-guidance ritual on lost spirits; patrol near town; tell harmless spirit from hostile one. | Purification tool, mission board, beginner salary. | Not every quest is kill-only. |\n| **5: Duty patrol (L13–16)** | Two rescue missions, escort a slow civilian, stop a pack invasion, report to mentor. | New combo finisher, controlled spiritual energy. | Co-op and solo completions both grant credit. |\n| **6: First personal awakening (L16–20)** | Meditate at a spiritual site; meet sword spirit; choose one combat identity; beat short customised solo trial. | **First release (Shikai-like)** + 2 starter themed skills. | Reward unlocks from completed trial, not random paid spin. |\n| **7: Junior officer (L20–25)** | Competitive but opt-in spar, defend district, assist stronger officer in hunt. | Third release skill, class badge, weapon variant. | No PvP required for core story progression. |\n| **8: Specialist training (L25–30)** | Choose sword/footwork/spells/hand combat specialism; complete practice mission; unlock branch passive. | Specialism progression without removing original skills. | Player can respec if a style does not suit them. |\n| **9: Seated-officer calibre (L30–35)** | Fight two-stage mini-boss, investigate traitor, command tiny NPC squad in defence. | Promotion record, squad orders, higher mission board. | Party/AI allies cooperate rather than glitch. |\n| **10: Lieutenant calibre (L35–40)** | Three challenging mastery exams: timed defence, duel with counter window, energy-control gauntlet. | Advanced movement and signature support technique. | Performance matters more than raw level. |\n| **11: Inner conflict (L40–45)** | Return to personal inner-world scene, resolve ideological conflict with spirit, fight an altered version of own move set. | Expanded release state and mastery path. | Character choices affect dialogue/trial but not PvP unfairness. |\n| **12: Bankai preparation (L45–50)** | Collect 3 trial memories from different bosses; win a spirit relationship challenge; defend inner-world anchor. | Multi-stage Bankai-style quest, no form yet. | Quest progress saves on disconnect. |\n| **13: Bankai awakening (L50–55)** | Multi-phase solo/optional group encounter with spirit; prove survival, accuracy and control. | **Bankai-like second release** with new silhouette and 3–4 skills. | Strong in a test but with clear counters and cooldowns. |\n| **14: Captain-class challenge (L55–60)** | Defend whole district, beat tactical raid boss, clear high-level solo proving ground and optional faction test. | Captain-class prestige title, mastery cosmetics, elite contracts. | Players can reach mastery without joining a ranked clan. |\n| **15: Post-cap endgame** | Division missions, mentor quests, rotating soul-threat operations, skill challenge gauntlets, earned cosmetics and PvP ladder. | Horizontal mastery, no endless raw damage multiplier. | At least one meaningful PvE goal every week. |\n\n### The Soul Reaper abilities that a base game actually needs\n\n**Common/learned**: basic sword light/heavy, guard, perfect guard, dodge, light spirit sensing, soul-guidance ritual, one ranged strike, one binding technique, one fast footwork step, one unarmed counter. **First release**: an original designed elemental/form identity with *three clear moves* (engage, control, finisher) and one weakness. **Advanced release**: modified basic attacks, one altered battlefield mechanic, three-to-four moves, high cost, an audible entry cue and recoverable cooldown. **Optional branch**: spell caster, melee duellist, defensive protector, high-mobility scout. Reuse systems; make moves feel distinct through timing, behaviour and animations, not only recolours.\n\n### How to build the school at the correct time\n\nStart with a **multi-purpose training hall and 3 short lessons** in the first playable slice. A giant architecturally complete academy should be **a separate future world/content feature** only after the training minigames prove enjoyable. An immersive school can later expand into classrooms, staff, lessons, elective studies, dorms, co-op training, student social features and graduations, but it is not a prerequisite for testing basic sword combat. This avoids spending months modelling a building before a player can actually enjoy the RPG.\n\n"},{"title":"8. The Hollow progression — a genuinely different entire game loop","content":"## 8. The Hollow progression — a genuinely different entire game loop\n\nEvery Hollow stage changes **movement, hunting tactics, silhouette and social incentives**, not merely health. A Hollow may be trapped briefly in dangerous encounters but should not become effectively unplayable for hours. The Hollow side must have a safe non-PvP progression route so a low-level player cannot be farmed by veterans. These are proposed gameplay design numbers, not a statement that every stage must use one specific Bleach canon method.\n\n| Chapter and proposed level | Gameplay steps | Ability/form unlock | Completion test |\n|---|---|---|---|\n| **H0: Human spirit at risk (L1–4)** | Survive night disturbance, flee hostile spirit, encounter corruption event; choose dark route with confirmation. | Spirit sense and short fear/instinct tutorial. | Clear non-PvP option to accept or refuse. |\n| **H1: Newly formed Hollow (L4–8)** | Spawn at starter cave of hostile realm, learn claws, eat a defeated NPC essence, follow scent to shelter. | Claw combo, lunge, scent marker and feed bar. | Not spawn-killed; first successful feed \u003c5 min. |\n| **H2: Hunter (L8–12)** | Hunt three prey archetypes, evade one superior predator, choose danger vs careful hunting. | Roar/debuff, dash leap and instinct perk. | Players can use stealth and escape, not just spam damage. |\n| **H3: Territorial predator (L12–16)** | Defend feeding ground, interrupt another predator (AI), evolve using found essence, protect prey cache. | First body modification, stronger special. | Evolution saves and changes gameplay, not just mesh. |\n| **H4: Menos initiation (L16–20)** | Witness many Hollows converging; enter short timed survival/identity event; gain large form or condensed Menos encounter. | Energy beam, crowd awareness and control stat. | Sequence is dramatic but movement remains playable. |\n| **H5: Individuality trial (L20–24)** | Identify the memory/personality distinguishing player from crowd; defeat a mirror instinct. | Individual signature, evolution direction. | No irreversible bad random roll. |\n| **H6: Adjuchas hunter (L24–30)** | Smaller sharper predator; travel three territories, earn hierarchy by outplaying stronger AI, join optional pack. | Sonído-like step, armour, 3 personalised skills. | New tactics noticeably outperform basic Hollow. |\n| **H7: Instinct mastery (L30–36)** | Hunt prey types that counter one another, master group hunt or solo trap, survive night raid. | New passive and advanced projectile variant. | One build isn't best at every hunt. |\n| **H8: Apex challenge (L36–43)** | Find ancient predator, three-part hunt, duel and escape challenge. | Vasto Lorde-style apex form, dramatic silhouette. | Boss can be beaten with mastery, not only rare drops. |\n| **H9: Breaking the mask (L43–48)** | Complete self-recognition story, confront memories, choose Arrancar transformation or remain apex Hollow. | Arrancar weapon state or evolved apex branch. | Both branches have meaningful endgame, no trap choice. |\n| **H10: Arrancar elite (L48–52)** | Duel another elite AI, earn number/title through mission, learn weapon and refine defence. | Mask fragment, sealed weapon, refined Cero-like skill. | Models support movement and weapon collision. |\n| **H11: Resurrección (L52–56)** | Return to ancient instinct, face dangerous inner duel, unlock Hollow form from sealed weapon. | Resurrección-like full release, 3–4 moves. | No accidental double transformation stacking. |\n| **H12: Rare final evolution (L56–60)** | Optional apex quest, group operation, tactical duel, lore reveal. | One rare second-level form/technique (not required for baseline beta). | Endgame earns identity, not unstoppable PvP output. |\n| **H13: Endless predators** | Defend territory, join invasion events, hunt elite bosses, form packs, challenge raids or arena ladder. | Prestige markers, evolved move variants, cosmetics. | Solo and cooperative content remains viable. |\n\n**Starter Hollow kit:** claw light/heavy, pounce, short-range roar, one projectile or beam, feed action, scent direction. **Mid-game identity:** mobility/armour/perception plus three element/aspect specialisations. **High end:** weapon and release, unique enemy interactions, portal travel, ability to contribute support/tank/damage in group events. **Balance:** eating other players is never a mandatory source of experience or required unlock.\n\n**Environment rhythm:** starting cave and hunting dunes → dangerous ridge and burrows → underground Menos forest → contested fortress outskirts → elite Arrancar district. Expand map area only when a new hunting or raid loop justifies it. Build the first 2 areas first, not the whole desert.\n\n"},{"title":"9. Quincy progression — ranged play from novice to elite","content":"## 9. Quincy progression — ranged play from novice to elite\n\nThis route must solve ranged combat problems rather than copy sword mechanics. Server hit validation, occlusion, projectile feedback and mobile aim are prerequisites; the first task for Quincy implementation is **not an ultimate blue beam**.\n\n| Chapter/level | Required actions | Reward / specialism | Test |\n|---|---|---|---|\n| **Q0: Sensitive human (L1–5)** | Defend spirit-touched relative and discover ability to see reishi traces. | Perception + faction mentor. | Starts smoothly from common introduction. |\n| **Q1: Apprentice archer (L5–10)** | Learn charged shot and safe targets, collect ambient particles, short aiming quest. | Basic spirit bow and reishi meter. | Reliable shot on desktop, gamepad and phone. |\n| **Q2: Field archer (L10–16)** | Patrol rooftops, interrupt hostile casters, learn air step. | Light volley and relocation. | Can beat equivalent melee AI with positioning. |\n| **Q3: Spiritual defender (L16–22)** | Protect a lane; hold shield, time defensive energy burst, conserve spirit reserve. | Defence passive or reishi absorption. | Can't maintain invulnerability indefinitely. |\n| **Q4: Specialist selection (L22–28)** | Run sniper, scout and support trials; choose one and retain free change opportunity. | 3 role-specific skills. | All three can finish the same mission. |\n| **Q5: Veteran operative (L28–34)** | Group recon, rescue, spirit-particle objective, hostile portal sealing. | Advanced projectile interaction and faction reputation. | Useful even against highly mobile sword opponent. |\n| **Q6: Elite trainee (L34–40)** | Three accuracy/time trials, lead NPC recon group and duel anti-projectile foe. | Elite title and burst move. | Precision rewarded over grinding low mobs. |\n| **Q7: Personal power (L40–48)** | Solve a story mystery connected to player choices; earn one signature ability from curated options. | Schrift-like signature theme with explicit counter. | No randomness-only wins. |\n| **Q8: Release preparation (L48–52)** | Control unstable high-density reishi in a cooperative or solo mission. | Expanded particle cap and technique mastery. | Energy management remains meaningful. |\n| **Q9: Vollständig-style release (L52–57)** | Complete high-risk sky trial with guard, movement and accurate ranged control. | Aerial aura/release with 3 powers. | Form can't maintain flight/defence forever. |\n| **Q10: Elite commander calibre (L57–60)** | Save faction stronghold under attack, win boss with two ranges and lead precision fire. | Elite prestige, unique cosmetics and master trials. | No automatic power advantage over captain-class rival. |\n| **Q11: Endgame** | Time trials, faction patrols, raid ranged roles, seasonal duels and world-event support. | New play patterns and appearance, limited horizontal upgrades. | Builds remain balanced and competitive. |\n\n**Baseline skills:** basic charged bow, quick shot, triple volley, one defensive ability, one movement step, interrupt/counter projectile. **Three initial build roles:** precision sniper, fast skirmisher, support/controller. **Advanced power:** a unique ability with distinct geometry/status rather than simply the largest ranged damage output.\n\n"},{"title":"10. Optional Fullbringer / human specialist progression","content":"## 10. Optional Fullbringer / human specialist progression\n\nThis is an **expansion design**, not an alpha promise. The central gameplay fantasy is binding supernatural strength to a meaningful everyday item rather than a sword, mask or bow. A complete route still deserves structure in the roadmap:\n\n| Stage | Player experience | Unlock |\n|---|---|---|\n| Ordinary human L1–5 | Notice a resonating keepsake during a spirit incident; rescue an NPC by using it. | Initial object sense. |\n| Awakening L5–12 | Training with a mentor, 3 object interaction puzzles and first combat exercise. | Two weapon/object skills. |\n| Street fighter L12–20 | Defend urban district, learn wall/roof traversal, interrupt a threatening apparition. | Mobility or trapping branch. |\n| Specialisation L20–30 | Commit to protection, manipulation or brawler identity through a trial. | Third skill and passive. |\n| First manifestation L30–38 | Object becomes weapon/armour/tool with distinct motion and silhouette. | Form 1 and mini-boss challenge. |\n| Mastery L38–48 | Story of why the object matters, rival duel, counter to element enemy. | One altered mechanic. |\n| Complete manifestation L48–56 | Fight an original boss with object-themed puzzle, earn upgraded manifestation. | Endgame transformation. |\n| Veteran L56–60 | Contract quests, reconnaissance and group support; optional faction alliance. | Master title/cosmetics. |\n| Post-cap | Rotating contracts and elite team activities. | Horizontal upgrades. |\n\n**Strict go/no-go condition:** Only implement once the other three routes are engaging and stable, or if audience research proves this route is essential enough to replace a weaker planned expansion.\n\n"},{"title":"11. Content quantity: a feasible MVP versus the dream catalogue","content":"## 11. Content quantity: a feasible MVP versus the dream catalogue\n\n| Content category | G1 mechanical test | G2 first RPG slice | Closed alpha | Public beta | Long-term target (not a launch promise) |\n|---|---:|---:|---:|---:|---:|\n| Player routes | Neutral combat dummy | 1 playable route beginning | 2 routes started | 3 major routes with core forms | 3 deep + optional 4th |\n| Reusable core combat actions | 7–9 | 9–12 | 12–14 | 14–18 | Expand only if mechanics demand |\n| Unique themed ability kits | 0 | 1 | 3–4 | 6–9 | 18–30 deeply balanced kits |\n| Fully modelled player forms | 0 | 1 starter + 1 first release | 3–5 | 8–12 | Carefully curated library |\n| Regular enemy archetypes | 1 dummy + 2 | 3 | 5–7 | 10–12 | 15+ via modular variants |\n| Bosses | 0–1 training | 1 mini-boss | 2 real bosses | 4–6 | 8–12 plus variants |\n| Regions with gameplay | 1 arena | 1 district + arena | 2 compact realms | 3 worlds | 4+ worlds/dungeons |\n| Structured quests | 0 | 8–12 | 20–30 | 45–60 | 100+ including repeatables |\n| Co-op activities | Local test only | One shared hunt | One dungeon | Several boss/event types | Seasonal raids and wars |\n| PvP | Two-player test | Friendly duel | Duel arena | Ranked 1v1 + later 2v2 | Multiple seasonal formats |\n\n**Core production principle:** Ten skills built from a tested ability framework are better than 100 beautiful isolated scripts. Four excellent bosses with distinct mechanics are better than twenty HP sponges. A small hub where players see one another is better than a gigantic mostly empty world.\n\n### Six starter enemy designs (concept-only, build as data-driven variants)\n\n| Enemy | Teaches | Signature attacks | Counters |\n|---|---|---|---|\n| Wandering Shade | Basic melee rhythm | Two claw strikes + slow swipe | Dodge/guard and punish recovery |\n| Armoured Husk | Guard break | Shield stance + obvious heavy | Heavy strike, flank, stun |\n| Ether Archer | Cover | Charged line shot + retreat | LOS, pressure, interrupt |\n| Rift Lurker | Movement | Telegraphed charge + leap | Sidestep; punish missed rush |\n| Binding Revenant | Dispel & timing | Slow field + bind | Break cast / exit zone |\n| Apex Stalker | Mini-boss preparation | Combo mixup, fake windup, ground pulse | Reading tells; never guessing invisible damage |\n\n### Six proposed launch ability kits and real gameplay differences\n\n| Kit | Role | Skill 1 | Skill 2 | Skill 3 | Signature weakness |\n|---|---|---|---|---|---|\n| Ember Blade | Sword burst | Short flaming dash | Heat-parry counter | Narrow flame cleave | Commits to close range |\n| Tempest Blade | Mobility | Quick air slash | Wind reposition | Wide but weak gust control | Lower guard capacity |\n| Stone Ward | Tank/control | Fortify guard | Knockback wall | Ground-break zone | Slow pursuit |\n| Ravenous Claw | Hollow hunter | Grapple leap | Prey mark | Risky devour strike | Vulnerable on miss |\n| Bone Lance | Hollow ranged | Spear throw | Armour shard shield | Ricochet burst | Small safe zone close up |\n| Spirit Archer | Quincy precision | Held shot | Fast volley | Reflecting defensive screen | Needs aim/spacing |\n\nKits are original proposals for the design baseline; **do not copy specific canonical character abilities or animation sequences into publishable assets** without the relevant rights.\n\n"},{"title":"12. Detailed production recipes — what to do during an actual work session","content":"## 12. Detailed production recipes — what to do during an actual work session\n\n### Recipe A — Build your first functional combat move\n\n1. **Decide the rules in plain English:** Who can use the move? Starting pose? Wind-up? Contact frames? How close? Can it be blocked, dodged or parried? What does it cost? What happens if interrupted? Document answers in a half-page contract.\n2. **Make gray shapes only:** a rectangular practice arena, one R15 dummy and a simple animation. No neon, sounds or cinematic cuts yet.\n3. **Request the implementation as three modules:** a shared AbilityDefinition, server validated action, and client input/animation preview. Declare what service owns each state. Don't tell AI to create ad-hoc permanent damage on `Touched` and don't let the client send how much damage it dealt.\n4. **Test expected use:** cast at valid distance, confirm one hit; cast out of range, no hit; cast with insufficient spirit, no cast; cast while stunned, blocked; cast twice instantly, one cooldown; target behind wall, no hit.\n5. **Test hostile use:** send a huge number or invalid type for positions, try fake target identity, spam remote, rapid weapon switch, die during cast. Game must remain stable with no reward exploit.\n6. **Add audiovisual feedback only after proof:** tiny trail, contact spark, three separate sounds (start, hit, blocked); use asset provenance log and volume group.\n7. **Record video at two camera angles and test low graphics.** Commit only if the motion, hit and damage all match what the viewer perceives.\n\n### Recipe B — Build a new quest without a new script for every NPC\n\n1. Write its reason for existing: teach dash, tell a story, introduce a region, earn a skill or support a faction; no meaningless ten-kill filler.\n2. Draft **one data record** with quest ID, level/faction prerequisites, dialogue ID, objective types, target spawn region, reward, next ID and checkpoint.\n3. Reuse objective handlers: combat kill credited by server; interact within verified distance; timed defence validated server side; escort success from NPC state, never from client claim.\n4. Add a journal entry and objective marker that clears after completion. Ensure the quest never depends on another human being online.\n5. Test quitting before and after each step, double reward claim, walking away mid-defence, changing realm, companion death and quest cancel.\n6. Ask one unfamiliar person to find and finish it with no developer commentary.\n\n### Recipe C — Build a Blender asset actually suitable for Roblox\n\n1. Start with an **in-game reference**, not a photoreal concept: R15 dummy beside target prop, measurements in studs, camera screenshot and colour palette.\n2. Build in Blender with large readable geometry, clean bevels, minimal unnecessary backfaces, appropriate pivot at base or grip and separate rigid moving parts where needed.\n3. Mark object origin, scale, material names and exported file name; only create texture maps you need (often colour/roughness plus simple normal). Use original art or permitted source material.\n4. Export FBX or glTF as supported by your Roblox workflow; import into Studio, inspect scale, mesh triangulation, collision, normals and texture assignments.\n5. Rig/attach to R15, test run/dodge/attack/camera from all sides and on mobile quality. Create LOD or simpler far representation where it provides measured value.\n6. Capture Studio screenshot beside concept at same distance. Fix silhouette first, materials second, microdetail last. Store `.blend` **and** final source file; log credits/licence.\n\n### Recipe D — Make one training trial feel like an anime awakening\n\n1. Write the player's current challenge: e.g. they always rush, so their spirit tests patience; or they defend others, so they must save targets under time pressure.\n2. Build a 90–180-second encounter using the standard combat AI and modular geometry, not an entire unique game mode engine.\n3. Make three learnable phases: recognise the gimmick → use the counter taught in training → win or survive a climax. Give clear respawn/checkpoint on failure.\n4. Reward one new **mechanic**, not only +15% damage; show it immediately in a safe demonstration arena.\n5. Support solo play and an optional spectator/friend mode. Ensure the trial can be retried with no paid re-roll.\n6. Validate every state of reconnect, death, skipping the cutscene, empty server and controller input.\n\n### Recipe E — Safe update and data migration\n\n1. Work in a separate test experience and branch. Write the migration ahead of the feature.\n2. Create sample saved profiles from two previous versions, including unusual empty inventory and max progression.\n3. Run migration on fixtures, then load into the test experience. Check balances, owned powers, ranks and quest flags.\n4. Test saving twice and loading during a parallel join. Test after a teleport failure.\n5. Only after passing, enable the feature in release candidate; keep a rollback flag and backup. Never manually reset user data as a 'quick fix'.\n\n### Recipe F — A meaningful first-time-player test\n\nAsk five people who have not seen the project to play **without telling them where to go**. Note: seconds until movement, first successful attack, first skill, first meaningful reward; times they open menu, wander confused, die, disconnect or ask for help. Ask what their next goal is at minute five. Rework the biggest confusion before adding a new skill. The target of fun in under five minutes aligns with Roblox's own onboarding guidance; it is a target, not a guaranteed retention result.\n\n"},{"title":"13. Recommended weekly routine for one teenager using AI builders","content":"## 13. Recommended weekly routine for one teenager using AI builders\n\nAn example **10-hour week** (adapt around school, homework and personal life; treat times as flexible):\n\n| Session | Your job | AI's job | Evidence kept |\n|---|---|---|---|\n| Monday, 45 min | Pick one task, agree exact scope and tests | ChatGPT prepares one-page implementation contract | Task brief |\n| Tuesday, 90 min | Watch code changes; answer design questions | Claude implements one bounded module | Git diff + tests |\n| Wednesday, 60 min | Run Studio and deliberately try to break it | ChatGPT helps analyse video and bugs | Capture and repro steps |\n| Thursday, 90 min | Fix highest severity failure | Claude patches only defective code | Regression tests |\n| Friday, 45 min | Add one tiny improvement or documentation | AI updates comments, task list and test notes | Commit |\n| Weekend, 3–4 h | Integrate, play with others, test phone/controller, build one asset | Claude/ChatGPT assist with asset/scripts and compare captures | Approved playable build |\n\n**One task is not necessarily one prompt.** A large task can take several weeks. Important work that the AI cannot substitute for: deciding what feels fun, using Roblox Studio, verifying code outcomes, reviewing copyrighted content, keeping backups, speaking to testers and prioritising what you don't build.\n\n### Reusable Claude build prompt (copy, fill placeholders)\n\n```text\nYou are helping one solo Roblox developer build NUMEN, a third-person\nspiritual action RPG. Work from the current repository and the exact task\ncontract below. Do not invent additional game systems or silently refactor\nunrelated files. If information is missing, list a small number of explicit\nassumptions and ask before making irreversible changes.\n\nTASK: [PHASE.TASK + TITLE]\nREASON: [WHY IT EXISTS]\nDEPENDENCIES: [PREREQUISITE MODULES / IMPLEMENTED APIs]\nFILES YOU MAY CHANGE: [LIST PATHS]\nPUBLIC API / DATA CONTRACT: [SIGNATURES / SCHEMA]\nPLAYER BEHAVIOUR: [START → ACTION → OUTCOME]\nEXPLOIT/RACE RISKS: [INVALID REMOTE, DUPLICATE REWARD, DISCONNECT]\nACCEPTANCE TESTS: [5–10 PROOFS FROM THE MASTER BACKLOG]\nPERFORMANCE/DEVICE: [LOW GRAPHICS / MOBILE / NETWORK GOALS]\nASSETS: [ONLY APPROVED AND OWNED SOURCES]\n\nDeliver: short plan; small implementation; unit and Studio test instructions;\nexact files changed; known gaps; 20-second capture steps; rollback steps.\nStop if the change would overwrite production data or locked content.\nDo not claim it works without executing the test or clearly sayi
