 ≤1 min; first satisfying fight ≤5 min. |\n| **1: Newly arrived soul (L3–5)** | Follow a spirit guide, navigate a poor residential district, help a resident, discover energy hunger/sensing. | Access to recruitment and first noncombat spirit action. | Waypoint unnecessary after one introduction. |\n| **2: Academy applicant (L5–7)** | Three tests: hit timing, spirit output at target, protect civilian dummy. If weak, receive coaching rather than rejection. | Student record, uniform and short blade. | A low-skill player can succeed with retries. |\n| **3: First academy lessons (L7–10)** | Wooden sword spar, perfect guard practice, dodge lane and introductory spell cast. | Four basic combat arts, first talent point. | Each art has one input tutorial and meaningful use. |\n| **4: Field apprentice (L10–13)** | Use soul-guidance ritual on lost spirits; patrol near town; tell harmless spirit from hostile one. | Purification tool, mission board, beginner salary. | Not every quest is kill-only. |\n| **5: Duty patrol (L13–16)** | Two rescue missions, escort a slow civilian, stop a pack invasion, report to mentor. | New combo finisher, controlled spiritual energy. | Co-op and solo completions both grant credit. |\n| **6: First personal awakening (L16–20)** | Meditate at a spiritual site; meet sword spirit; choose one combat identity; beat short customised solo trial. | **First release (Shikai-like)** + 2 starter themed skills. | Reward unlocks from completed trial, not random paid spin. |\n| **7: Junior officer (L20–25)** | Competitive but opt-in spar, defend district, assist stronger officer in hunt. | Third release skill, class badge, weapon variant. | No PvP required for core story progression. |\n| **8: Specialist training (L25–30)** | Choose sword/footwork/spells/hand combat specialism; complete practice mission; unlock branch passive. | Specialism progression without removing original skills. | Player can respec if a style does not suit them. |\n| **9: Seated-officer calibre (L30–35)** | Fight two-stage mini-boss, investigate traitor, command tiny NPC squad in defence. | Promotion record, squad orders, higher mission board. | Party/AI allies cooperate rather than glitch. |\n| **10: Lieutenant calibre (L35–40)** | Three challenging mastery exams: timed defence, duel with counter window, energy-control gauntlet. | Advanced movement and signature support technique. | Performance matters more than raw level. |\n| **11: Inner conflict (L40–45)** | Return to personal inner-world scene, resolve ideological conflict with spirit, fight an altered version of own move set. | Expanded release state and mastery path. | Character choices affect dialogue/trial but not PvP unfairness. |\n| **12: Bankai preparation (L45–50)** | Collect 3 trial memories from different bosses; win a spirit relationship challenge; defend inner-world anchor. | Multi-stage Bankai-style quest, no form yet. | Quest progress saves on disconnect. |\n| **13: Bankai awakening (L50–55)** | Multi-phase solo/optional group encounter with spirit; prove survival, accuracy and control. | **Bankai-like second release** with new silhouette and 3–4 skills. | Strong in a test but with clear counters and cooldowns. |\n| **14: Captain-class challenge (L55–60)** | Defend whole district, beat tactical raid boss, clear high-level solo proving ground and optional faction test. | Captain-class prestige title, mastery cosmetics, elite contracts. | Players can reach mastery without joining a ranked clan. |\n| **15: Post-cap endgame** | Division missions, mentor quests, rotating soul-threat operations, skill challenge gauntlets, earned cosmetics and PvP ladder. | Horizontal mastery, no endless raw damage multiplier. | At least one meaningful PvE goal every week. |\n\n### The Soul Reaper abilities that a base game actually needs\n\n**Common/learned**: basic sword light/heavy, guard, perfect guard, dodge, light spirit sensing, soul-guidance ritual, one ranged strike, one binding technique, one fast footwork step, one unarmed counter. **First release**: an original designed elemental/form identity with *three clear moves* (engage, control, finisher) and one weakness. **Advanced release**: modified basic attacks, one altered battlefield mechanic, three-to-four moves, high cost, an audible entry cue and recoverable cooldown. **Optional branch**: spell caster, melee duellist, defensive protector, high-mobility scout. Reuse systems; make moves feel distinct through timing, behaviour and animations, not only recolours.\n\n### How to build the school at the correct time\n\nStart with a **multi-purpose training hall and 3 short lessons** in the first playable slice. A giant architecturally complete academy should be **a separate future world/content feature** only after the training minigames prove enjoyable. An immersive school can later expand into classrooms, staff, lessons, elective studies, dorms, co-op training, student social features and graduations, but it is not a prerequisite for testing basic sword combat. This avoids spending months modelling a building before a player can actually enjoy the RPG.\n\n## 8. The Hollow progression — a genuinely different entire game loop\n\nEvery Hollow stage changes **movement, hunting tactics, silhouette and social incentives**, not merely health. A Hollow may be trapped briefly in dangerous encounters but should not become effectively unplayable for hours. The Hollow side must have a safe non-PvP progression route so a low-level player cannot be farmed by veterans. These are proposed gameplay design numbers, not a statement that every stage must use one specific Bleach canon method.\n\n| Chapter and proposed level | Gameplay steps | Ability/form unlock | Completion test |\n|---|---|---|---|\n| **H0: Human spirit at risk (L1–4)** | Survive night disturbance, flee hostile spirit, encounter corruption event; choose dark route with confirmation. | Spirit sense and short fear/instinct tutorial. | Clear non-PvP option to accept or refuse. |\n| **H1: Newly formed Hollow (L4–8)** | Spawn at starter cave of hostile realm, learn claws, eat a defeated NPC essence, follow scent to shelter. | Claw combo, lunge, scent marker and feed bar. | Not spawn-killed; first successful feed \u003c5 min. |\n| **H2: Hunter (L8–12)** | Hunt three prey archetypes, evade one superior predator, choose danger vs careful hunting. | Roar/debuff, dash leap and instinct perk. | Players can use stealth and escape, not just spam damage. |\n| **H3: Territorial predator (L12–16)** | Defend feeding ground, interrupt another predator (AI), evolve using found essence, protect prey cache. | First body modification, stronger special. | Evolution saves and changes gameplay, not just mesh. |\n| **H4: Menos initiation (L16–20)** | Witness many Hollows converging; enter short timed survival/identity event; gain large form or condensed Menos encounter. | Energy beam, crowd awareness and control stat. | Sequence is dramatic but movement remains playable. |\n| **H5: Individuality trial (L20–24)** | Identify the memory/personality distinguishing player from crowd; defeat a mirror instinct. | Individual signature, evolution direction. | No irreversible bad random roll. |\n| **H6: Adjuchas hunter (L24–30)** | Smaller sharper predator; travel three territories, earn hierarchy by outplaying stronger AI, join optional pack. | Sonído-like step, armour, 3 personalised skills. | New tactics noticeably outperform basic Hollow. |\n| **H7: Instinct mastery (L30–36)** | Hunt prey types that counter one another, master group hunt or solo trap, survive night raid. | New passive and advanced projectile variant. | One build isn't best at every hunt. |\n| **H8: Apex challenge (L36–43)** | Find ancient predator, three-part hunt, duel and escape challenge. | Vasto Lorde-style apex form, dramatic silhouette. | Boss can be beaten with mastery, not only rare drops. |\n| **H9: Breaking the mask (L43–48)** | Complete self-recognition story, confront memories, choose Arrancar transformation or remain apex Hollow. | Arrancar weapon state or evolved apex branch. | Both branches have meaningful endgame, no trap choice. |\n| **H10: Arrancar elite (L48–52)** | Duel another elite AI, earn number/title through mission, learn weapon and refine defence. | Mask fragment, sealed weapon, refined Cero-like skill. | Models support movement and weapon collision. |\n| **H11: Resurrección (L52–56)** | Return to ancient instinct, face dangerous inner duel, unlock Hollow form from sealed weapon. | Resurrección-like full release, 3–4 moves. | No accidental double transformation stacking. |\n| **H12: Rare final evolution (L56–60)** | Optional apex quest, group operation, tactical duel, lore reveal. | One rare second-level form/technique (not required for baseline beta). | Endgame earns identity, not unstoppable PvP output. |\n| **H13: Endless predators** | Defend territory, join invasion events, hunt elite bosses, form packs, challenge raids or arena ladder. | Prestige markers, evolved move variants, cosmetics. | Solo and cooperative content remains viable. |\n\n**Starter Hollow kit:** claw light/heavy, pounce, short-range roar, one projectile or beam, feed action, scent direction. **Mid-game identity:** mobility/armour/perception plus three element/aspect specialisations. **High end:** weapon and release, unique enemy interactions, portal travel, ability to contribute support/tank/damage in group events. **Balance:** eating other players is never a mandatory source of experience or required unlock.\n\n**Environment rhythm:** starting cave and hunting dunes → dangerous ridge and burrows → underground Menos forest → contested fortress outskirts → elite Arrancar district. Expand map area only when a new hunting or raid loop justifies it. Build the first 2 areas first, not the whole desert.\n\n## 9. Quincy progression — ranged play from novice to elite\n\nThis route must solve ranged combat problems rather than copy sword mechanics. Server hit validation, occlusion, projectile feedback and mobile aim are prerequisites; the first task for Quincy implementation is **not an ultimate blue beam**.\n\n| Chapter/level | Required actions | Reward / specialism | Test |\n|---|---|---|---|\n| **Q0: Sensitive human (L1–5)** | Defend spirit-touched relative and discover ability to see reishi traces. | Perception + faction mentor. | Starts smoothly from common introduction. |\n| **Q1: Apprentice archer (L5–10)** | Learn charged shot and safe targets, collect ambient particles, short aiming quest. | Basic spirit bow and reishi meter. | Reliable shot on desktop, gamepad and phone. |\n| **Q2: Field archer (L10–16)** | Patrol rooftops, interrupt hostile casters, learn air step. | Light volley and relocation. | Can beat equivalent melee AI with positioning. |\n| **Q3: Spiritual defender (L16–22)** | Protect a lane; hold shield, time defensive energy burst, conserve spirit reserve. | Defence passive or reishi absorption. | Can't maintain invulnerability indefinitely. |\n| **Q4: Specialist selection (L22–28)** | Run sniper, scout and support trials; choose one and retain free change opportunity. | 3 role-specific skills. | All three can finish the same mission. |\n| **Q5: Veteran operative (L28–34)** | Group recon, rescue, spirit-particle objective, hostile portal sealing. | Advanced projectile interaction and faction reputation. | Useful even against highly mobile sword opponent. |\n| **Q6: Elite trainee (L34–40)** | Three accuracy/time trials, lead NPC recon group and duel anti-projectile foe. | Elite title and burst move. | Precision rewarded over grinding low mobs. |\n| **Q7: Personal power (L40–48)** | Solve a story mystery connected to player choices; earn one signature ability from curated options. | Schrift-like signature theme with explicit counter. | No randomness-only wins. |\n| **Q8: Release preparation (L48–52)** | Control unstable high-density reishi in a cooperative or solo mission. | Expanded particle cap and technique mastery. | Energy management remains meaningful. |\n| **Q9: Vollständig-style release (L52–57)** | Complete high-risk sky trial with guard, movement and accurate ranged control. | Aerial aura/release with 3 powers. | Form can't maintain flight/defence forever. |\n| **Q10: Elite commander calibre (L57–60)** | Save faction stronghold under attack, win boss with two ranges and lead precision fire. | Elite prestige, unique cosmetics and master trials. | No automatic power advantage over captain-class rival. |\n| **Q11: Endgame** | Time trials, faction patrols, raid ranged roles, seasonal duels and world-event support. | New play patterns and appearance, limited horizontal upgrades. | Builds remain balanced and competitive. |\n\n**Baseline skills:** basic charged bow, quick shot, triple volley, one defensive ability, one movement step, interrupt/counter projectile. **Three initial build roles:** precision sniper, fast skirmisher, support/controller. **Advanced power:** a unique ability with distinct geometry/status rather than simply the largest ranged damage output.\n\n## 10. Optional Fullbringer / human specialist progression\n\nThis is an **expansion design**, not an alpha promise. The central gameplay fantasy is binding supernatural strength to a meaningful everyday item rather than a sword, mask or bow. A complete route still deserves structure in the roadmap:\n\n| Stage | Player experience | Unlock |\n|---|---|---|\n| Ordinary human L1–5 | Notice a resonating keepsake during a spirit incident; rescue an NPC by using it. | Initial object sense. |\n| Awakening L5–12 | Training with a mentor, 3 object interaction puzzles and first combat exercise. | Two weapon/object skills. |\n| Street fighter L12–20 | Defend urban district, learn wall/roof traversal, interrupt a threatening apparition. | Mobility or trapping branch. |\n| Specialisation L20–30 | Commit to protection, manipulation or brawler identity through a trial. | Third skill and passive. |\n| First manifestation L30–38 | Object becomes weapon/armour/tool with distinct motion and silhouette. | Form 1 and mini-boss challenge. |\n| Mastery L38–48 | Story of why the object matters, rival duel, counter to element enemy. | One altered mechanic. |\n| Complete manifestation L48–56 | Fight an original boss with object-themed puzzle, earn upgraded manifestation. | Endgame transformation. |\n| Veteran L56–60 | Contract quests, reconnaissance and group support; optional faction alliance. | Master title/cosmetics. |\n| Post-cap | Rotating contracts and elite team activities. | Horizontal upgrades. |\n\n**Strict go/no-go condition:** Only implement once the other three routes are engaging and stable, or if audience research proves this route is essential enough to replace a weaker planned expansion.\n\n## 11. Content quantity: a feasible MVP versus the dream catalogue\n\n| Content category | G1 mechanical test | G2 first RPG slice | Closed alpha | Public beta | Long-term target (not a launch promise) |\n|---|---:|---:|---:|---:|---:|\n| Player routes | Neutral combat dummy | 1 playable route beginning | 2 routes started | 3 major routes with core forms | 3 deep + optional 4th |\n| Reusable core combat actions | 7–9 | 9–12 | 12–14 | 14–18 | Expand only if mechanics demand |\n| Unique themed ability kits | 0 | 1 | 3–4 | 6–9 | 18–30 deeply balanced kits |\n| Fully modelled player forms | 0 | 1 starter + 1 first release | 3–5 | 8–12 | Carefully curated library |\n| Regular enemy archetypes | 1 dummy + 2 | 3 | 5–7 | 10–12 | 15+ via modular variants |\n| Bosses | 0–1 training | 1 mini-boss | 2 real bosses | 4–6 | 8–12 plus variants |\n| Regions with gameplay | 1 arena | 1 district + arena | 2 compact realms | 3 worlds | 4+ worlds/dungeons |\n| Structured quests | 0 | 8–12 | 20–30 | 45–60 | 100+ including repeatables |\n| Co-op activities | Local test only | One shared hunt | One dungeon | Several boss/event types | Seasonal raids and wars |\n| PvP | Two-player test | Friendly duel | Duel arena | Ranked 1v1 + later 2v2 | Multiple seasonal formats |\n\n**Core production principle:** Ten skills built from a tested ability framework are better than 100 beautiful isolated scripts. Four excellent bosses with distinct mechanics are better than twenty HP sponges. A small hub where players see one another is better than a gigantic mostly empty world.\n\n### Six starter enemy designs (concept-only, build as data-driven variants)\n\n| Enemy | Teaches | Signature attacks | Counters |\n|---|---|---|---|\n| Wandering Shade | Basic melee rhythm | Two claw strikes + slow swipe | Dodge/guard and punish recovery |\n| Armoured Husk | Guard break | Shield stance + obvious heavy | Heavy strike, flank, stun |\n| Ether Archer | Cover | Charged line shot + retreat | LOS, pressure, interrupt |\n| Rift Lurker | Movement | Telegraphed charge + leap | Sidestep; punish missed rush |\n| Binding Revenant | Dispel & timing | Slow field + bind | Break cast / exit zone |\n| Apex Stalker | Mini-boss preparation | Combo mixup, fake windup, ground pulse | Reading tells; never guessing invisible damage |\n\n### Six proposed launch ability kits and real gameplay differences\n\n| Kit | Role | Skill 1 | Skill 2 | Skill 3 | Signature weakness |\n|---|---|---|---|---|---|\n| Ember Blade | Sword burst | Short flaming dash | Heat-parry counter | Narrow flame cleave | Commits to close range |\n| Tempest Blade | Mobility | Quick air slash | Wind reposition | Wide but weak gust control | Lower guard capacity |\n| Stone Ward | Tank/control | Fortify guard | Knockback wall | Ground-break zone | Slow pursuit |\n| Ravenous Claw | Hollow hunter | Grapple leap | Prey mark | Risky devour strike | Vulnerable on miss |\n| Bone Lance | Hollow ranged | Spear throw | Armour shard shield | Ricochet burst | Small safe zone close up |\n| Spirit Archer | Quincy precision | Held shot | Fast volley | Reflecting defensive screen | Needs aim/spacing |\n\nKits are original proposals for the design baseline; **do not copy specific canonical character abilities or animation sequences into publishable assets** without the relevant rights.\n\n## 12. Detailed production recipes — what to do during an actual work session\n\n### Recipe A — Build your first functional combat move\n\n1. **Decide the rules in plain English:** Who can use the move? Starting pose? Wind-up? Contact frames? How close? Can it be blocked, dodged or parried? What does it cost? What happens if interrupted? Document answers in a half-page contract.\n2. **Make gray shapes only:** a rectangular practice arena, one R15 dummy and a simple animation. No neon, sounds or cinematic cuts yet.\n3. **Request the implementation as three modules:** a shared AbilityDefinition, server validated action, and client input/animation preview. Declare what service owns each state. Don't tell AI to create ad-hoc permanent damage on `Touched` and don't let the client send how much damage it dealt.\n4. **Test expected use:** cast at valid distance, confirm one hit; cast out of range, no hit; cast with insufficient spirit, no cast; cast while stunned, blocked; cast twice instantly, one cooldown; target behind wall, no hit.\n5. **Test hostile use:** send a huge number or invalid type for positions, try fake target identity, spam remote, rapid weapon switch, die during cast. Game must remain stable with no reward exploit.\n6. **Add audiovisual feedback only after proof:** tiny trail, contact spark, three separate sounds (start, hit, blocked); use asset provenance log and volume group.\n7. **Record video at two camera angles and test low graphics.** Commit only if the motion, hit and damage all match what the viewer perceives.\n\n### Recipe B — Build a new quest without a new script for every NPC\n\n1. Write its reason for existing: teach dash, tell a story, introduce a region, earn a skill or support a faction; no meaningless ten-kill filler.\n2. Draft **one data record** with quest ID, level/faction prerequisites, dialogue ID, objective types, target spawn region, reward, next ID and checkpoint.\n3. Reuse objective handlers: combat kill credited by server; interact within verified distance; timed defence validated server side; escort success from NPC state, never from client claim.\n4. Add a journal entry and objective marker that clears after completion. Ensure the quest never depends on another human being online.\n5. Test quitting before and after each step, double reward claim, walking away mid-defence, changing realm, companion death and quest cancel.\n6. Ask one unfamiliar person to find and finish it with no developer commentary.\n\n### Recipe C — Build a Blender asset actually suitable for Roblox\n\n1. Start with an **in-game reference**, not a photoreal concept: R15 dummy beside target prop, measurements in studs, camera screenshot and colour palette.\n2. Build in Blender with large readable geometry, clean bevels, minimal unnecessary backfaces, appropriate pivot at base or grip and separate rigid moving parts where needed.\n3. Mark object origin, scale, material names and exported file name; only create texture maps you need (often colour/roughness plus simple normal). Use original art or permitted source material.\n4. Export FBX or glTF as supported by your Roblox workflow; import into Studio, inspect scale, mesh triangulation, collision, normals and texture assignments.\n5. Rig/attach to R15, test run/dodge/attack/camera from all sides and on mobile quality. Create LOD or simpler far representation where it provides measured value.\n6. Capture Studio screenshot beside concept at same distance. Fix silhouette first, materials second, microdetail last. Store `.blend` **and** final source file; log credits/licence.\n\n### Recipe D — Make one training trial feel like an anime awakening\n\n1. Write the player's current challenge: e.g. they always rush, so their spirit tests patience; or they defend others, so they must save targets under time pressure.\n2. Build a 90–180-second encounter using the standard combat AI and modular geometry, not an entire unique game mode engine.\n3. Make three learnable phases: recognise the gimmick → use the counter taught in training → win or survive a climax. Give clear respawn/checkpoint on failure.\n4. Reward one new **mechanic**, not only +15% damage; show it immediately in a safe demonstration arena.\n5. Support solo play and an optional spectator/friend mode. Ensure the trial can be retried with no paid re-roll.\n6. Validate every state of reconnect, death, skipping the cutscene, empty server and controller input.\n\n### Recipe E — Safe update and data migration\n\n1. Work in a separate test experience and branch. Write the migration ahead of the feature.\n2. Create sample saved profiles from two previous versions, including unusual empty inventory and max progression.\n3. Run migration on fixtures, then load into the test experience. Check balances, owned powers, ranks and quest flags.\n4. Test saving twice and loading during a parallel join. Test after a teleport failure.\n5. Only after passing, enable the feature in release candidate; keep a rollback flag and backup. Never manually reset user data as a 'quick fix'.\n\n### Recipe F — A meaningful first-time-player test\n\nAsk five people who have not seen the project to play **without telling them where to go**. Note: seconds until movement, first successful attack, first skill, first meaningful reward; times they open menu, wander confused, die, disconnect or ask for help. Ask what their next goal is at minute five. Rework the biggest confusion before adding a new skill. The target of fun in under five minutes aligns with Roblox's own onboarding guidance; it is a target, not a guaranteed retention result.\n\n## 13. Recommended weekly routine for one teenager using AI builders\n\nAn example **10-hour week** (adapt around school, homework and personal life; treat times as flexible):\n\n| Session | Your job | AI's job | Evidence kept |\n|---|---|---|---|\n| Monday, 45 min | Pick one task, agree exact scope and tests | ChatGPT prepares one-page implementation contract | Task brief |\n| Tuesday, 90 min | Watch code changes; answer design questions | Claude implements one bounded module | Git diff + tests |\n| Wednesday, 60 min | Run Studio and deliberately try to break it | ChatGPT helps analyse video and bugs | Capture and repro steps |\n| Thursday, 90 min | Fix highest severity failure | Claude patches only defective code | Regression tests |\n| Friday, 45 min | Add one tiny improvement or documentation | AI updates comments, task list and test notes | Commit |\n| Weekend, 3–4 h | Integrate, play with others, test phone/controller, build one asset | Claude/ChatGPT assist with asset/scripts and compare captures | Approved playable build |\n\n**One task is not necessarily one prompt.** A large task can take several weeks. Important work that the AI cannot substitute for: deciding what feels fun, using Roblox Studio, verifying code outcomes, reviewing copyrighted content, keeping backups, speaking to testers and prioritising what you don't build.\n\n### Reusable Claude build prompt (copy, fill placeholders)\n\n```text\nYou are helping one solo Roblox developer build NUMEN, a third-person\nspiritual action RPG. Work from the current repository and the exact task\ncontract below. Do not invent additional game systems or silently refactor\nunrelated files. If information is missing, list a small number of explicit\nassumptions and ask before making irreversible changes.\n\nTASK: [PHASE.TASK + TITLE]\nREASON: [WHY IT EXISTS]\nDEPENDENCIES: [PREREQUISITE MODULES / IMPLEMENTED APIs]\nFILES YOU MAY CHANGE: [LIST PATHS]\nPUBLIC API / DATA CONTRACT: [SIGNATURES / SCHEMA]\nPLAYER BEHAVIOUR: [START → ACTION → OUTCOME]\nEXPLOIT/RACE RISKS: [INVALID REMOTE, DUPLICATE REWARD, DISCONNECT]\nACCEPTANCE TESTS: [5–10 PROOFS FROM THE MASTER BACKLOG]\nPERFORMANCE/DEVICE: [LOW GRAPHICS / MOBILE / NETWORK GOALS]\nASSETS: [ONLY APPROVED AND OWNED SOURCES]\n\nDeliver: short plan; small implementation; unit and Studio test instructions;\nexact files changed; known gaps; 20-second capture steps; rollback steps.\nStop if the change would overwrite production data or locked content.\nDo not claim it works without executing the test or clearly saying it wasn't run.\n```\n\n### Reusable ChatGPT feature research prompt\n\n```text\nWe are planning NUMEN feature [NAME], task [ID] in the independent blueprint.\nCompare the player experience offered by Peroxide, TYPE://SOUL,\nVV: ULTIMATUM and Reaper 2 using cited, current primary sources where possible.\nSeparate directly verified facts from inference. Propose three versions:\n1) a simple buildable MVP; 2) a polished alpha; 3) aspirational full release.\nFor each: gameplay loop, controls, server/client data, progress rewards,\n1–3 free tools, risks, tests, time cost for a beginner and copy-paste-ready\nClaude implementation brief. Keep all purchases at £5 or below each and do\nnot assume copyrighted franchise assets can be shipped without permission.\n```\n\n### Reusable code-review prompt\n\n```text\nReview this Luau diff as a Roblox network/security engineer.\nCheck client trust, RemoteEvent schemas, server rate limits, state-machine\ntransitions, resource/cooldown double spending, DataStore consistency,\nresource leaks, nil/NaN/Inf, cleanup on death and teleport, mobile control\nfallback, low graphics performance and tests. Rank P0/P1/P2 problems and\npropose minimal patches. State which concerns are evidenced and which are\nhypotheses needing Studio test.\n```\n\n### Reusable asset/model generation brief\n\n```text\nDesign one original, game-ready Roblox asset: [ASSET].\nTarget player R15 height is ~5 studs; target dimensions [X,Y,Z] studs.\nSilhouette: [DISTINCTIVE 3 SHAPES]. Materials: [PALETTE]; max [APPROPRIATE]\ngeometry budget as an experimental starting point, not a Roblox limit.\nProvide front, side and three-quarter orthographic references, pivot/grip\nlocation, moving parts, collision scheme, texture plan, animation risks,\nexport guidance and a Studio validation checklist. Prefer free Blender\nmodelling and built-in Studio tools. Make this original; do not copy a\nprotected anime model, audio recording or texture.\n```\n\n## 14. Numerical tuning and anti-grind balance lab\n\nAll values here are **pure prototype starting assumptions**, not Bleach canon or measured competitor formulas. Use a spreadsheet and captured fights to tune rather than treating a formula as the game's identity.\n\n**XP curve to prototype:** `XP_to_next(L) = round(100 + 25*L + 3*L^2)`. At L1: 128 XP; at L10: 650; at L30: 3550. This gives a rising cost but must be **matched to quest XP/hour**; the real goal is perceptible rewards and good pacing, not a large cap. Reaching top-level solely by killing low-level enemies should be inefficient. Quest XP should roughly reflect 2–4 times a similarly-levelled ordinary enemy when the quest takes a few minutes and includes varied objectives.\n\n**Physical/spirited combat prototype:** `Raw = BaseAbilityDamage * (1 + 0.025 * RelevantStat) * (1 + MasteryBonus)` then `Damage = max(1, Raw * (100/(100 + EffectiveDefence)))`, with PvP multipliers and mitigation controlled by the server. This is an intentionally simple starting formula; adjust constants only after running time-to-kill scenarios. No giant exponent in an isolated skill script. Put shields, guard, parry and special resistances through a documented modifier pipeline with deterministic order.\n\n**Pacing targets to test:** first hit under 5 minutes; first owned special 10–20 minutes; one memorable trial within 45–90 minutes; a reasonable short-term goal every 10–20 minutes; an early-game character can meaningfully fight an enemy 1–2 bands above them using skill, not only raw stats. Mandatory grind to the first satisfying form is a warning sign.\n\n**Combat balance checks:** simulate 100 equal-skill duels per kit pair eventually; before that, use practice dummy results and 5 human testers. Record average combo damage, startup frames, number of unavoidable confirms, stun lock durations, escape windows, per-second resource consumption, network delay and mobile aim. Do not tweak kit numbers solely because its flashy effect looks large.\n\n**Fight examples for initial testing:** (a) same level sword vs sword; (b) sword vs bow at 20/50 studs; (c) two newbies vs one elite NPC; (d) Hollow in cramped alley; (e) duel under 150 ms network simulation; (f) three powers overlapping in a small arena; (g) attack while low FPS; (h) transformation while stunned; (i) cross-zone PvP boundary; (j) novice under pressure vs veteran in a protected hub. These are fixtures, not necessarily all user-facing modes.\n\n**Loot and currency:** common equipment should be predictable, important transformations are always earnable without purchase, rare drops should typically be prestige/cosmetics or sidegrades. If a fight gives less than meaningful progress for 5 minutes, add a new objective or clearer reward rather than doubling its enemy count.\n\n## 15. Testing gates and quality bar (write pass/fail, never vague approval)\n\n| Gate | Minimum evidence required |\n|---|---|\n| **Combat G1** | 2-client video showing normal combo, parry, dodge and 1 projectile; dummy hit audit; zero remote-controlled damage exploits; no permanent locked combat state after 20 deaths. |\n| **RPG G2** | Fresh profile → first fight → quest → reward → new skill → boss → save → rejoin; five novices; complete run filmed; no manual developer assistance. |\n| **Soul Reaper G3** | Training, purification, first release trial, one patrol, readable UI, one repeatable activity; player can finish entirely solo. |\n| **Hollow G3** | Spawn separately, hunt, feed, evolve once, safe portal or exit, no spawn-griefing, all server validated; starter and developed form both animate. |\n| **Quincy G4** | Precise ranged combat across PC/controller/touch, resource absorption, bow builds, faction story, and one release challenge. |\n| **World G4** | The 3 main destinations each have spawn, quest, enemy, role-specific activity and safe exit; cross-place teleport tested in a *published test* experience, not Studio only. |\n| **Endgame G5** | Highest forms each counterable, 2+ meaningful weekly non-PvP pursuits, multiplayer encounters, optional ranked, player return data. |\n| **Safety** | No uncontrolled third-party scripts, no unapproved copyrighted production art/audio, no exploits from client trust, clear accessibility controls and platform moderation compliance. |\n| **Performance** | Record 60 FPS aspiration on mid PC, 30 FPS baseline phone and stable network in representative 4-player encounter, rather than claiming universal results. Targets must be tested against a real chosen device. |\n| **Data** | Simulated double login, queued save, disconnect mid reward, teleport retry, migration and rollback; no duplicated currency or destroyed account progression. |\n\n**Definition of done for each individual task:** written acceptance, code/asset source stored in Git, no known critical errors in Output, test passes (or explicitly marked untested), visual capture for player-facing work, device notes, security review where needed, and your acceptance. A screenshot of a nice move is not proof that its damage, saving or multiplayer works.\n\n## 16. Major mistakes to avoid — specific to AI-assisted solo development\n\n1. **Building the entire world before gameplay.** Correct approach: graybox 5 landmarks and one arena, then prove a 30-minute loop.\n2. **Starting with ultimate VFX** because it looks impressive. Correct approach: animation markers + server combat + hit consistency → then VFX layers.\n3. **One giant Claude session.** Correct: one small contract, named files, tests, diff and rollback each session.\n4. **Unreliable, overwritten saves.** Correct: schema versions, session ownership, server-only transactions and simulation of failures from month one.\n5. **Making PvP mandatory for core progression.** Correct: optional rank/duels, equally valid PvE trials, and newcomers protected at spawn.\n6. **Building three races as identical skill trees with new colours.** Correct: sword mastery vs predation/evolution vs spirit-particle precision, and one original interaction per race.\n7. **Ignoring mobile because you develop on Windows.** Correct: device simulator from first controls and real phone test before alpha.\n8. **Downloading random free models with hidden code.** Correct: original models where possible; inspect all third-party assets/scripts and record licence.\n9. **Copying characters, anime music, masks or official art without permission.** Correct: develop original content or obtain a suitable licence through available channels.\n10. **Shipping 100 skills without counterplay.** Correct: polished 3–6 kits, transparent hitboxes, repeated PvP/PvE testing, then grow.\n11. **Adding infinite map size to appear ambitious.** Correct: dense areas with goals, streaming and clear region identity. Expand from player demand.\n12. **Trusting AI declarations of success.** Correct: no test, no 'Done'; play in Studio and record the result.\n13. **Creating tasks named only 'Make Soul Society'.** Correct: split into size/layout, graybox, modular kit, atmosphere, gameplay placements, travel, streaming, performance and acceptance.\n14. **Buying special plugins to skip learning fundamentals.** Correct: Studio + Rojo + Blender + free tools first; paid tools only if a proven time saver and separately approved.\n15. **Putting everything into one giant controller script.** Correct: typed shared definitions, server services, client controllers, reusable modules and tests.\n\n## 17. Source register — what was verified versus what was invented\n\n**External primary sources (checked 12 October 2026):**\n\n- Peroxide official Roblox listing — fighting monsters, trials and controls: https://www.roblox.com/games/9096881148/Peroxide\n- TYPE://SOUL official Roblox listing — multiple transformation controls, game creators and control complexity: https://www.roblox.com/games/14067600077/TYPE-SOUL\n- VV: ULTIMATUM official Roblox listing — factions, 130+ abilities claim and team credits: https://www.roblox.com/games/6270290407/VV-ULTIMATUM\n- Reaper 2 official Roblox listing — quest/XP/skills/all-platform controls: https://www.roblox.com/games/7056922815/Reaper-2\n- Project Mugetsu official Roblox listing — binding/meditation feature and controls: https://www.roblox.com/games/9447079542/Project-Mugetsu\n- Rolimon's time-sensitive game snapshots; historical visits/peaks don't prove sustained retention: https://www.rolimons.com/game/9096881148 ; https://www.rolimons.com/game/14067600077 ; https://www.rolimons.com/game/6270290407 ; https://www.rolimons.com/game/9447079542 ; https://www.rolimons.com/game/7056922815\n- Roblox: Retention and early onboarding: https://create.roblox.com/docs/production/analytics/retention\n- Roblox: Securing the client-server boundary: https://create.roblox.com/docs/scripting/security/client-server-boundary\n- Roblox: Persistent DataStore: https://create.roblox.com/docs/cloud-services/data-stores\n- Roblox: MemoryStore: https://create.roblox.com/docs/cloud-services/memory-stores\n- Roblox: Multi-client Studio testing: https://create.roblox.com/docs/studio/testing-modes\n- Roblox: TeleportService limitations: https://create.roblox.com/docs/reference/engine/classes/TeleportService\n- Roblox: performance analytics and profiling: https://create.roblox.com/docs/production/analytics/performance\n- Roblox: third-party asset risks: https://create.roblox.com/docs/scripting/security/third-party-vulnerabilities\n- Roblox: IP guidelines and licensable IP: https://create.roblox.com/docs/production/publishing/ip-guidelines ; https://create.roblox.com/docs/ip-licensing/creators\n- Roblox: paid random items and monetisation: https://create.roblox.com/docs/production/monetization/paid-random-items ; https://create.roblox.com/docs/production/monetization\n- Roblox: official Studio MCP AI integration: https://create.roblox.com/docs/ai/accelerated-workflows\n- Roblox: Creator Store assets and plugins: https://create.roblox.com/docs/production/creator-store\n- Rojo, StyLua, Selene and Wally repos, licence / workflow information: https://github.com/rojo-rbx/rojo ; https://github.com/JohnnyMorganz/StyLua ; https://github.com/Kampfkarren/selene ; https://github.com/UpliftGames/wally\n- Blender official free software: https://www.blender.org/\n\n**Research limitation:** I have not playtested every one of these games at every rank, and official descriptions do not document all hidden progression rules. Most game mechanics, level gates, skill lists, balancing figures, storyline and release milestones in this file are **my proposed design inferred from genre patterns**, not secretly copied mechanics and not confirmed current implementations. Any claim about a game's current player count should be checked again at decision time.\n\n**IP warning:** Roblox prohibits unauthorised use of someone else's protected content and supports a licence catalogue for eligible IP. A 'Bleach-inspired' original spiritual game can take inspiration from broad themes and genre gameplay, but publishing direct franchise branding, character likenesses, music or recognisably copied expression may require permission. The title NUMEN itself should receive a name/trademark check before major advertising.\n\n"}</script>

function taskState(id){const o=getRec(taskIdKey(id));return {status:'todo',workshop:false,assignees:[],checklist:[],notes:[],links:[],media:[],history:[],...o}}
function allPhases(){const extra=getRec('meta:phases').phases||[];return [...seedPhases,...extra]}
function allTasks(){let deleted=new Set(getRec('meta:deleted').ids||[]);let extras=Object.entries(state.records).filter(([k,v])=>k.startsWith('task:')&&v.data?.taskMeta&&!deleted.has(v.data.taskMeta.id)).map(([k,v])=>v.data.taskMeta);return [...seedTasks,...extras].filter(t=>!deleted.has(t.id))}
function getTask(id){let t=allTasks().find(x=>x.id===id);if(!t)return null;let st=taskState(id);return {...t,title:st.titleOverride??t.title,why:st.whyOverride??t.why,implementation_instructions:st.instructionsOverride??t.implementation_instructions,acceptance_test:st.acceptanceOverride??t.acceptance_test,suggested_tools:st.toolsOverride??t.suggested_tools,priority:st.priorityOverride??t.priority,effort:st.effortOverride??t.effort}}
function tasksOfPhase(id){return allTasks().filter(t=>t.phase_id===id)}
function calcCounts(arr){let done=arr.filter(x=>taskState(x.id).status==='done').length;return {done,total:arr.length,pct:arr.length?Math.round(done/arr.length*100):0}}
function progressHTML(arr){let c=calcCounts(arr);return `<div class="pbar"><div style="width:${c.pct}%"></div></div>`}
function personChips(st){return st.assignees?.length?st.assignees.map(p=>`<span class="badge">${esc(personInitials(p))}</span>`).join(''):'<span class="tiny muted">Unassigned</span>'}
function statusBadge(status){return badge(STATUSNAME[status]||status,status)}
function go(page,task=null){state.page=page;state.selectedTask=task;state.mobileMenu=false;state.modal=null;window.location.hash=task?`task/${encodeURIComponent(task)}`:page;render()}
function navRender(){return `<aside class="sidebar ${state.mobileMenu?'open':''}"><div class="brand"><div class="brandmark">N</div><div><h1>NUMEN</h1><small>DEVELOPMENT SPACE</small></div></div><div class="navsection">WORKSPACE</div>${NAV.slice(0,5).map(([key,i,n])=>navButton(key,i,n)).join('')}<div class="navsection">LIBRARY & TEAM</div>${NAV.slice(5).map(([key,i,n])=>navButton(key,i,n)).join('')}<div class="sidefoot"><div class="sync"><span class="dot ${state.mode==='cloud'?'online':''}"></span>${state.mode==='cloud'?'Cloud collaboration active':'Saved locally on this device'}</div><div class="tiny muted" style="margin-top:7px">Independent blueprint · ${allTasks().length} tasks</div>${state.mode==='local'?'<button class="btn sm wide" data-act="open-cloud">Set up team sync →</button>':`<button class="btn sm wide" data-act="go-team">${esc(state.team?.name||'Team')} ↗</button>`}</div></aside>`}
function navButton(key,ic,n){return `<button class="navbtn ${state.page===key?'active':''}" data-act="nav" data-page="${key}"><span class="ico">${ic}</span><span>${esc(n)}</span>${key==='workshop'?`<span class="count">${allTasks().filter(t=>taskState(t.id).workshop).length}</span>`:''}</button>`}
function headerRender(){let title=state.selectedTask?`Task ${state.selectedTask}`:(NAV.find(x=>x[0]===state.page)?.[2]||'Workspace');return `<div class="top"><button class="btn sm mobiletoggle" data-act="mobile-menu">☰ Menu</button><div class="crumb">NUMEN <span style="color:var(--faint)"> / </span> <strong>${esc(title)}</strong></div><div class="topright"><button class="searchTop" data-act="search-modal">⌕ &nbsp;Search plans, tasks, notes… <span class="keyhint">Ctrl K</span></button><span class="personpill" title="${attr(personName(personId()))}">${esc(personInitials(personId()))}</span></div></div>`}
function render(){document.documentElement.dataset.theme=state.theme;$('#root').innerHTML=`<div class="sidebarShade ${state.mobileMenu?'show':''}" data-act="close-sidebar"></div><div class="app">${navRender()}<div class="main">${headerRender()}<main class="content">${state.selectedTask?taskPage(state.selectedTask):pageRender()}</main></div></div>`;renderModal();fillAssetPreviews()}
function pageRender(){switch(state.page){case'dashboard':return dashboardPage();case'roadmap':return roadmapPage();case'workshop':return workshopPage();case'codex':return codexPage();case'tree':return treePage();case'assets':return assetsPage();case'team':return teamPage();case'settings':return settingsPage();default:return dashboardPage()}}
function pageHeader(k,title,lead,actions=''){return `<div class="row between wrap" style="align-items:end;margin-bottom:7px"><div><div class="eyebrow">${esc(k)}</div><h1 class="pageTitle">${esc(title)}</h1></div><div class="row wrap">${actions}</div></div><p class="pageLead">${lead}</p>`}
function dashboardPage(){let tasks=allTasks(),c=calcCounts(tasks),queued=tasks.filter(t=>taskState(t.id).workshop),doing=tasks.filter(t=>taskState(t.id).status==='doing'),review=tasks.filter(t=>taskState(t.id).status==='review'),assigned=tasks.filter(t=>taskState(t.id).assignees.includes(personId())&&taskState(t.id).status!=='done'),next=doing[0]||queued.find(t=>taskState(t.id).status!=='done')||tasks.find(t=>taskState(t.id).status!=='done'), phases=allPhases().slice(0,6),events=state.events.slice(0,7);
return pageHeader('Your development home','Build something remarkable.','Your current tasks, milestones and team activity are all in one place.',`<button class="btn" data-act="open-add-task">+ New task</button>`)+`<div class="statrow"><div class="stat"><span>Overall progress</span><b class="accent">${c.pct}%</b><span>${c.done} / ${c.total} tasks approved</span></div><div class="stat"><span>Active work</span><b>${doing.length}</b><span>In progress</span></div><div class="stat"><span>Awaiting review</span><b>${review.length}</b><span>Ready to inspect</span></div><div class="stat"><span>Your assignments</span><b>${assigned.length}</b><span>Not yet approved</span></div></div><div class="grid2"><div class="stack"><div class="panel"><div class="row between"><h2 class="cardTitle">Continue building</h2>${badge('NEXT UP','core')}</div>${next?`<div style="margin-top:14px" class="eyebrow">${esc(next.id)} · ${esc(next.phase_title)}</div><h3 style="font-size:21px;margin:7px 0">${esc(next.title)}</h3><p class="muted">${esc(next.implementation_instructions)}</p><div class="row wrap" style="margin-top:15px"><button class="btn primary" data-act="task" data-id="${attr(next.id)}">Open full task →</button>${!taskState(next.id).workshop?`<button class="btn" data-act="pin" data-id="${attr(next.id)}">+ Add to workshop</button>`:''}</div>`:'<div class="empty">Every task is complete.</div>'}</div><div class="panel"><div class="row between"><h2 class="cardTitle">Development phases</h2><button class="btn ghost sm" data-act="nav" data-page="roadmap">Full roadmap →</button></div><div style="margin-top:12px">${phases.map(p=>{let arr=tasksOfPhase(p.idx),n=calcCounts(arr);return `<div style="margin:13px 0"><button class="tasktitle" data-act="open-phase" data-id="${p.idx}">${p.idx} · ${esc(p.title)}</button><div class="row" style="margin-top:6px"> <div class="grow">${progressHTML(arr)}</div><span class="miniCount">${n.done}/${n.total}</span></div></div>`}).join('')}</div></div></div><div class="stack"><div class="panel"><div class="row between"><h2 class="cardTitle">Your workshop</h2><button class="btn ghost sm" data-act="nav" data-page="workshop">Open →</button></div>${queued.length?queued.slice(0,6).map(t=>taskRow(t,false)).join(''):'<div class="empty" style="margin-top:15px">No tasks added yet.<br><button class="btn sm" style="margin-top:12px" data-act="nav" data-page="roadmap">Browse roadmap</button></div>'}</div><div class="panel"><h2 class="cardTitle">Recent changes</h2>${events.length?events.map(eventRow).join(''):'<p class="muted small">Activity will appear here as you and your teammate make changes.</p>'}</div></div></div>`}
function taskRow(t,showPin=true){let s=taskState(t.id);return `<div class="taskrow"><span class="taskid">${esc(t.id)}</span><div class="taskrowmain"><button class="tasktitle" data-act="task" data-id="${attr(t.id)}">${esc(getTask(t.id)?.title||t.title)}</button><div class="taskdesc">${esc(snip(getTask(t.id)?.implementation_instructions||t.implementation_instructions,105))}</div></div><div class="taskactions">${personChips(s)}<span class="badge ${s.status}">${esc(STATUSNAME[s.status])}</span>${showPin?`<button class="btn sm ${s.workshop?'ghost':''}" title="${s.workshop?'Remove from workshop':'Add to workshop'}" data-act="pin" data-id="${attr(t.id)}">${s.workshop?'✓':'＋'}</button>`:''}</div></div>`}
function roadmapPage(){let phases=allPhases(),tasks=allTasks();return pageHeader('01 / Plan','Development roadmap','Browse the complete independent blueprint in build order. Expand any phase, open its task, or add work to the Workshop.',`<button class="btn" data-act="open-add-phase">+ Phase</button><button class="btn" data-act="open-add-task">+ Task</button>`)+`<div class="filterbar"><input class="inp" id="roadSearch" placeholder="Search task title or instructions…" value="${attr(state.search)}"><select class="sel" data-change="filter-status"><option value="all">All statuses</option>${STATUSES.map(x=>`<option ${state.filterStatus===x?'selected':''} value="${x}">${STATUSNAME[x]}</option>`).join('')}</select><select class="sel" data-change="filter-priority"><option value="all">All priorities</option>${PRIORITIES.map(x=>`<option ${state.filterPriority===x?'selected':''}>${x}</option>`).join('')}</select><select class="sel" data-change="filter-person"><option value="all">Everyone</option><option value="unassigned" ${state.filterPerson==='unassigned'?'selected':''}>Unassigned</option>${getPeople().map(m=>`<option value="${attr(m.user_id)}" ${state.filterPerson===m.user_id?'selected':''}>${esc(m.display_name)}</option>`).join('')}</select></div><div class="small muted" style="margin-bottom:11px">${tasks.length} tasks · ${phases.length} phases · Click a phase to expand</div>${phases.map(p=>{let arr=tasksOfPhase(p.idx),matching=arr.filter(t=>{let s=taskState(t.id),d=getTask(t.id);return (!state.search||[d.title,d.implementation_instructions,d.why,d.id].join(' ').toLowerCase().includes(state.search.toLowerCase()))&&(state.filterStatus==='all'||s.status===state.filterStatus)&&(state.filterPriority==='all'||d.priority===state.filterPriority)&&(state.filterPerson==='all'||(state.filterPerson==='unassigned'?!s.assignees.length:s.assignees.includes(state.filterPerson)))});if(!matching.length)return'';let open=state.openPhases.has(p.idx)||state.search||state.filterStatus!=='all'||state.filterPriority!=='all'||state.filterPerson!=='all',c=calcCounts(arr);return `<section class="phase"><button class="phaseHeader" data-act="toggle-phase" data-id="${p.idx}"><span class="phaseNo">${esc(p.idx)}</span><span class="grow"><strong style="font-size:15px">${esc(p.title)}</strong><span class="small muted" style="display:block">${esc(snip(p.goal,130))}</span></span><span class="miniCount">${c.done}/${c.total}</span><span class="badge">${c.pct}%</span><span style="font-size:16px">${open?'⌄':'›'}</span></button>${open?`<div class="phaseBody"><div class="phaseGate"><b>Phase exit test:</b> ${esc(p.gate)}<div style="margin-top:5px">Dependencies: ${esc(p.depends)}</div></div>${matching.map(t=>taskRow(t)).join('')}<button class="btn sm" style="margin-top:12px" data-act="open-add-task" data-phase="${p.idx}">+ Add a task in this phase</button></div>`:''}</section>`}).join('')||'<div class="empty">No tasks match these filters.</div>'}`}
function workshopPage(){let arr=allTasks().filter(t=>taskState(t.id).workshop);if(state.workFilter==='mine')arr=arr.filter(t=>taskState(t.id).assignees.includes(personId()));if(state.workFilter==='other')arr=arr.filter(t=>taskState(t.id).assignees.some(x=>x!==personId()));return pageHeader('02 / Action','Developer workshop','Your active workload. Tasks stay linked to the Roadmap; removing one from here does not delete it.',`<button class="btn" data-act="nav" data-page="roadmap">+ Find tasks</button>`)+`<div class="filterbar">${[['all','All workshop tasks'],['mine','Assigned to me'],['other','Teammate / shared']].map(([id,label])=>`<button class="btn sm ${state.workFilter===id?'primary':''}" data-act="work-filter" data-value="${id}">${label}</button>`).join('')}</div><div class="workgrid">${[['todo','QUEUE'],['doing','IN PROGRESS'],['review','NEEDS REVIEW'],['done','APPROVED']].map(([st,name])=>`<div class="workcol"><div class="row between"><strong class="small">${name}</strong><span class="badge">${arr.filter(t=>taskState(t.id).status===st).length}</span></div>${arr.filter(t=>taskState(t.id).status===st).map(t=>workCard(t)).join('')||'<div class="muted tiny" style="margin-top:18px">Nothing here yet</div>'}</div>`).join('')}</div>${arr.filter(t=>taskState(t.id).status==='blocked').length?`<div class="panel" style="margin-top:16px"><h2 class="cardTitle">Blocked work</h2>${arr.filter(t=>taskState(t.id).status==='blocked').map(t=>taskRow(t)).join('')}</div>`:''}`}
function workCard(t){let s=taskState(t.id);return `<div class="workitem"><div class="eyebrow">${esc(t.id)} · ${esc(getTask(t.id).priority)}</div><button class="titlelink" data-act="task" data-id="${attr(t.id)}">${esc(getTask(t.id).title)}</button><div class="tiny muted" style="margin-top:5px">${esc(snip(t.phase_title,44))}</div><div class="row"><span class="miniCount">${s.assignees.length?s.assignees.map(personName).join(', '):'Unassigned'}</span><button class="btn ghost sm" data-act="pin" data-id="${attr(t.id)}">Remove</button></div><select class="sel" aria-label="Change status" style="width:100%;margin-top:9px" data-change="task-status" data-id="${attr(t.id)}">${STATUSES.filter(x=>x!=='done'||isOwner()||s.status==='done').map(x=>`<option value="${x}" ${s.status===x?'selected':''}>${STATUSNAME[x]}</option>`).join('')}</select></div>`}
function taskPage(id){const t=getTask(id);if(!t)return '<div class="empty">Task not found. <button class="btn" data-act="nav" data-page="roadmap">Back to roadmap</button></div>';const s=taskState(id),p=allPhases().find(x=>x.idx===t.phase_id),check=s.checklist||[],notes=s.notes||[],links=s.links||[],media=s.media||[],history=s.history||[];
return `<div class="row between wrap" style="margin-bottom:16px"><button class="btn sm" data-act="go-parent" data-id="${attr(t.phase_id)}">← Back to roadmap</button><div class="row wrap"><button class="btn sm" data-act="previous-task" data-id="${attr(id)}">← Previous</button><button class="btn sm" data-act="next-task" data-id="${attr(id)}">Next →</button></div></div><div class="eyebrow">${esc(t.id)} · ${esc(p?.title||'Custom phase')}</div><h1 class="pageTitle" style="margin-top:10px;max-width:850px">${esc(t.title)}</h1><div class="row wrap" style="margin-bottom:22px">${badge(t.priority,t.priority.toLowerCase())}${badge('Effort: '+t.effort)}${statusBadge(s.status)}<span class="small muted">${s.updatedAt?'Updated '+prettyDate(s.updatedAt):'From independent blueprint'}</span></div><div class="taskLayout"><div class="taskMain stack"><div class="panel"><h2 class="cardTitle">Overview</h2><div class="section"><h3>Why this task matters</h3><div class="infoBox">${esc(t.why||'Add an explanation of the outcome and purpose.')}</div></div><div class="section"><h3>What you need to do</h3><div class="infoBox" style="white-space:pre-wrap">${esc(t.implementation_instructions||'No instructions added yet.')}</div></div><div class="section"><h3>Completion test</h3><div class="infoBox" style="border-left:3px solid var(--green)">${esc(t.acceptance_test||'No completion criteria added yet.')}</div></div><div class="section"><h3>Tools / software</h3><div class="infoBox">${esc(t.suggested_tools||'To be chosen')}</div></div><div class="row wrap" style="margin-top:17px"><button class="btn primary" data-act="edit-task" data-id="${attr(id)}">Edit instructions</button><button class="btn" data-act="copy-prompt" data-id="${attr(id)}">Copy Claude build brief</button></div></div><div class="panel"><div class="row between"><h2 class="cardTitle">Steps & checklist</h2>${badge(check.filter(x=>x.done).length+' / '+check.length)}</div>${check.length?check.map((item,i)=>`<div class="checkrow"><input type="checkbox" data-change="check" data-id="${attr(id)}" data-i="${i}" ${item.done?'checked':''}><label style="${item.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(item.text)} <span class="tiny muted">${item.done&&item.doneBy?'· '+esc(personName(item.doneBy)):''}</span></label><button class="btn sm ghost" data-act="remove-check" data-id="${attr(id)}" data-i="${i}">×</button></div>`).join(''):'<p class="small muted">Break the task into small, testable steps as you work.</p>'}<div class="row" style="margin-top:15px"><input class="inp grow" id="newStep" placeholder="Add a checklist step…"><button class="btn" data-act="add-check" data-id="${attr(id)}">+ Add</button></div></div><div class="panel"><div class="row between"><h2 class="cardTitle">Reference images & files</h2>${iconButton('＋ Attach','upload-file',`data-id="${attr(id)}" data-group="reference"`)}</div><p class="small muted">Concept images, screenshots, Blender references, files and diagrams. Click an image to enlarge.</p>${renderAssetsForTask(media.filter(x=>x.group==='reference'),id)}</div><div class="panel"><div class="row between"><h2 class="cardTitle">Completed work & evidence</h2>${iconButton('＋ Attach result','upload-file',`data-id="${attr(id)}" data-group="evidence"`)}</div><p class="small muted">Show what was actually made: Studio captures, videos, models, test reports and before/after results.</p>${renderAssetsForTask(media.filter(x=>x.group==='evidence'),id)}</div><div class="panel"><div class="row between"><h2 class="cardTitle">Links & resources</h2>${iconButton('+ Add link','add-link',`data-id="${attr(id)}"`)}</div>${links.length?links.map((l,i)=>`<div class="linkrow row between"><div class="grow"><a href="${attr(safeUrl(l.url))}" target="_blank" rel="noopener noreferrer">${esc(l.title||l.url)} ↗</a><div class="tiny muted">${esc(l.url)}</div></div><button class="btn sm ghost" data-act="delete-link" data-id="${attr(id)}" data-i="${i}">Delete</button></div>`).join(''):'<div class="small muted">Add Roblox documentation, source files, tutorial videos, GitHub commits or other useful links.</div>'}</div><div class="panel"><h2 class="cardTitle">Notes & development journal</h2><p class="small muted">Record your decisions, problems, Claude's reports and what to do next. Each entry records its author and date.</p><textarea class="area" id="newNote" style="margin:12px 0" placeholder="Add a note, feedback or implementation report…"></textarea><div class="row between"><span class="tiny muted">Newest notes first</span><button class="btn primary sm" data-act="add-note" data-id="${attr(id)}">Save note</button></div>${notes.slice().reverse().map((n,idx)=>`<div class="note"><div class="noteHead"><span>${esc(personName(n.by))}</span><span>${esc(prettyDate(n.at))}</span></div><div class="noteBody">${esc(n.body)}</div></div>`).join('')}</div><div class="panel"><h2 class="cardTitle">Task history</h2>${history.length?history.slice().reverse().map(h=>`<div class="activity"><b>${esc(personName(h.by))}</b> · ${esc(h.action)} <span class="muted">· ${prettyDate(h.at)}</span></div>`).join(''):'<p class="small muted">Status changes, assignments and approvals will be shown here.</p>'}${state.mode==='cloud'?'<p class="tiny muted">Server-audited changes also appear on the Team & activity page.</p>':''}</div></div><aside class="taskaside stack"><div class="panel"><h2 class="cardTitle">Task controls</h2><div class="section"><label class="label">Status</label><select class="sel" style="width:100%" data-change="task-status" data-id="${attr(id)}">${STATUSES.filter(x=>x!=='done'||isOwner()||s.status==='done').map(x=>`<option value="${x}" ${s.status===x?'selected':''}>${STATUSNAME[x]}</option>`).join('')}</select></div><div class="section"><label class="label">Assigned to</label><div style="display:flex;flex-direction:column;gap:7px">${getPeople().map(m=>`<label style="font-size:12px;display:flex;gap:8px;align-items:center"><input type="checkbox" data-change="assignee" data-id="${attr( function renderAssetsForTask(arr,id){return arr.length?`<div class="assetsGrid" style="margin-top:14px">${arr.map(a=>assetTile(a,id)).join('')}</div>`:'<div class="empty" style="padding:18px;margin-top:12px">No attachments yet</div>'}

function codexPage(){let sections=CODEX.sections, selected=sections[state.docSection]||sections[0];return pageHeader('03 / Knowledge','Development codex','The complete independent blueprint, including research, progression guides, practical production recipes, free tools and the original task specifications.',`<button class="btn" data-act="export-blueprint">Download blueprint</button>`)+`<div class="docnav"><div class="panel doclist" style="padding:12px">${sections.map((s,i)=>`<button class="docnavitem ${state.docSection===i?'active':''}" data-act="doc-section" data-i="${i}">${esc(s.title)}</button>`).join('')}</div><div class="panel"><div class="eyebrow">FULL BLUEPRINT / SECTION ${state.docSection+1}</div><h2 class="pageTitle" style="font-size:24px">${esc(selected.title)}</h2><div class="markdown">${markdownToHtml(selected.content)}</div></div></div>`}
function safeUrl(url){try{const u=new URL(String(url));return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch(e){return '#'}}
function mdInline(str){let t=esc(str);t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,label,url)=>`<a href="${attr(safeUrl(url))}" target="_blank" rel="noopener noreferrer">${label}</a>`);t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>');return t}
function markdownToHtml(input){let lines=String(input||'').replace(/\r/g,'').split('\n'),out=[],inList='',inCode=false,code=[];function closeList(){if(inList){out.push('</'+inList+'>');inList=''}}for(let i=0;i<lines.length;i++){let l=lines[i],trim=l.trim();if(trim.startsWith('```')){closeList();if(!inCode){inCode=true;code=[]}else{out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);inCode=false}continue}if(inCode){code.push(l);continue}if(!trim){closeList();continue}if(/^\|/.test(trim)&&i+1<lines.length&&/^\|[\s:|-]+\|?$/.test(lines[i+1].trim())){closeList();let cols=x=>x.trim().replace(/^\||\|$/g,'').split('|').map(s=>s.trim());let headers=cols(trim);out.push('<table><thead><tr>'+headers.map(h=>`<th>${mdInline(h)}</th>`).join('')+'</tr></thead><tbody>');i+=1;while(i+1<lines.length&&/^\|/.test(lines[i+1].trim())){i++;out.push('<tr>'+cols(lines[i]).map(c=>`<td>${mdInline(c)}</td>`).join('')+'</tr>')}out.push('</tbody></table>');continue}let heading=trim.match(/^(#{1,4})\s+(.+)$/);if(heading){closeList();let level=Math.min(4,heading[1].length+1);out.push(`<h${level}>${mdInline(heading[2])}</h${level}>`);continue}if(trim.startsWith('>')){closeList();out.push(`<blockquote>${mdInline(trim.replace(/^>\s*/,''))}</blockquote>`);continue}let bullet=trim.match(/^([-*]|\d+\.)\s+(.+)$/);if(bullet){let typ=/\d/.test(bullet[1])?'ol':'ul';if(inList!==typ){closeList();out.push('<'+typ+'>');inList=typ}out.push('<li>'+mdInline(bullet[2])+'</li>');continue}closeList();out.push(`<p>${mdInline(trim)}</p>`)}closeList();if(inCode)out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);return out.join('')}
function treePage(){let groups=['foundation','systems','path','world','production','release'],opts=['all',...new Set(allPhases().map(p=>p.kind||'other'))];let arr=allPhases().filter(p=>state.treeKind==='all'||(p.kind||'other')===state.treeKind);return pageHeader('04 / Dependencies','Game system tree','A readable dependency map. Choose a system to inspect its prerequisites, exit tests and associated tasks.',`<button class="btn" data-act="nav" data-page="roadmap">Open roadmap →</button>`)+`<div class="filterbar"><label class="label">Show:</label><select class="sel" data-change="tree-kind">${opts.map(o=>`<option value="${attr(o)}" ${state.treeKind===o?'selected':''}>${esc(o==='all'?'All system categories':o)}</option>`).join('')}</select></div><div class="grid3">${arr.map(p=>{let c=calcCounts(tasksOfPhase(p.idx));return `<button class="treeNode" style="width:auto;text-align:left" data-act="open-phase" data-id="${attr(p.idx)}"><div class="eyebrow">PHASE ${p.idx}</div><b style="margin:8px 0">${esc(p.title)}</b><small>Needs: ${esc(snip(p.depends,75))}</small><div style="margin-top:11px">${progressHTML(tasksOfPhase(p.idx))}</div><small>${c.done}/${c.total} approved · Click for tasks</small></button>`}).join('')}</div><div class="panel" style="margin-top:17px"><h2 class="cardTitle">How to use this system map</h2><p class="muted small">These are phase-level relationships stated in the blueprint. Task-level dependencies can be added individually as development progresses; the app does not invent dependencies absent from the source.</p></div>`}

function settingsPage(){return pageHeader('07 / Settings','Workspace settings','Backups, appearance and secure two-person collaboration.')+`<div class="grid2"><div class="stack"><div class="panel"><h2 class="cardTitle">Appearance</h2><div class="row wrap" style="margin-top:13px"><button class="btn ${state.theme==='dark'?'primary':''}" data-act="theme" data-value="dark">Dark theme</button><button class="btn ${state.theme==='light'?'primary':''}" data-act="theme" data-value="light">Light theme</button></div></div><div class="panel"><h2 class="cardTitle">Backup and restore</h2><p class="small muted">Save a JSON backup of task edits, notes, assignments and attachments. Local file blobs are included; shared cloud attachments are downloaded when exporting. Keep regular backups.</p><div class="row wrap"><button class="btn primary" data-act="export-backup">Export full backup</button><button class="btn" data-act="import-backup">Import backup</button></div><input id="backupPicker" type="file" accept=".json" hidden><p class="tiny muted">An import into a cloud team updates shared data, so make a backup first.</p></div><div class="panel"><h2 class="cardTitle">Plan source</h2><p class="small muted">20 original phases, 281 actionable tasks. New or edited content stays separate from the original blueprint; the original is never rewritten.</p><button class="btn" data-act="export-blueprint">Download original blueprint (.md)</button></div></div><div class="stack"><div class="panel"><h2 class="cardTitle">Collaboration</h2><p class="small muted">${state.mode==='cloud'?'Both computers are connected to the same authenticated team.':'To collaborate from separate computers, configure a free Supabase project using the included SQL instructions.'}</p>${state.mode==='local'?'<button class="btn primary" data-act="open-cloud">Connect shared workspace →</button>':`<div class="small" style="margin:14px 0">Signed in: ${esc(state.user?.email||'')}</div><div class="row wrap"><button class="btn" data-act="refresh-cloud">Refresh shared data</button><button class="btn" data-act="import-local-cloud">Import saved local work</button><button class="btn warn" data-act="cloud-signout">Sign out</button></div>`}</div><div class="panel"><h2 class="cardTitle">Data safety</h2><p class="small muted">In cloud mode, tasks are saved with revision checks to prevent silent overwrites. A server audit log records the authenticated editor. Approvals require the team owner. In local mode, data is saved to this browser's IndexedDB; a file opened on another PC will not see that data without cloud setup.</p></div></div></div>`}

function inputValue(id){return document.getElementById(id)?.value||''}
function recordHistory(obj,action){obj.history=[...(obj.history||[]),{at:now(),by:personId(),action}].slice(-100);obj.updatedAt=now();obj.updatedBy=personId();return obj}
async function updateTask(id,change,summary='updated task'){let rec=taskState(id);const updated=recordHistory({...rec,...change},summary);const saved=await saveRecord(taskIdKey(id),updated,summary);if(saved){render()}return saved}
async function modifyTask(id,fn,label){let obj=taskState(id);fn(obj);return updateTask(id,obj,label)}
function canApprove(){return isOwner()}
async function changeTaskStatus(id,newStatus){let old=taskState(id);if(newStatus===old.status)return;if(newStatus==='done'&&!canApprove()){toast('Only the team owner can approve work. Submit for review instead.',true);render();return}let data={status:newStatus};if(newStatus==='review'){data.completedBy=personId();data.approvedBy='';data.approvedAt=''}if(newStatus==='done'){data.approvedBy=personId();data.approvedAt=now();if(!old.completedBy)data.completedBy=personId()}if(old.status==='done'&&newStatus!=='done'){data.approvedBy='';data.approvedAt=''}await updateTask(id,data,`changed status to ${STATUSNAME[newStatus]}`)}
async function saveRecord(key,data,summary){if(state.saveBusy){toast('A previous save is still finishing; please try again.',true);return false}state.saveBusy=true;try{if(state.mode==='cloud'){if(!state.cloud||!state.team)throw Error('Cloud connection is unavailable');let expected=state.versions[key]||0;const {data:res,error}=await state.cloud.rpc('numen_save_record',{p_team_id:state.team.id,p_item_id:key,p_payload:data,p_expected_revision:expected,p_summary:summary});if(error)throw error;state.records[key]={data:res.data};state.versions[key]=res.version;state.events.unshift({actor_id:personId(),summary,item_id:key,created_at:now()});state.events=state.events.slice(0,80)}else{state.records[key]={data};state.versions[key]=(state.versions[key]||0)+1;state.events.unshift({by:personId(),summary,item_id:key,at:now()});state.events=state.events.slice(0,100);await persistLocal()}return true}catch(e){if(/NUMEN_CONFLICT/i.test(e.message||'')){await cloudRefresh();toast('This task changed on your teammate’s computer. Latest version reloaded; review before saving again.',true)}else showErr(e);return false}finally{state.saveBusy=false}}
async function persistLocal(){await idbPut('state','workspace',{records:state.records,versions:state.versions,events:state.events,members:state.members})}
function copyText(s){if(navigator.clipboard&&window.isSecureContext){return navigator.clipboard.writeText(s).then(()=>toast('Copied to clipboard')).catch(()=>fallbackCopy(s))}fallbackCopy(s)}
function fallbackCopy(s){let a=document.createElement('textarea');a.value=s;document.body.append(a);a.select();let ok=document.execCommand('copy');a.remove();toast(ok?'Copied':'Copy unavailable; use the displayed text',!ok)}
function copyPrompt(id){let t=getTask(id),p=allPhases().find(x=>x.idx===t.phase_id);let prompt=`NUMEN Roblox development task ${id}: ${t.title}\n\nSOURCE: Independent NUMEN game blueprint, not existing Soul Survival implementation.\nPHASE: ${p?.title||t.phase_title}\nRELEASE PRIORITY: ${t.priority}; ESTIMATE: ${t.effort}\nWHY: ${t.why}\n\nBUILD INSTRUCTIONS:\n${t.implementation_instructions}\n\nRECOMMENDED TOOLS:\n${t.suggested_tools}\n\nPHASE DEPENDENCIES:\n${p?.depends||'None listed'}\n\nACCEPTANCE TEST (must run in Roblox Studio):\n${t.acceptance_test}\n\nPHASE COMPLETION GATE:\n${p?.gate||'None listed'}\n\nIMPLEMENTATION RULES:\n1. Inspect existing files and report affected systems before coding.\n2. Keep the change small, reusable and server-authoritative where gameplay is affected.\n3. State files created/changed and tests, with actual results rather than claims.\n4. Do not mark the planner task approved. A human reviews Studio captures and approves.\n5. No paid assets/plugins without permission; prioritise free tools.\n\nTASK CHECKLIST:\n${taskState(id).checklist.map(x=>'- '+(x.done?'[x] ':'[ ] ')+x.text).join('\n')||'No subtasks added yet.'}`;copyText(prompt)}
async function removeMedia(id,mediaId){await modifyTask(id,s=>{s.media=s.media.filter(a=>a.id!==mediaId)},'removed an attachment')}
async function cloudImageUrl(a){if(a.path){let{data,error}=await state.cloud.storage.from('numen-assets').createSignedUrl(a.path,3600);if(error)throw error;return data.signedUrl}return null}
const assetCache={};async function getAssetUrl(a){if(assetCache[a.id]&&assetCache[a.id].expiresAt>Date.now())return assetCache[a.id].url;let url;if(a.localKey){const rec=await idbGet('files',a.localKey);if(!rec)throw Error('Local file not found on this device. Use a full JSON backup to restore it.');url=URL.createObjectURL(rec.blob)}else if(a.path&&state.mode==='cloud'){url=await cloudImageUrl(a)}else if(a.inlineData){url=a.inlineData}else throw Error('Attachment is unavailable.');assetCache[a.id]={url,expiresAt:Date.now()+(a.path?50*60*1000:365*24*60*60*1000)};return url}

async function idbGet(store,key){let db=await idb();return new Promise((resolve,reject)=>{let t=db.transaction(store,'readonly'),r=t.objectStore(store).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}

// Import ONLY browser-local work that does not already exist in the shared team.
// Never erase local IndexedDB records, silently overwrite shared work or discard attachments.
async function importLocalWorkToCloud(){
  if(state.mode!=='cloud'||!state.team||!state.user)throw Error('Sign in to your shared team first.');
  const saved=await idbGet('state','workspace');
  const entries=Object.entries(saved?.records||{});
  const missing=entries.filter(([key])=>!Object.prototype.hasOwnProperty.call(state.versions,key));
  const already=entries.length-missing.length;
  if(!entries.length){toast('No locally saved edits were found on this browser. The original 281 tasks are already included.');return}
  if(!missing.length){toast('All '+entries.length+' local records already exist in the shared team. Nothing was overwritten.');return}
  const msg='Import '+missing.length+' locally saved record(s) into '+state.team.name+'? '+already+' matching team record(s) will be SKIPPED to avoid overwrites. Local originals will remain on this computer.\n\nReview your local backup first if you have important existing work.';
  if(!confirm(msg))return;
  let done=0,failed=0;
  for(const [key,record] of missing){
    try{
      const data=structuredClone(record.data);
      if(!data||typeof data!=='object')throw Error('Invalid local record');
      for(const a of data.media||[]){
        if(!a.localKey)continue;
        const found=await idbGet('files',a.localKey);
        if(!found?.blob)throw Error('Missing local attachment '+a.name);
        const clean=String(a.name||'asset').replace(/[^a-zA-Z0-9_.-]/g,'_').slice(-80);
        const path=state.team.id+'/'+key.replace(/[^a-zA-Z0-9_.:-]/g,'_')+'/'+a.id+'_'+clean;
        const {error}=await state.cloud.storage.from('numen-assets').upload(path,found.blob,{upsert:false,contentType:a.mime||'application/octet-stream'});
        if(error&&error.statusCode!=='409')throw error;
        a.path=path;delete a.localKey;
      }
      const ok=await saveRecord(key,data,'imported saved local work');
      if(ok)done++;else failed++;
    }catch(err){failed++;console.error('NUMEN local import failed for',key,err);toast('Could not import '+key+': '+(err.message||err),true)}
  }
  await cloudRefresh();
  alert('Local import complete: '+done+' records added; '+already+' existing shared records skipped; '+failed+' failed. Local originals are still saved on this browser.');
}

async function uploadLibraryFiles(kind,id,files){for(const file of files){if(file.size>8*1024*1024){toast(`${file.name}: exceeds the 8 MB file limit`,true);continue}let a={id:uid(),name:file.name,size:file.size,mime:file.type||'application/octet-stream',group:'reference',by:personId(),at:now()};if(state.mode==='cloud'){let clean=file.name.replace(/[^a-zA-Z0-9_.-]/g,'_').slice(-80),path=`${state.team.id}/${kind}/${id}/${a.id}_${clean}`;let {error}=await state.cloud.storage.from('numen-assets').upload(path,file,{upsert:false,contentType:a.mime});if(error)throw error;a.path=path}else{a.localKey='asset:'+a.id;await idbPut('files',a.localKey,{blob:file})}let o=libraryItem(kind,id);o.media=[...(o.media||[]),a];await saveLibrary(kind,id,o,'attached '+file.name);toast('Attached '+file.name)}render()}
async function showLibraryAsset(kind,id,mediaId){let a=(libraryItem(kind,id).media||[]).find(x=>x.id===mediaId);if(!a)return;let u=await getAssetUrl(a);if((a.mime||'').startsWith('image/')){openModal('view-image',{url:u,name:a.name,id,mediaId,caption:'Image from '+kind});return}let x=document.createElement('a');x.href=u;x.rel='noopener';x.target='_blank';if(!a.path)x.download=a.name;x.click()}

function onboardingNext(){
  let all=allTasks(),me=personId(),mine=t=>taskState(t.id).assignees.includes(me),free=t=>!(taskState(t.id).assignees||[]).length;
  let ongoing=all.find(t=>taskState(t.id).status==='doing'&&mine(t));
  if(ongoing)return {t:ongoing,reason:'Your assigned job is already in progress'};
  let assigned=all.find(t=>taskState(t.id).status==='todo'&&mine(t));
  if(assigned)return {t:assigned,reason:'Earliest assigned unfinished job'};
  let next=all.find(t=>taskState(t.id).status==='todo'&&free(t));
  if(next)return {t:next,reason:'Earliest unassigned unfinished job in build order'};
  next=all.find(t=>taskState(t.id).status==='todo');
  if(next)return {t:next,reason:'Next unfinished job in build order; check assignment before starting'};
  return {t:all.find(t=>taskState(t.id).status==='review'),reason:'Waiting for team review'};
}
function newStarterSteps(t){let actions=[];let instructions=String(t.implementation_instructions||'');let candidates=instructions.split(/(?:\n|;|(?<=\.)\s+(?=[A-Z]))+/).map(x=>x.trim()).filter(x=>x.length>10);if(candidates.length)actions.push(...candidates.slice(0,4));else actions.push('Read the task instructions and identify the expected result.');return actions}
function outputFileGuess(t){let text=[t.implementation_instructions,t.acceptance_test].join(' ');let match=text.match(/(?:[\w.-]+\/)+[\w.-]+\.(?:lua|luau|md|json|png|rbxl|rbxm|blend|fbx|glb|ts|js|csv)/i);return match?.[0]||''}
function starterBanner(t){let s=taskState(t.id), file=outputFileGuess(t);return `<section class="mission" aria-label="Recommended next task"><div class="row between wrap"><div class="eyebrow">START HERE · RECOMMENDED NEXT JOB</div>${statusBadge(s.status)}</div><h2>${esc(t.id)} · ${esc(getTask(t.id)?.title||t.title)}</h2><p>${esc(t.why||'Build this foundation before moving on.')}</p><div class="mission-metadata"><span>① Read instructions</span><span>② Build in Roblox / Claude</span><span>③ Test result</span><span>④ Send for review</span></div>${file?`<p class="small"><strong>Expected file:</strong> <code>${esc(file)}</code></p>`:''}<div class="row wrap"><button class="btn primary" data-act="task" data-id="${attr(t.id)}">Open full job instructions →</button>${!s.workshop?`<button class="btn" data-act="pin" data-id="${attr(t.id)}">Add to Workshop</button>`:''}<button class="btn" data-act="nav" data-page="guide">How this workspace works</button></div></section>`}
function dashboardProgress(){let tasks=allTasks(),c=calcCounts(tasks),rev=tasks.filter(x=>taskState(x.id).status==='review').length,ongoing=tasks.filter(x=>taskState(x.id).status==='doing').length;
  return `<div class="statrow"><div class="stat"><span>Completion</span><b>${c.pct}%</b><span>${c.done}/${c.total} approved</span></div><div class="stat"><span>In progress</span><b>${ongoing}</b><span>Active tasks</span></div><div class="stat"><span>Needs review</span><b>${rev}</b><span>Waiting for human approval</span></div><div class="stat"><span>Phases</span><b>${allPhases().length}</b><span>Organised development stages</span></div></div><div class="panel" style="margin-top:15px"><h3 class="cardTitle">Development phase progress</h3>${allPhases().slice(0,20).map(p=>`<div style="margin-top:12px"><div class="row between"><span class="small">${esc(p.idx)} · ${esc(p.title)}</span><span class="tiny muted">${calcCounts(tasksOfPhase(p.idx)).done}/${tasksOfPhase(p.idx).length}</span></div>${progressHTML(tasksOfPhase(p.idx))}</div>`).join('')}</div>`
}

in-top:16px"><h2 class="cardTitle">Quick rules for working with AI</h2><p>ChatGPT can help plan, design, research and explain. Claude can implement code when it has the right files and Roblox tools. Neither an AI answer nor a screenshot proves gameplay works. Test in Studio, record the result, and have a person approve it.</p><div class="row wrap" style="margin-top:13px"><button class="btn primary" data-act="nav" data-page="roadmap">Open ordered roadmap →</button><button class="btn" data-act="nav" data-page="codex">Read complete blueprint</button></div></div>`}
