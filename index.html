/* NUMEN V2 readability and dedicated workspaces */
:root{--font:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
body{font-size:15px}
.content{max-width:1550px}
.pageLead{font-size:14px;max-width:920px;line-height:1.7}
.infoBox{font-size:14px;line-height:1.75}
.tasktitle{font-size:14px}
.taskdesc{font-size:12px}
.panel .cardTitle{font-size:16px}
.mission{border:1px solid var(--blue);border-radius:16px;padding:24px 26px;background:linear-gradient(140deg,var(--bluebg),var(--panel) 72%);margin:16px 0 22px}
.mission h2{font-size:clamp(20px,2.2vw,27px);line-height:1.2;margin:9px 0 12px;max-width:900px}
.mission p{max-width:950px;line-height:1.7;margin:8px 0 13px}
.mission-metadata{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0 18px}
.mission-metadata span{background:var(--panel);border:1px solid var(--border);padding:6px 10px;border-radius:8px;font-size:12px;color:var(--text)}
.dash-fast{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:13px 0 17px}
.dash-feature{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:7px;border:1px solid var(--border);background:var(--panel);border-radius:12px;padding:18px 20px;color:var(--text);min-height:132px}
.dash-feature:hover,.combat-entry:hover,.idea-card:hover,.template-idea:hover{border-color:var(--blue)}
.dash-feature strong{font-size:18px}.dash-feature small{color:var(--muted);font-size:13px}.dash-feature span{color:var(--blue);font-size:12px;font-weight:750;margin-top:auto}
.guide-note{background:var(--panel2);padding:15px 19px;border:1px solid var(--border);border-radius:10px;font-size:13px;color:var(--muted);line-height:1.65}
.dashboard-more{margin-top:15px}.dashboard-more>summary{cursor:pointer;color:var(--blue);font-weight:650;padding:12px 0}.dashboard-more>.eyebrow,.dashboard-more>.pageTitle,.dashboard-more>.pageLead{display:none}
.guide-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
.guide-grid .panel{min-height:180px}.guide-grid .panel .cardTitle{margin:8px 0}.guide-grid p{font-size:13px;line-height:1.7;color:var(--muted);margin:8px 0 0}
.job-head{border:1px solid var(--blue);background:var(--panel);border-radius:13px;padding:19px 23px;margin:0 0 18px}
.job-head-line{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin:13px 0 16px}
.job-head-line h2{font-size:19px;margin:0 0 5px}.job-head-line p{font-size:14px;line-height:1.7;margin:0;max-width:720px;color:var(--muted)}
.job-actions{white-space:nowrap}
.job-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:14px 0}
.job-kpis>div{padding:12px 13px;border-radius:9px;background:var(--panel2);border:1px solid var(--border)}
.job-kpis span{font-size:10px;font-weight:800;color:var(--muted);display:block;margin-bottom:6px;letter-spacing:.06em}
.job-kpis strong{font-size:12px;line-height:1.55;font-weight:600;display:block;overflow-wrap:anywhere}
.job-steps summary{cursor:pointer;font-size:14px;font-weight:750;padding:11px 0;color:var(--blue)}
.job-steps ol{padding-left:25px;margin:5px 0 3px;line-height:1.8;font-size:14px}
.job-steps li{padding:4px 0}
.combat-columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;gap:13px}
.combat-column{background:var(--panel);border:1px solid var(--border);padding:16px;border-radius:12px;min-height:300px}
.combat-column h3,.idea-col h3{margin:0;font-size:15px}
.combat-entry{width:100%;text-align:left;display:flex;flex-direction:column;gap:6px;border:1px solid var(--border);background:var(--panel2);padding:13px;margin:12px 0;border-radius:10px;color:var(--text)}
.combat-entry strong{font-size:14px}.combat-entry span{font-size:12px;color:var(--muted)}.combat-entry small{font-size:11px;color:var(--blue)}
.template-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:15px}
.template-idea{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--border);border-radius:9px;background:var(--panel2);color:var(--text);padding:13px}
.template-idea small{font-size:12px;color:var(--muted)}
.library-head{padding:25px 0 20px}.library-head h1{margin:10px 0}.library-head p{font-size:15px;color:var(--muted);max-width:900px;line-height:1.65}
.related-link{display:block;background:var(--panel2);border:1px solid var(--border);width:100%;padding:11px;margin:9px 0;text-align:left;border-radius:8px;color:var(--text)}
.related-link:hover{border-color:var(--blue)}.related-link small{color:var(--muted)}
.resource-row{border-bottom:1px solid var(--border);padding:8px 0;overflow-wrap:anywhere}
.lib-media-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:13px}
.idea-columns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.idea-col{border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:14px;min-height:230px}
.idea-card{padding:13px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);margin:13px 0}
.idea-title{font-weight:750;font-size:14px;background:none;border:0;text-align:left;padding:5px 0;color:var(--text);width:100%}.idea-title:hover{color:var(--blue)}
.idea-card p{margin:6px 0 14px;font-size:12px;color:var(--muted);line-height:1.55}
.pick-list{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:10px 13px;display:flex;flex-direction:column;gap:9px;margin-bottom:10px;max-height:190px;overflow:auto}
.pick-list label{font-size:13px;display:block!important}.pick-list input{margin-right:8px}
.modal .label{margin-top:13px}
@media(max-width:1190px){.combat-columns{grid-template-columns:repeat(2,minmax(0,1fr))}.idea-columns{grid-template-columns:repeat(2,minmax(0,1fr))}.guide-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.dash-fast,.combat-columns,.idea-columns,.guide-grid,.template-grid,.job-kpis{grid-template-columns:1fr}.job-head-line{flex-direction:column}.mission{padding:17px}.job-head{padding:16px}.content{padding:19px 14px 65px}}

.btn.mobiletoggle{display:none}
@media(max-width:850px){.btn.mobiletoggle{display:inline-flex}}

</style>

e live operations","title":"Define release KPIs and context","priority":"BETA","effort":"M","status":"Proposed / not started","why":"Judge success fairly","implementation_instructions":"Watch tutorial completion, D1/D7 return, crashes, FPS, combat satisfaction and session time; compare to suitable genre benchmarks","acceptance_test":"Do not launch because of one viral video","suggested_tools":"Analytics","phase_dependencies":"G3 closed alpha for beta; G4 for public launch","phase_exit_gate":"Public build has correct descriptions, measurable funnel, rollback and content cadence."},{"id":"19.05","phase_id":"19","phase_title":"Publishing, discovery, telemetry and sustainable live operations","title":"Create update release train","priority":"BETA","effort":"M","status":"Proposed / not started","why":"Solo dev cannot patch constantly","implementation_instructions":"Small two-week stability/polish cycle, larger content every 6–10 weeks as capacity allows; no promises to public before stable","acceptance_test":"Patch notes tied to known builds","suggested_tools":"GitHub/Markdown","phase_dependencies":"G3 closed alpha for beta; G4 for public launch","phase_exit_gate":"Public build has correct descriptions, measurable funnel, rollback and content cadence."},{"id":"19.06","phase_id":"19","phase_title":"Publishing, discovery, telemetry and sustainable live operations","title":"Build feedback triage","priority":"BETA","effort":"S","status":"Proposed / not started","why":"Avoid direction from loudest comments","implementation_instructions":"Tag bug, exploit, balance, onboarding, content request; severity and reproduction before work","acceptance_test":"Weekly review creates at most 3 actionable priorities","suggested_tools":"GitHub Issues","phase_dependencies":"G3 closed alpha for beta; G4 for public launch","phase_exit_gate":"Public build has correct descriptions, measurable funnel, rollback and content cadence."},{"id":"19.07","phase_id":"19","phase_title":"Publishing, discovery, telemetry and sustainable live operations","title":"Plan community moderation","priority":"BETA","effort":"M","status":"Proposed / not started","why":"Safe conversation","implementation_instructions":"Use Roblox-native community tools, clear reports/mutes and avoid exposing underage users' personal data","acceptance_test":"No private user identifiers in shared bug videos","suggested_tools":"Roblox","phase_dependencies":"G3 closed alpha for beta; G4 for public launch","phase_exit_gate":"Public build has correct descriptions, measurable funnel, rollback and content cadence."},{"id":"19.08","phase_id":"19","phase_title":"Publishing, discovery, telemetry and sustainable live operations","title":"Prepare rollback/hotfix plan","priority":"BETA","effort":"M","status":"Proposed / not started","why":"Avoid live data disasters","implementation_instructions":"Staging, release candidate, smoke test, deploy, monitor 60 min, kill switch/rollback method","acceptance_test":"Can disable broken portal without full reset","suggested_tools":"Claude + Git","phase_dependencies":"G3 closed alpha for beta; G4 for public launch","phase_exit_gate":"Public build has correct descriptions, measurable funnel, rollback and content cadence."},{"id":"19.09","phase_id":"19","phase_title":"Publishing, discovery, telemetry and sustainable live operations","title":"Create long-term content matrix","priority":"LATER","effort":"M","status":"Proposed / not started","why":"Expansions should be efficient","implementation_instructions":"Rotate faction stories, bosses, kit variants, PvP maps and cosmetic progression; add mechanics only where needed","acceptance_test":"Next three content releases have dependencies & estimates","suggested_tools":"ChatGPT","phase_dependencies":"G3 closed alpha for beta; G4 for public launch","phase_exit_gate":"Public build has correct descriptions, measurable funnel, rollback and content cadence."},{"id":"19.10","phase_id":"19","phase_title":"Publishing, discovery, telemetry and sustainable live operations","title":"Conduct post-launch review","priority":"LATER","effort":"M","status":"Proposed / not started","why":"Know what users actually value","implementation_instructions":"At 7/30 days review cohorts, most-used abilities, deaths, returns, device performance and monetisation fairness","acceptance_test":"Written stop/start/continue decisions before large new features","suggested_tools":"Analytics + ChatGPT","phase_dependencies":"G3 closed alpha for beta; G4 for public launch","phase_exit_gate":"Public build has correct descriptions, measurable funnel, rollback and content cadence."}]}</script>
<script type="application/json" id="codexData">{"sections":[{"title":"Introduction & reading guide","content":"# NUMEN — COMPLETE INDEPENDENT BLEACH-INSPIRED ROBLOX RPG BLUEPRINT\n\n**Edition:** 1.0 · **Research date:** 12 October 2026 · **Intended creator:** one 17-year-old developer using Roblox Studio, ChatGPT, Claude and free software. **Planning status:** entirely new proposed design; **nothing here is already built or owner-approved**.\n\n> **Read this first:** This document is a full *proposed game baseline*, not a record of the separate existing Soul Survival / NUMEN project. It deliberately does **not** import current Cero specifications, Hollow designs, world decisions, academy timing, implementation statuses or progress from that project. Keep the existing Claude plan backed up and untouched until you explicitly decide to merge. All level numbers, damages, quest names, timings, content quantities and rankings in this blueprint are **original design suggestions for playtesting**, not confirmed Bleach canon or mechanics from competitor games.\n\n"},{"title":"The quick answer","content":"## The quick answer\n\n**Blueprint contents:** 20 development phases · **281 actionable task entries** (CORE 103, ALPHA 78, BETA 71, LATER 29) · four complete proposed race journeys · sources, free software, architecture, implementation recipes and quality gates.\n\n**Suggested execution order:** 00 → 01 → 02 → 03 → 04 → **12.01–12.06 core ability infrastructure** → 05 → 06 → **13.01–13.04 early world greybox and region rules** → 07 → 08 (Soul Reaper slice) → **13.06 Hollow starting region** → 09 (Hollow alpha) → 14 (one boss) → 16 (core UI/feedback) → 17 (QA); then 10 (Quincy), 15 (PvP/social), 18, 19; and 11 last if justified. Work on the CORE asset, UI and QA tasks across phases as soon as their foundational dependencies are ready.\n\nA professional, complete plan must specify *what to build*, *why it matters*, *how to implement it*, *when to work on it*, *what files/assets to produce*, and *how you know it is working*. This blueprint supplies a research-led game vision, accessible development workflow, playable progression from beginner to endgame for every main archetype, an ordered task backlog, reusable system specifications, clear release gates and a free-tool stack. Build a small, amazing vertical slice first; the full vision is a destination, not a day-one promise.\n\n**Default release strategy:** single foundational combat game → Soul Reaper vertical slice → Hollow playable route → Quincy route → deep factions/raids/ranked → optional Fullbringer expansion. This does **not** mean late-path systems are ignored; their data contracts and long-term requirements are designed from the outset. Finish an engine and a repeatable loop before making hero VFX, giant maps, 100 skills or an in-depth academy.\n\n### How to read every task\n\n- **P0 / CORE:** necessary for a reliable and enjoyable first prototype; **P1 / ALPHA:** required for a private playable alpha; **P2 / BETA:** intended for a public beta; **P3 / LATER:** expansion or polish after evidence supports it.\n- **XS** ≈ 1–3 hours; **S** ≈ 3–8 hours; **M** ≈ 1–3 workdays; **L** ≈ 4–10 workdays *for a beginner working with AI*, including checks. Estimates are rough, not quotations or deadlines. Split L tasks before Claude writes code.\n- Every task has a build recipe, suggested tools, dependencies implied by its phase and a **testable done condition**. **Never mark done merely because AI says the code is finished**. Owner verifies in Studio Play and, for multiplayer, in Server & Clients tests.\n\n### The experience in one sentence\n\nA character-driven spiritual action RPG where the player begins powerless, learns to survive supernatural threats, develops a distinct combat style, joins or resists a faction, earns dramatic transformations, and finds reasons to return for exploration, bosses, rivals and mastery.\n\n"},{"title":"1. Competitor research — what has proven useful, and what has not","content":"## 1. Competitor research — what has proven useful, and what has not\n\nThese are **observations from the linked official Roblox descriptions**, plus rounded audience snapshots from Rolimon's; conclusions in the last column are **our inference**, not developers' admissions. Player counts fluctuate dramatically: a huge all-time peak is not long-term retention. A successful game with a huge team is not a sensible measure of what one beginner can make in one month.\n\n| Title | Grounded public evidence | What we borrow as a design principle | What not to copy |\n|---|---|---|---|\n| **Peroxide** | Its Roblox description emphasises fighting monsters, *hard trials* and earning abilities; launched years ago and continues to attract thousands of concurrent players in recent snapshots. | Abilities feel special because they require memorable, playable tests; PvE and PvP feed progression. | Unclear quests, long compulsory waiting and ability acquisition through frustrating luck. |\n| **TYPE://SOUL** | Multiple named realms, transformation controls, weapons, factions and ranked-related places; very large historical visits and peak. | Distinct faction identities, skill-based combat, competitive replay and strong social goals. | Throwing complex controls, obscure rank rules and punishing PvP at new players immediately. |\n| **VV: ULTIMATUM** | Official description advertises **130+ skills**, player-tailored builds, factions and dangerous worlds; many credited specialists. | Variety through modular builds and strong presentation; combat roles within factions. | Trying to ship 130 unique finished skills as a solo creator. |\n| **Reaper 2** | Official description explicitly names **quests, levelling, skill points and a skill tree**, with controls for every platform. | Clear, visible progression and predictable rewards. | Endless identical fetch/kill chores with no change in encounter. |\n| **Project Mugetsu** | Official listing documents Zanpakutō/meditation progression, race features and configurable bindings. | Strong, recognisable transformation fantasies and multiple race routes. | Selling access to understanding your own progression or making UI clarity a paid feature. |\n\n**Why this is a longevity-oriented selection:** these titles have multi-year histories (except the newer large-scale VV peak), recognisable communities, repeat gameplay systems or both. It is not a claim that all are currently equally healthy. Snapshot source links and dates appear in **Sources** at the end.\n\n**Proposed NUMEN edge:** more comprehensible onboarding, mechanical depth without inflated ability count, equally viable PvE progression and PvP mastery, dramatic yet fair transformations, reliable data, genuinely playable mobile controls, and striking but game-optimised visual design.\n\n**Team-size warning:** TYPE://SOUL and VV: ULTIMATUM publicly credit many developers. For a single creator, reuse one enemy rig for many attacks, one skill framework for every power, one quest framework for all factions, one combat system for both players and NPCs, and one small vertical slice before production scale.\n\n"},{"title":"2. The design constitution (decide these before writing combat code)","content":"## 2. The design constitution (decide these before writing combat code)\n\n| Topic | Proposed baseline | Reason / test |\n|---|---|---|\n| Audience | Primarily teens who enjoy action anime, Roblox fighting and co-op RPG progression | First objective readable in under 30 seconds; fun interaction within 5 minutes. |\n| Genre | Third-person action RPG with optional competitive PvP | PvE must be a complete progression path; no mandatory griefing. |\n| Starting point | Brief ordinary-human awakening in an original city; choose a spiritual trajectory by actions, not a full menu of overwhelming options | Easy to understand, distinct from spawning as a fully empowered warrior. |\n| Main routes | Soul Reaper, Hollow/Arrancar and Quincy; optional Fullbringer after launch | 3 deep routes outperform 8 unfinished ones. |\n| Camera/rig | Roblox R15 humanoid base and third-person camera; adjustable lock-on | Most reusable animation and accessories pipeline. |\n| Combat | Fast but readable, deliberate telegraphs, parry/guard/dodge/counter | Tested in 150 ms simulated latency, not just localhost. |\n| Skill identity | 2–3 talent branches per faction; abilities share a system but feel different | More meaningful builds with fewer bespoke scripts. |\n| Power acquisition | Earned trials, visible requirements, optional cosmetic rarity | Avoid power-for-Robux and paid random acquisition. |\n| Multiplayer | Small, measurable servers first; increase based on test results | PvP/AI/network/visual cost scales sharply with players. |\n| Art | Clear stylised Roblox geometry, bold silhouettes, controlled lighting, high-quality animation and effects | Readability and stable mobile FPS beat photorealism. |\n| Story | Short directed early arc, optional lore, then faction stories | Newcomers need action rather than lectures. |\n| Economy | One soft currency, progression points and a few gated crafting materials | Simpler to balance and secure. |\n| World | One city hub + adjacent wilderness and training arena in alpha; realms expand in beta | Players can meet; each new region must have a gameplay reason. |\n| Business model | Free competitive gameplay; modest cosmetic and convenience purchases later | Fairness, trust, policy compliance. |\n| Intellectual property | Prototype with descriptive Bleach terms for study, but obtain relevant licence or replace protected character/setting/visual expression before public commercial release | An unofficial fan work is not automatically authorised. |\n\n### Honest scope\n\nA *full* high-level blueprint is possible. A completely specified 300-hour implementation of every future boss, animation, map tile and spell is not; those details are created in dedicated per-feature briefs and tested as production reaches them. The backlog makes sure nothing foundational is forgotten and says when those specific assets should be designed. Do not confuse this with an immediately shippable MMO. All numbers are starting values.\n\n"},{"title":"3. Release ladder: build increasingly complete experiences","content":"## 3. Release ladder: build increasingly complete experiences\n\n| Gate | What a tester can actually do | Deliberate omissions |\n|---|---|---|\n| **G0 — Technical prototype** | Join, spawn, move, attack and block, fight a dummy, see health/stamina, leave and rejoin without breaking data | No real city, classes, transformations or beautiful spells |\n| **G1 — Combat vertical slice** | Sword + movement + dodge + guard/parry + 1 special vs 2 enemy types; 2–4 players duel without exploit-fuelled damage | No endgame, no huge VFX library |\n| **G2 — 30–60 minute RPG slice** | Intro, quest, XP, equipment, skill tree, training trial, mini-boss, earned first release and safe save | One route only, temporary small city |\n| **G3 — Closed alpha** | Soul Reaper route to an early climax, Hollow beginner→mid route, open-world co-op, one small raid, stable UI on PC/mobile | Quincy full route, highest forms, ranked prizes |\n| **G4 — Public beta** | All three major routes, meaningful transformations, 3 connected worlds, economy, first ranked system, replay and social features | Dozens of full custom classes |\n| **G5 — Long-term full vision** | Captain-class/endgame forms, Vasto Lorde & Arrancar depth, elite Quincy, optional Fullbringer, ranked seasons, story expansions, repeatable raids | Add only when live player behaviour warrants it |\n\n**No schedule promise:** at 8–12 focused hours/week, G0/G1 may take multiple months for someone learning Studio; G4 may take far longer than a year. AI accelerates code and asset production, not acceptance testing, animations or content polish. If G1 combat does not feel good, stop making maps and fix it.\n\n"},{"title":"4. Free software and the recommended solo developer workflow","content":"## 4. Free software and the recommended solo developer workflow\n\nAll core tools below have **£0 purchase cost** in their standard editions. No required tool, asset, plugin or service is priced above your **£5 per individual item** ceiling. Check creator-store prices at the time of installing any optional paid plugin. Don't spend money to solve a problem built-in Studio can solve.\n\n| Tool | Price | Job | When |\n|---|---|---|---|\n| [Roblox Studio](https://create.roblox.com/docs/studio/setup) | **Free** | Main engine, terrain, animation editor, UI, playtesting, publishing | Day one |\n| [Roblox Studio's official MCP server](https://create.roblox.com/docs/ai/accelerated-workflows) | **Free native capability** | Let an MCP-compatible coding assistant inspect, edit and test Studio objects | Once workflow is stable; verify your Claude configuration |\n| [VS Code](https://code.visualstudio.com/) | Free | Read/edit Luau; clear diffs and source control | Day one |\n| [Git](https://git-scm.com/) and [GitHub](https://github.com/) private repository | Free tier | Backups, commits, rollbacks; Claude-created code review | Day one |\n| [Rojo](https://github.com/rojo-rbx/rojo) | Free, open source | Sync filesystem Luau with Studio; work with AI on actual files | After a basic Studio test project |\n| [Rokit](https://github.com/rojo-rbx/rokit) | Free | Keep tool versions repeatable | With Rojo |\n| [StyLua](https://github.com/JohnnyMorganz/StyLua) | Free | Auto-format Luau code | First script |\n| [Selene](https://github.com/Kampfkarren/selene) | Free | Catch likely Lua/Luau code mistakes; configure Roblox standard | First systems |\n| [Wally](https://github.com/UpliftGames/wally) | Free | Add approved, version-pinned open-source packages | Only when a proven package helps |\n| [Blender](https://www.blender.org/) | Free, open source | Weapons, masks, simple modular buildings, rigs, meshes | First bespoke asset |\n| [Krita](https://krita.org/) or [GIMP](https://www.gimp.org/) | Free | UI artwork, concepts, texture editing | After prototype UI |\n| [Inkscape](https://inkscape.org/) | Free | Vector icons, minimal logo and UI symbols | Branding/UI |\n| [Audacity](https://www.audacityteam.org/) | Free | Layer, trim, pitch and mix licensed sound effects | Combat feel |\n| [OBS Studio](https://obsproject.com/) | Free | Record combat and compare revisions | G0 onward |\n| Roblox Creator Store | Many free assets | Prototypes, SFX, basic animations, Studio plugins | Only from trustworthy creators; inspect scripts |\n| [TestEZ](https://github.com/Roblox/testez) or basic Luau assertion harness | Free | Unit-style testing for core modules | Once modules exist |\n| ChatGPT | Existing access; costs depend on plan | Systems research, design briefs, screenshots/concepts, review of Claude outputs | Every feature |\n| Claude / Claude Code | Existing access; limits depend on plan | Build scoped modules, generate tests and run Studio tooling where connected | Every feature |\n\n**No paid plugin is essential.** A paid high-quality animation, rigging or environment plugin above £5 can be documented as an *optional recommendation* later with current pricing and a demonstrated need; it must never be a blocker. Professional custom models, paid music libraries, subscription terrain generators and sponsored advertising are optional long-term considerations, not baseline purchases.\n\n**Recommended workflow (repeat for each feature):** (1) choose one backlog item; (2) write the acceptance test; (3) ChatGPT prepares a precise brief; (4) Claude writes a small change and tests; (5) review Git diff, run formatter/linter; (6) open Studio and actually play; (7) capture a 20–30 second video and record bugs; (8) fix; (9) commit; (10) only then check off task. Do **not** ask an AI to 'build the whole combat system' in one pass.\n\n**Studio MCP reality check:** Roblox documentation confirms the native MCP-server option; using it from Claude depends on your Claude client and local tool setup. If it isn't connected, fall back to Luau files via Rojo; don't pretend a remote chat can see or operate Studio automatically.\n\n"},{"title":"5. Implementation architecture — what Claude should create, not a monolithic script","content":"## 5. Implementation architecture — what Claude should create, not a monolithic script\n\n**Suggested project layout** (names are proposals; use consistency over a perfect convention):\n\n```text\nNUMEN/\n  README.md                   # what to install, run, test\n  docs/\n    GDD.md                    # design decisions and definitions\n    DECISIONS.md              # approved, proposed, superseded\n    ROADMAP.md                # ordered tasks & milestones\n    systems/                 # one contract per service\n    progression/             # Shinigami, Hollow, Quincy route graphs\n    acceptance/              # reproducible test cases\n    assets/                  # provenance, licences, references\n  src/\n    shared/\n      Config/                # numbers and feature flags\n      Types/                 # profile, ability, quest structures\n      Abilities/             # data-driven ability definitions\n      Combat/                # pure calculations, status rules\n      Quests/                # quests and objectives as data\n      Net/                   # remote names and schemas\n    server/\n      Boot.server.luau\n      Services/              # Profile, Combat, Damage, Quest, AI, World, Inventory\n      Controllers/           # server player/character/faction controllers\n    client/\n      Boot.client.luau\n      Controllers/           # input, camera, prediction, animations, UI, VFX, audio\n  assets/\n    models/ animations/ images/ audio/\n  tests/\n    unit/ integration/ scenarios/\n  default.project.json\n  rokit.toml\n  stylua.toml\n  selene.toml\n```\n\n**Separation of responsibility:** Server decides damage, rewards, eligibility, cooldowns, purchases, saving and teleport destinations. Client predicts immediate button feedback, plays visual/audio effects, draws UI and may request actions. The server **validates every request** and broadcasts a small confirmed event to relevant clients. Shared modules hold configuration, enums, formulas and replicated read-only definitions. Cross-server temporary matchmaking uses MemoryStore; persistent player progress uses DataStore; travelling between Roblox places uses TeleportService after safe save/locking.\n\n### Core character data model (proposal)\n\n```lua\nProfile = {\n    version = 1,\n    slots = {\n        [1] = {\n            slotId = 'slot_1', faction = 'Unawakened', level = 1, xp = 0,\n            story = {chapter = 'intro', flags = {}},\n            stats = {strength = 1, spirit = 1, defence = 1, agility = 1},\n            resources = {energyMax = 100, healthMax = 100, staminaMax = 100},\n            abilities = {}, talents = {}, equipment = {}, cosmetics = {},\n            inventory = {}, currency = 0, unlocks = {},\n            questState = {}, checkpoints = {}, progression = {},\n        }\n    },\n    settings = {graphics = 'Auto', cameraShake = true, keybinds = {}},\n    receipts = {}, -- if ever monetising, idempotent purchase handling\n}\n```\n\nStore compact primitive data only, **not** Roblox Instances, live character models or entire quest definitions. Derive current health/skill values at runtime from templates. Never trust the client to send XP, currency or 'I killed the boss' events. Do not place secrets or sensitive server algorithms in ReplicatedStorage.\n\n### Example shared ability definition\n\n```lua\nreturn {\n    id = 'reaper_cut_01', displayName = 'Arc Cut',\n    faction = 'SoulReaper', minimumLevel = 5,\n    cooldown = 7.0, spiritCost = 14,\n    castTime = 0.25, recovery = 0.35,\n    range = 15, hitShape = 'Cone', coneDegrees = 75,\n    baseDamage = 20, coefficient = 0.7,\n    tags = {'Melee', 'Sword', 'Interruptible'},\n    animationId = 'ANIMATION_ID', soundKey = 'arc_cut', vfxKey = 'arc_white',\n    interruptPolicy = 'Stagger', pvpMultiplier = 0.85,\n}\n```\n\nOne AbilityService checks unlock, current state, geometry, resource, cooldown, teams, line of sight and hit targets; the animation/effect system reads its metadata. Twenty abilities should not require twenty independent server combat scripts.\n\n### Baseline combat numbers (design starting points, not canon)\n\n| Mechanic | Prototype target | Why / tune after video |\n|---|---|---|\n| Health | 100 at starter, later scaled by power bracket | Easy to read; prevent one-shot meta |\n| Stamina | 100 base | Dodge, sprint, heavy guard use the same budget |\n| Spirit energy | 100 starter | Spells and transformations use explicit costs |\n| Light combo | 4 attacks, 0.25–0.36 s between contacts | Learnable rhythm with counter windows |\n| Heavy attack | ~0.55 s wind-up, 0.35 s recovery | Commit/reward decision |\n| Dodge | 8–12 studs, 2 charges, 0.8 s recharge trial | Positioning, not unlimited invulnerability |\n| Perfect guard | 0.12–0.18 s timing window (tune to latency) | Skill expression, not pure luck |\n| Basic damage | ~7–13 per light hit vs 100-health equal | Typical full combo should not insta-kill |\n| PvP max burst | Test \u003c45% target health from one confirm without counterplay | Protect readability and fun |\n| PvE enemy fight | Standard 20–45 sec; elite 60–120 sec; boss 3–5 min | Meaningful but avoids repetitive sponges |\n| First special | Earn within 10–20 min of play | Clear early reward |\n| First major transformation | First complete chapter, often ~45–90 min | Must feel earned but visible on the horizon |\n\nDon't copy these values into every script. One typed Config module and server-authoritative balancing table should control them, with separate PvP/PvE tuning.\n\n"},{"title":"6. Master backlog — introduction","content":"## 6. MASTER PRODUCTION BACKLOG — ordered, buildable tasks\n\n**Ordering rule:** work through the CORE tasks in numerical order first, with Phase 12's ability framework started as soon as Phase 04 combat exists. Some phases are parallel specialties rather than a single rigid waterfall. ALPHA/BETA/LATER work stays in the plan until its prerequisite gate is ready. AI build sessions should generally contain **one XS/S task or a small, explicitly bounded portion of an M/L task**.\n\nEvery `[ ]` is a planned action, not a completed item. Each description is a *design brief seed*. Turn it into a shorter implementation contract before calling Claude.\n\n"},{"title":"00 — Vision, scope and playable contract (12 deliverables)","content":"### 00 — Vision, scope and playable contract (12 deliverables)\n\n**Goal:** Turn the idea into a constrained product with measurable gates.  \n**Prerequisites:** None  \n**Exit gate:** A new developer can state the first 30-minute loop, the core controls and what is explicitly not in alpha.\n\n- [ ] **00.01 — Write a one-page game pitch** `[CORE]` `[S]`\n  - **Why:** Avoid endless scope changes\n  - **Build:** Describe audience, three design pillars, the actual first 30 minutes, differences from competitors and 3 non-goals in docs/GDD.md\n  - **Proof:** Someone unfamiliar can explain what they do after spawning\n  - **Tool:** ChatGPT + Markdown\n- [ ] **00.02 — Define playable versus future races** `[CORE]` `[S]`\n  - **Why:** Prevent 3 unfinished beginnings\n  - **Build:** Document Reaper first, Hollow for alpha, Quincy beta, optional Fullbringer later; justify each gate\n  - **Proof:** Each feature has one release tier\n  - **Tool:** ChatGPT\n- [ ] **00.03 — Write the first-time user journey** `[CORE]` `[M]`\n  - **Why:** Fast onboarding supports retention\n  - **Build:** Draw from Start to First Fight to First Reward to First Choice to First Trial; use 5-minute increments\n  - **Proof:** A tester knows where to go with no spoken explanation\n  - **Tool:** ChatGPT + diagram\n- [ ] **00.04 — Choose the camera and rig contract** `[CORE]` `[S]`\n  - **Why:** Animations and weapons depend on it\n  - **Build:** Lock R15 scale conventions, avatar limits, lock-on assumptions and collision scale in one spec\n  - **Proof:** Two test avatars animate with same base actions\n  - **Tool:** Studio\n- [ ] **00.05 — Specify input action names** `[CORE]` `[S]`\n  - **Why:** Controls change as abilities expand\n  - **Build:** Write actions not hard-coded keys: Attack, Heavy, Guard, Dodge, Target, Interact, Skill1–4, Transform, Menu; reserve mobile/controller maps\n  - **Proof:** No action conflicts across devices in input chart\n  - **Tool:** ChatGPT + Studio\n- [ ] **00.06 — Define combat fairness principles** `[CORE]` `[S]`\n  - **Why:** Prevents frustrating launches\n  - **Build:** Agree PvP counterplay, spawn safety, invulnerability policies, stagger diminishing returns, no unavoidable full-health one-shots\n  - **Proof:** Every proposed skill is tagged with its counter window\n  - **Tool:** ChatGPT\n- [ ] **00.07 — Choose the first major reward** `[CORE]` `[S]`\n  - **Why:** Design goal before building skills\n  - **Build:** Pick a small earned release in the first chapter and sketch reveal, duel or training trial\n  - **Proof:** Reward has requirements, test and visual identity\n  - **Tool:** ChatGPT\n- [ ] **00.08 — Write art/animation style guide** `[ALPHA]` `[M]`\n  - **Why:** Avoid incompatible asset styles\n  - **Build:** Define mesh poly ranges by class, R15 proportions, shader/material range, UI legibility, colour palette, effect brightness\n  - **Proof:** Three sample assets look from the same game\n  - **Tool:** Studio + Blender + ChatGPT\n- [ ] **00.09 — Create lore/IP decision ledger** `[CORE]` `[S]`\n  - **Why:** Prevent accidental copied protected assets\n  - **Build:** Record names and designs used only as Bleach-inspired study references; plan original or licensed public artwork, audio and maps\n  - **Proof:** No unlicensed rip appears in shipping asset index\n  - **Tool:** Markdown\n- [ ] **00.10 — Define analytics events** `[ALPHA]` `[S]`\n  - **Why:** Instrument only what helps\n  - **Build:** List spawn, first hit, first death, quest accepted/completed, first skill, first form, session end, error; specify non-sensitive fields\n  - **Proof:** Every milestone can be counted in a local test log\n  - **Tool:** ChatGPT + Claude\n- [ ] **00.11 — Create release gate checklist** `[CORE]` `[S]`\n  - **Why:** Stop feature creep\n  - **Build:** Write G0–G5 pass/fail checks, priority policy and who signs off (you); record deferred features\n  - **Proof:** A feature cannot skip an unpassed dependency gate\n  - **Tool:** Markdown\n- [ ] **00.12 — Set scope freeze for vertical slice** `[CORE]` `[XS]`\n  - **Why:** Protect development momentum\n  - **Build:** Create a NOT NOW list: huge world, 50 skills, paid shop, clan wars, extensive academy, competitive ranking\n  - **Proof:** Each new idea can be parked without interrupting current sprint\n  - **Tool:** GitHub Issues/Markdown\n\n"},{"title":"01 — Setup, source control and AI production pipeline (13 deliverables)","content":"### 01 — Setup, source control and AI production pipeline (13 deliverables)\n\n**Goal:** Create a workflow where AI changes can be inspected, reverted and tested.  \n**Prerequisites:** Phase 00 scope decisions  \n**Exit gate:** New blank private experience loads from versioned source; every change can be rolled back.\n\n- [ ] **01.01 — Install Studio and create private test experience** `[CORE]` `[S]`\n  - **Why:** Learn engine basics without danger to production\n  - **Build:** Open Explorer, Properties, Output, Script Analysis, Terrain and Test; publish a separate private test copy\n  - **Proof:** You can place a Part and run a LocalScript and a Script\n  - **Tool:** Studio free\n- [ ] **01.02 — Create private Git repository** `[CORE]` `[S]`\n  - **Why:** Protect the only source of truth\n  - **Build:** Add README, .gitignore, docs and src; commit baseline; keep secrets outside repo\n  - **Proof:** Restore earlier working revision on another folder\n  - **Tool:** Git + GitHub free\n- [ ] **01.03 — Install Rojo and sync script tree** `[CORE]` `[M]`\n  - **Why:** AI edits are easier in files than enormous pasted scripts\n  - **Build:** Create default.project.json mapping src shared/client/server to Roblox services, connect Studio plugin and run development sync\n  - **Proof:** Editing a test module in VS Code changes it in Studio\n  - **Tool:** Rojo + VS Code\n- [ ] **01.04 — Pin tools with Rokit** `[ALPHA]` `[S]`\n  - **Why:** Avoid random version breakages\n  - **Build:** Create rokit.toml for Rojo and formatting/testing binaries; document installation steps\n  - **Proof:** Another user can set up using README\n  - **Tool:** Rokit\n- [ ] **01.05 — Configure format and lint** `[CORE]` `[S]`\n  - **Why:** Prevent subtle inconsistencies\n  - **Build:** Add StyLua config and Selene Roblox standard; run on src; fix warnings before merge\n  - **Proof:** A deliberately malformed script fails lint\n  - **Tool:** StyLua + Selene\n- [ ] **01.06 — Set folder naming conventions** `[CORE]` `[XS]`\n  - **Why:** AI agents need predictable locations\n  - **Build:** Document PascalCase services, camelCase locals, filenames, directories, dependency rules, one feature per module\n  - **Proof:** New AI-built feature follows the conventions\n  - **Tool:** ChatGPT + Claude\n- [ ] **01.07 — Create isolated test place** `[CORE]` `[S]`\n  - **Why:** Experiments cannot damage real player data\n  - **Build:** Keep test and eventual production universe distinct; disable production DataStore access from Studio\n  - **Proof:** Resetting the test does not touch future live profiles\n  - **Tool:** Studio\n- [ ] **01.08 — Create feature flags** `[CORE]` `[S]`\n  - **Why:** Unfinished systems must not leak\n  - **Build:** Config.FeatureFlags.enableX; disable WIP transformations or portals by default\n  - **Proof:** Toggle feature without deleting code; disabled feature grants no rewards\n  - **Tool:** Claude + Luau\n- [ ] **01.09 — Create automated smoke checks** `[ALPHA]` `[M]`\n  - **Why:** Catch regressions every session\n  - **Build:** Start with assertions for profile defaults, config values, ability registration and quest graph validity\n  - **Proof:** Test script reports pass/fail with real error messages\n  - **Tool:** Claude + TestEZ/Studio\n- [ ] **01.10 — Create bug and decision templates** `[CORE]` `[S]`\n  - **Why:** Reduce AI hallucinations and forgotten fixes\n  - **Build:** One markdown ticket with reproduction, expected/actual, version, screenshot, severity and ownership\n  - **Proof:** Every found bug has a reproducible issue\n  - **Tool:** GitHub Issues\n- [ ] **01.11 — Create asset provenance manifest** `[ALPHA]` `[S]`\n  - **Why:** Know what can legally ship\n  - **Build:** Log source URL/creator, original/licence, attribution, path, replacement plan and size for every third-party asset\n  - **Proof:** No asset with unknown rights is marked shippable\n  - **Tool:** CSV/Markdown\n- [ ] **01.12 — Define AI handoff protocol** `[CORE]` `[S]`\n  - **Why:** Avoid huge conflicting edits\n  - **Build:** ChatGPT writes acceptance brief; Claude touches listed files only, supplies diff, tests, video and rollback; no unrelated refactor\n  - **Proof:** A trial change can be reviewed in under 10 minutes\n  - **Tool:** ChatGPT + Claude\n- [ ] **01.13 — Create baseline performance scene** `[CORE]` `[M]`\n  - **Why:** Every new effect should have comparable measurements\n  - **Build:** One grey plane, R15 dummy, camera presets, 4 NPCs, on-screen FPS/network/instance counters; record baseline\n  - **Proof:** Same camera captures and metrics before and after changes\n  - **Tool:** Studio + OBS\n\n"},{"title":"02 — Foundational network, profiles and state (15 deliverables)","content":"### 02 — Foundational network, profiles and state (15 deliverables)\n\n**Goal:** Protect data and create shared interfaces for all later systems.  \n**Prerequisites:** 01 repository and tests  \n**Exit gate:** Leave/rejoin restores a profile; invalid remote requests cannot modify progression.\n\n- [ ] **02.01 — Write shared types and IDs** `[CORE]` `[S]`\n  - **Why:** Consistent data across all factions\n  - **Build:** Define typed CharacterSlot, Profile, AbilityId, QuestId, FactionId, CombatState and serializable settings\n  - **Proof:** Typechecker accepts example data and rejects bad fields\n  - **Tool:** Luau strict + Claude\n- [ ] **02.02 — Build secure player profile loading** `[CORE]` `[L]`\n  - **Why:** Data loss is catastrophic\n  - **Build:** Server-only load, defaults, UpdateAsync saving, retry/backoff, auto-save intervals and failure states; use session lock strategy\n  - **Proof:** Two rapid server joins do not overwrite a newer save\n  - **Tool:** Studio + DataStoreService\n- [ ] **02.03 — Add versioned migrations** `[CORE]` `[M]`\n  - **Why:** Updates must not wipe old saves\n  - **Build:** Store schemaVersion and pure migration functions; run each migration on a copied fixture\n  - **Proof:** Old sample profile upgrades and preserves items\n  - **Tool:** Luau + tests\n- [ ] **02.04 — Build save-safe exit/teleport contract** `[BETA]` `[L]`\n  - **Why:** Multi-place RPG requires clean handoffs\n  - **Build:** Queue save, track session ownership, release lock, retry and fallback; do not trust TeleportData as authority\n  - **Proof:** Failed teleport leaves player playable and their profile intact\n  - **Tool:** Claude + Studio\n- [ ] **02.05 — Create networking remotes contract** `[CORE]` `[M]`\n  - **Why:** Prevent exploit-friendly generic remotes\n  - **Build:** RequestAttack, RequestSkill, RequestInteract, RequestQuest, RequestEquip with typed small payloads and server validators\n  - **Proof:** Spam, missing fields, huge numbers and fake targets are rejected\n  - **Tool:** Luau + tests\n- [ ] **02.06 — Build rate limiter** `[CORE]` `[S]`\n  - **Why:** Bots and exploiters flood remotes\n  - **Build:** Token bucket by player/action and central limit table; silently reject abuse, log repeated anomalous requests\n  - **Proof:** 100 requests in one second do not trigger 100 actions\n  - **Tool:** Claude\n- [ ] **02.07 — Build server state machine** `[CORE]` `[M]`\n  - **Why:** Avoid competing stun, dash, cast and attack code\n  - **Build:** Define Idle, AttackWindup, Active, Recovery, Guard, Dodge, Stunned, Downed, Casting, Dead with explicit transition rules\n  - **Proof:** Invalid transition cannot execute in tests\n  - **Tool:** Claude + Luau\n- [ ] **02.08 — Build stat calculation pipeline** `[CORE]` `[M]`\n  - **Why:** No contradictory buffs\n  - **Build:** Central base stats + equipment + talents + transformation + debuff modifiers with caps and deterministic order\n  - **Proof:** Same input produces same output on server/test client\n  - **Tool:** Luau + tests\n- [ ] **02.09 — Build resource service** `[CORE]` `[M]`\n  - **Why:** Abilities need stamina/spirit/health rules\n  - **Build:** Server owns max/current, cost, recovery, regen delay, clamping and death; client observes replicated deltas\n  - **Proof:** Cannot cast at 0 spirit; no negative/NaN resources\n  - **Tool:** Claude\n- [ ] **02.10 — Build cooldown registry** `[CORE]` `[S]`\n  - **Why:** Avoid per-skill ad-hoc timers\n  - **Build:** Timestamp cooldown keyed by player and ability, group cooldown support, server confirmation and UI display\n  - **Proof:** Rapid duplicated cast spends resources once\n  - **Tool:** Claude\n- [ ] **02.11 — Build character spawn/reset** `[CORE]` `[M]`\n  - **Why:** Respawning touches every system\n  - **Build:** Server allocates slot and equipment, cleans old connections, restores safe state and places at valid checkpoint\n  - **Proof:** 20 reset cycles cause no extra damage handlers or missing gear\n  - **Tool:** Studio + Claude\n- [ ] **02.12 — Build event bus for gameplay** `[CORE]` `[M]`\n  - **Why:** Keep quests and achievements decoupled\n  - **Build:** Server events EnemyDefeated, TrialCompleted, EnteredRegion, DamageDealt, ItemCollected; listeners never trust client event claims\n  - **Proof:** Quest advances only after server-origin verified event\n  - **Tool:** Claude + Luau\n- [ ] **02.13 — Build permissions and zone rules** `[ALPHA]` `[M]`\n  - **Why:** PvP and portals require contexts\n  - **Build:** Rules for Safe, Quest, Duel, PvP, Event, Instance zones; server owns eligibility\n  - **Proof:** Safe zone prevents hostile hits even with spoofed requests\n  - **Tool:** Claude\n- [ ] **02.14 — Create logging and rollback** `[ALPHA]` `[M]`\n  - **Why:** Hard to debug invisible failures\n  - **Build:** Structured logs with session/job ID, bug IDs and checkpoint flags; store last known good profile snapshot in test utilities\n  - **Proof:** You can explain a failed save without exposing sensitive data\n  - **Tool:** Claude + Studio\n- [ ] **02.15 — Test concurrent sessions and corruption** `[CORE]` `[L]`\n  - **Why:** Data failures emerge only under stress\n  - **Build:** Parallel clients, disconnect during reward/save, forced throttling and duplicate action tests\n  - **Proof:** No duplicated item/currency; data errors are visible to owner\n  - **Tool:** Studio Server & Clients\n\n"},{"title":"03 — Movement, camera, input and animation base (12 deliverables)","content":"### 03 — Movement, camera, input and animation base (12 deliverables)\n\n**Goal:** Make simply running through the world feel good before abilities.  \n**Prerequisites:** 02 state and resources  \n**Exit gate:** PC/mobile/controller can move, dash and aim through an obstacle course without camera errors.\n\n- [ ] **03.01 — Build starter R15 controller** `[CORE]` `[M]`\n  - **Why:** All races share a base\n  - **Build:** Create reusable run/sprint/jump/landing controller with a clear animation set and consistent speed caps\n  - **Proof:** No foot sliding at normal speed; animations survive respawn\n  - **Tool:** Studio Animation Editor\n- [ ] **03.02 — Create input action map** `[CORE]` `[M]`\n  - **Why:** Avoid manual key conflicts\n  - **Build:** Central InputService with named actions and rebinding settings; UI and combat subscribe to actions\n  - **Proof:** Rebind Guard and Dash without code edits\n  - **Tool:** ContextActionService + Claude\n- [ ] **03.03 — Make sprint and stamina** `[CORE]` `[S]`\n  - **Why:** Movement needs choice\n  - **Build:** Stamina drain and delayed refill; sprint cancels under hard crowd-control\n  - **Proof:** Cannot sprint forever; stamina values match server\n  - **Tool:** Claude\n- [ ] **03.04 — Implement dash with aim direction** `[CORE]` `[M]`\n  - **Why:** Core anime feel\n  - **Build:** 8-direction movement, startup, active frames, recovery, two-charge limiter; small VFX later\n  - **Proof:** Dash goes where intended from keyboard and gamepad\n  - **Tool:** Claude + Studio\n- [ ] **03.05 — Add wall/ledge safeguards** `[CORE]` `[M]`\n  - **Why:** High mobility must remain reliable\n  - **Build:** Check collision, steep slopes, corners, floor and void safety on every dash\n  - **Proof:** No clipping through thin wall in 50 test attempts\n  - **Tool:** Studio test course\n- [ ] **03.06 — Add short air movement** `[ALPHA]` `[S]`\n  - **Why:** Vertical combat readability\n  - **Build:** One air dodge/jump choice with recovery and no infinite jumping\n  - **Proof:** Can reach test ledge; cannot fly using repeated dashes\n  - **Tool:** Claude\n- [ ] **03.07 — Create third-person shoulder camera** `[CORE]` `[M]`\n  - **Why:** Foundational for sword hitboxes\n  - **Build:** Adjustable offset, obstruction raycasts, zoom bounds, tilt clamping, aim assist sensitivity\n  - **Proof:** No camera inside walls or avatars in tight corridor\n  - **Tool:** Studio\n- [ ] **03.08 — Implement optional lock-on** `[CORE]` `[M]`\n  - **Why:** Target awareness without forced aim\n  - **Build:** Find nearby eligible target, camera smoothing, break on distance/occlusion, target cycle\n  - **Proof:** No hard snap or unwanted lock through structures\n  - **Tool:** Claude\n- [ ] **03.09 — Create controller mapping** `[ALPHA]` `[M]`\n  - **Why:** Roblox is cross-platform\n  - **Build:** Use separate action chart with face/shoulder/D-pad, lock-on and radial menus; support default mappings\n  - **Proof:** Tester can complete combat without keyboard\n  - **Tool:** Studio device and controller testing\n- [ ] **03.10 — Create mobile combat buttons** `[CORE]` `[M]`\n  - **Why:** Phone players need equal agency\n  - **Build:** Thumb zones for attack/guard/dodge/skills; input feedback and resizable safe-area anchors\n  - **Proof:** All essential actions reachable on simulated small phone\n  - **Tool:** Studio Device Emulator\n- [ ] **03.11 — Set animation priority rules** `[CORE]` `[M]`\n  - **Why:** Stop arms and legs fighting\n  - **Build:** Movement low, weapon attacks Action, transformation override, hit reaction additive where possible; use markers for hit frames\n  - **Proof:** Attack doesn't break movement or permanent equip pose\n  - **Tool:** Studio Animation Editor\n- [ ] **03.12 — Test movement under latency** `[CORE]` `[M]`\n  - **Why:** Fast controls mask lag defects\n  - **Build:** Studio 2-client run with simulated latency, collision spam and reset mid-dash; compare client prediction/server correction\n  - **Proof:** No teleport jitter or duplicate dodges that change damage state\n  - **Tool:** Studio + OBS\n\n"},{"title":"04 — Core melee combat and fairness (17 deliverables)","content":"### 04 — Core melee combat and fairness (17 deliverables)\n\n**Goal:** Build one excellent shared combat engine before faction powers.  \n**Prerequisites:** 03 inputs and 02 server combat state  \n**Exit gate:** A 1v1 feels fair with no VFX beyond white trails, and an NPC uses the same damage code.\n\n- [ ] **04.01 — Define all combat states** `[CORE]` `[M]`\n  - **Why:** Clear interrupts and immunity windows\n  - **Build:** State diagram from Neutral to Windup to Active to Recovery; define Stagger, GuardBroken, Downed, IFrames and Reset\n  - **Proof:** For every incoming hit, only one reaction wins\n  - **Tool:** ChatGPT + Claude\n- [ ] **04.02 — Create weapon equip system** `[CORE]` `[M]`\n  - **Why:** One baseline sword needs robust networking\n  - **Build:** Equip/unequip replicated model, grip Motor6D, hit origin socket and correct idle animation\n  - **Proof:** No sword duplication, disappearing weapon or wrong hand after respawn\n  - **Tool:** Studio + Claude\n- [ ] **04.03 — Implement four-step light combo** `[CORE]` `[L]`\n  - **Why:** Foundation for every weapon style\n  - **Build:** Data-driven 4 attacks with animation event markers, combo reset and recovery; client immediate swing, server validated hit\n  - **Proof:** Hit timestamps align with animation and respect cooldown\n  - **Tool:** Claude + Studio\n- [ ] **04.04 — Implement one charged/heavy attack** `[CORE]` `[M]`\n  - **Why:** Adds meaningful commitment\n  - **Build:** Hold input threshold, windup telegraph, charge cap, guard pressure and punishable recovery\n  - **Proof:** Heavy is readable, cancellable only under rules\n  - **Tool:** Claude\n- [ ] **04.05 — Implement server checked hit detection** `[CORE]` `[L]`\n  - **Why:** Trust neither client hit nor arbitrary Part touches\n  - **Build:** Server ray/swept box/cone overlap near expected blade path, range/LOS checks, dedup targets per swing\n  - **Proof:** Fake RemoteEvent target across map takes no damage\n  - **Tool:** Claude + Studio\n- [ ] **04.06 — Add hit stun and hitstop** `[CORE]` `[M]`\n  - **Why:** Impact without infinite control\n  - **Build:** Short stagger plus escalating stun resistance; local hitstop is cosmetic and cannot pause server\n  - **Proof:** No true infinite stun loop in repeat-combo test\n  - **Tool:** Claude\n- [ ] **04.07 — Implement regular block** `[CORE]` `[M]`\n  - **Why:** Defense creates decisions\n  - **Build:** Front angle protection, guard stamina, back vulnerability, chip policy and break rules\n  - **Proof:** Front light blocked; rear hit succeeds; no endless guard\n  - **Tool:** Claude\n- [ ] **04.08 — Implement perfect guard/parry** `[CORE]` `[L]`\n  - **Why:** Skill expression\n  - **Build:** Timed window with sound/spark, advantage on success and punish on spam; verify server contact time with latency tolerance\n  - **Proof:** 10 successful timings possible for practiced tester; fake spam fails\n  - **Tool:** Claude\n- [ ] **04.09 — Implement dodge i-frames** `[CORE]` `[M]`\n  - **Why:** Escapes from telegraphed attacks\n  - **Build:** Bounded invulnerability window, server-certified dash state, distinct grab/aoe counter rules\n  - **Proof:** Dodge avoids designed attacks but not every area effect\n  - **Tool:** Claude\n- [ ] **04.10 — Create critical counter attack** `[ALPHA]` `[M]`\n  - **Why:** Satisfying mind-game\n  - **Build:** Single counter available after parry or combo finisher, with clear cooldown and telegraph\n  - **Proof:** Cannot chain counter without qualifying event\n  - **Tool:** Claude\n- [ ] **04.11 — Build poise/guard break** `[ALPHA]` `[M]`\n  - **Why:** Prevent heavy weapon dominance\n  - **Build:** Enemy poise, stagger threshold, superarmor tags, break recovery and boss resistance\n  - **Proof:** Large enemy cannot be permanently flinched\n  - **Tool:** Claude\n- [ ] **04.12 — Create damage calculation function** `[CORE]` `[M]`\n  - **Why:** One tuning point for all weapons\n  - **Build:** Base + skill coefficient + effective stat, mitigation and PvP mode multiplier; capped crit; floor at 0\n  - **Proof:** Damage equal for same inputs across 1,000 fixture tests\n  - **Tool:** Luau pure module\n- [ ] **04.13 — Add combat log and debug overlay** `[CORE]` `[S]`\n  - **Why:** Easy balance without guessing\n  - **Build:** Record attacker, ability, server timestamp, hit range, mitigated damage and state transitions in dev-only panel\n  - **Proof:** Explain exactly why a hit missed or landed\n  - **Tool:** Claude + Studio\n- [ ] **04.14 — Build PvP training dummy and scripted fighter** `[CORE]` `[M]`\n  - **Why:** Repeatable human-independent tuning\n  - **Build:** Dummy with health, parryable attack loop, reset, move and damage recorder\n  - **Proof:** Tester can test every hit and counter with no second player\n  - **Tool:** Studio\n- [ ] **04.15 — Make 1v1 net test arena** `[CORE]` `[L]`\n  - **Why:** Confirm server authority\n  - **Build:** 2 clients at simulated 50/150/250 ms, attack spam, dash and guard tests, compare both HPs\n  - **Proof:** Both clients converge to same server HP/state; no client-authoritative damage\n  - **Tool:** Studio test\n- [ ] **04.16 — Design combat readability standards** `[CORE]` `[S]`\n  - **Why:** Graphics shouldn't hide mechanics\n  - **Build:** Rule: startup sound/pose, contact, recovery, distinct guard/parry/dodge feedback, low-FX fallback\n  - **Proof:** Tester identifies the attack without the cinematic effects\n  - **Tool:** ChatGPT + OBS\n- [ ] **04.17 — Add PvE damage/resistance scaling** `[ALPHA]` `[M]`\n  - **Why:** Allow early foes and bosses to coexist\n  - **Build:** Separate encounter bracket modifiers from player-stat progression, avoid boss HP inflation\n  - **Proof:** Starter enemy dies in \u003c60 sec, equal-level elite remains dangerous\n  - **Tool:** Claude + spreadsheet\n\n"},{"title":"05 — Enemies, NPC brains and encounter templates (12 deliverables)","content":"### 05 — Enemies, NPC brains and encounter templates (12 deliverables)\n\n**Goal:** Give the shared combat something intelligent to fight.  \n**Prerequisites:** 04 damage/states  \n**Exit gate:** Three distinct enemy archetypes fight convincingly; bosses cannot be trivially exploited.\n\n- [ ] **05.01 — Create enemy definition registry** `[CORE]` `[M]`\n  - **Why:** One codebase for dozens of enemies\n  - **Build:** Data fields model/level/hp/moves/vision/range/loot/behavior/respawn/leash\n  - **Proof:** New enemy added via definition not duplicated AI script\n  - **Tool:** Claude\n- [ ] **05.02 — Build simple brain state machine** `[CORE]` `[M]`\n  - **Why:** NPCs need readable intentions\n  - **Build:** Idle, Patrol, Investigate, Chase, Strafe, Windup, Recover, Retreat, Reset, Dead; update at budgeted rate\n  - **Proof:** Enemy reacquires and resets correctly\n  - **Tool:** Claude\n- [ ] **05.03 — Build threat and aggro** `[ALPHA]` `[M]`\n  - **Why:** Co-op needs credible targeting\n  - **Build:** Track contributions and proximity; decay threat, leash and protect spawn hubs\n  - **Proof:** Enemy switches target reasonably and resets when outrun\n  - **Tool:** Claude\n- [ ] **05.04 — Add obstacle/path handling** `[CORE]` `[M]`\n  - **Why:** No enemies running through walls\n  - **Build:** Use PathfindingService for larger navigation, local steering for close combat and fallback to reset\n  - **Proof:** Enemy navigates test corridor without teleporting\n  - **Tool:** Studio\n- [ ] **05.05 — Create fragile striker enemy** `[CORE]` `[M]`\n  - **Why:** Teach dodging\n  - **Build:** Fast low-health enemy with 2-hit melee and clear approach animation\n  - **Proof:** First-time tester can beat it after learning one dodge\n  - **Tool:** Blender/Studio\n- [ ] **05.06 — Create armoured guardian enemy** `[CORE]` `[M]`\n  - **Why:** Teach heavy and parry\n  - **Build:** Slow block, guard break and counter stance; telegraph every heavy hit\n  - **Proof:** M1-spamming performs worse than using heavy/parry\n  - **Tool:** Studio\n- [ ] **05.07 — Create ranged caster enemy** `[ALPHA]` `[M]`\n  - **Why:** Teach line of sight\n  - **Build:** Ranged blast, slow projectile, interruptible cast and reposition\n  - **Proof:** Player can use cover and interrupt\n  - **Tool:** Studio + Claude\n- [ ] **05.08 — Build telegraph library** `[CORE]` `[M]`\n  - **Why:** Reusable warnings across NPCs\n  - **Build:** Cone, line, ground circle, audio cue, flash; accessibility-safe alternatives\n  - **Proof:** Warning starts before damage, matches actual hit region\n  - **Tool:** Studio UI/VFX\n- [ ] **05.09 — Build encounter spawn manager** `[ALPHA]` `[M]`\n  - **Why:** Scale enemies with players and region\n  - **Build:** Spawn cap, respawn timer, combat bucket, idle despawn and no spawn near player camera\n  - **Proof:** 20 min session does not accumulate enemies forever\n  - **Tool:** Claude\n- [ ] **05.10 — Implement enemy loot and kill attribution** `[CORE]` `[M]`\n  - **Why:** Quests must progress fairly\n  - **Build:** Server-only last-hit/participation rules, contribution floor, rare-drop rules and XP cap for low foes\n  - **Proof:** Nearby nonparticipant receives no boss loot; eligible teammates do\n  - **Tool:** Claude\n- [ ] **05.11 — Add group encounter parameters** `[ALPHA]` `[M]`\n  - **Why:** Co-op shouldn't become chaos\n  - **Build:** Scale enemy counts/behaviour with party rather than simply 5x HP; cap crowd control\n  - **Proof:** 2 players have challenge and remain under FX budget\n  - **Tool:** Claude\n- [ ] **05.12 — Run AI benchmark** `[ALPHA]` `[M]`\n  - **Why:** Avoid 20 NPCs consuming frame time\n  - **Build:** Test 4, 12, 24 AI at once, profile movement/path calls, throttle distant AI\n  - **Proof:** Performance table includes server frame time at each load\n  - **Tool:** Studio profiler\n\n"},{"title":"06 — RPG backbone: rewards, progression, skills, inventory and quests (16 deliverables)","content":"### 06 — RPG backbone: rewards, progression, skills, inventory and quests (16 deliverables)\n\n**Goal:** Make combat cause visible permanent growth.  \n**Prerequisites:** 02 data and 05 enemy events  \n**Exit gate:** Complete quest, earn XP, buy ability, equip reward, save and rejoin without losing progress.\n\n- [ ] **06.01 — Design XP curve and level caps** `[CORE]` `[M]`\n  - **Why:** Players need pace and guardrails\n  - **Build:** One curve for levels, content bands and estimated total hours; catch-up and no AFK farming; separate mastery from account level\n  - **Proof:** Spreadsheet shows progression through each level and detects 10x jumps\n  - **Tool:** Python/Sheets/ChatGPT\n- [ ] **06.02 — Implement server XP and levelling** `[CORE]` `[M]`\n  - **Why:** No client can grant progress\n  - **Build:** Server awards only from validated quests, combat and trials; caps repeated low-level XP\n  - **Proof:** Remote spam cannot gain levels\n  - **Tool:** Claude\n- [ ] **06.03 — Implement stat/talent points** `[CORE]` `[M]`\n  - **Why:** Build identity\n  - **Build:** Earn modest points per level and milestone; validate caps, tier prerequisites and respec tokens\n  - **Proof:** No negative points, no locked node purchases\n  - **Tool:** Claude\n- [ ] **06.04 — Build shared talent tree UI** `[ALPHA]` `[M]`\n  - **Why:** Every faction can use same widget\n  - **Build:** Branch nodes with IDs, prerequisites, costs, preview and ability hotbar mapping\n  - **Proof:** Three test branches can be unlocked and reset safely\n  - **Tool:** Claude + Studio\n- [ ] **06.05 — Implement quest definition schema** `[CORE]` `[M]`\n  - **Why:** Avoid hard-coded NPC dialogue progress\n  - **Build:** Quest = ID, requirements, NPC, objectives, reward, unlock flags, failure, repeat rule, text\n  - **Proof:** Adding a quest requires only data + any unique encounter\n  - **Tool:** Claude\n- [ ] **06.06 — Create quest state handler** `[CORE]` `[L]`\n  - **Why:** Players can leave halfway through\n  - **Build:** Accept/active/complete/claim; track objective progress server-side, checkpoints and duplicate claim prevention\n  - **Proof:** Disconnect at 90% progress restores correct task\n  - **Tool:** Claude\n- [ ] **06.07 — Build quest wayfinding** `[CORE]` `[M]`\n  - **Why:** Players should not rely on a wiki\n  - **Build:** Local indicator, map destination, compass distance and journal reminders; toggle clutter\n  - **Proof:** First tester finds a target without assistant help\n  - **Tool:** Studio UI\n- [ ] **06.08 — Create 5 varied objective templates** `[ALPHA]` `[L]`\n  - **Why:** Avoid 'kill 10' forever\n  - **Build:** Defeat, survive, escort, collect, interact, defend; timers and event counts from server\n  - **Proof:** Can make 5 unique quests from same templates\n  - **Tool:** Claude\n- [ ] **06.09 — Implement inventory with stacking** `[CORE]` `[M]`\n  - **Why:** Basic RPG reward handling\n  - **Build:** IDs/counts/capacity, drag/equip, consumables, rarity metadata; no client item creation\n  - **Proof:** 100 repeated transactions preserve consistent quantities\n  - **Tool:** Claude\n- [ ] **06.10 — Create equipment and weapon-stat hooks** `[ALPHA]` `[M]`\n  - **Why:** Rewards should matter but not dominate\n  - **Build:** Slot types, visual attachment, stat modifiers, level/faction requirement and switch restrictions in combat\n  - **Proof:** Cannot equip wrong-faction or impossible weapon\n  - **Tool:** Claude\n- [ ] **06.11 — Build currency/economy** `[ALPHA]` `[M]`\n  - **Why:** One simple currency first\n  - **Build:** Earn/spend server-side, vendor stock, prices and sinks, transaction logs\n  - **Proof:** Buy with insufficient funds fails without loss\n  - **Tool:** Claude\n- [ ] **06.12 — Add craft/material unlocks** `[BETA]` `[M]`\n  - **Why:** Create long-term boss value\n  - **Build:** 2 materials and 3 recipes with preview, validation, guaranteed progress route\n  - **Proof:** Materials cannot be duplicated through rapid purchase/leave\n  - **Tool:** Claude\n- [ ] **06.13 — Implement talent respec** `[ALPHA]` `[M]`\n  - **Why:** New players should experiment\n  - **Build:** Free early respec + earned later respec; skill cooldown on reset; safe-only rule\n  - **Proof:** Can fully undo allocation without losing levels\n  - **Tool:** Claude\n- [ ] **06.14 — Create mastery progression** `[ALPHA]` `[M]`\n  - **Why:** Make practising a power meaningful\n  - **Build:** Per-style XP from meaningful actions and milestones, diminishing returns on dummy spam\n  - **Proof:** Two combat styles level independently without AFK exploit\n  - **Tool:** Claude\n- [ ] **06.15 — Build quest admin test console** `[CORE]` `[M]`\n  - **Why:** AI-made quest debugging\n  - **Build:** Developer-only grant quest, skip stage, level up and warp to checkpoint; exclude from production public permissions\n  - **Proof:** Tester can jump to every route chapter safely\n  - **Tool:** Claude + Studio\n- [ ] **06.16 — Create rewards audit** `[ALPHA]` `[M]`\n  - **Why:** Find unwanted exploits\n  - **Build:** Script calculates XP/hour, currency/hour, highest farm loops and off-level rewards\n  - **Proof:** No loop earns 10x intended progress by killing harmless NPCs\n  - **Tool:** Python/Claude\n\n"},{"title":"07 — First-time player story and tutorial (12 deliverables)","content":"### 07 — First-time player story and tutorial (12 deliverables)\n\n**Goal:** Prove a coherent half-hour experience before multiple races.  \n**Prerequisites:** 06 quests and 04 combat  \n**Exit gate:** New tester completes the opening without voice instruction; understands combat and next goal.\n\n- [ ] **07.01 — Sketch an original city block** `[CORE]` `[M]`\n  - **Why:** Players need believable starting geography\n  - **Build:** Greybox central street, station, alley, park, crossroads and training edge; mark spawn, encounters, exits\n  - **Proof:** Run loop covers points in 2–3 minutes without dead ends\n  - **Tool:** Studio Parts\n- [ ] **07.02 — Create opening 60-second hook** `[CORE]` `[M]`\n  - **Why:** First impression matters\n  - **Build:** Start near a supernatural disturbance, show one strange event, give player camera control immediately\n  - **Proof:** First meaningful movement within 15 seconds\n  - **Tool:** ChatGPT + Studio\n- [ ] **07.03 — Build movement tutorial in action** `[CORE]` `[M]`\n  - **Why:** Teach without text walls\n  - **Build:** One obstacle, jump/roll prompt, sprint test and a clear reward\n  - **Proof:** Players can finish in under 90 sec\n  - **Tool:** Studio + Claude\n- [ ] **07.04 — Create first combat encounter** `[CORE]` `[M]`\n  - **Why:** Introduce low-stakes danger\n  - **Build:** Weak enemy telegraphs one heavy, healer intervenes if first-time player repeatedly loses\n  - **Proof:** Tester learns attack, dodge and guard without dying 10 times\n  - **Tool:** Claude + animations\n- [ ] **07.05 — Make mentor rescue scene** `[ALPHA]` `[M]`\n  - **Why:** Convey setting and excitement\n  - **Build:** NPC demonstrates one impressive skill in world space, short skip-enabled moment\n  - **Proof:** Scene \u003c35 sec and no camera soft-lock after skip\n  - **Tool:** Studio animation\n- [ ] **07.06 — Build spiritual awakening choice** `[ALPHA]` `[M]`\n  - **Why:** Give agency but no irreversible mistake\n  - **Build:** Small action-based dialogue/quest choice affects dialogue and training route, not permanent power balance\n  - **Proof:** Player understands choice and can view consequences\n  - **Tool:** ChatGPT + Claude\n- [ ] **07.07 — Create first quest chain** `[CORE]` `[L]`\n  - **Why:** Put RPG loop together\n  - **Build:** Talk, defend civilians, defeat 3 foes, inspect tear, return and earn first talent point\n  - **Proof:** Chain works from save/reload at every intermediate stage\n  - **Tool:** Claude\n- [ ] **07.08 — Introduce first earned skill** `[CORE]` `[M]`\n  - **Why:** Give reason to play next\n  - **Build:** NPC training exercise awards starter special; teach hotbar assignment and cost\n  - **Proof:** Player can unlock and cast in \u003c20 min total play\n  - **Tool:** Studio + Claude\n- [ ] **07.09 — Build first mini-boss** `[ALPHA]` `[L]`\n  - **Why:** Proof of game combat variety\n  - **Build:** Two-phase foe with dodgeable swipe, guard-break strike and interruptible ranged charge\n  - **Proof:** First tester can win after one learning attempt\n  - **Tool:** Claude + Studio\n- [ ] **07.10 — Create persistent checkpoint** `[CORE]` `[M]`\n  - **Why:** Prevent replaying every cutscene\n  - **Build:** Save completion flags and safe respawn points after quest groups\n  - **Proof:** Rejoining resumes at correct moment\n  - **Tool:** Claude\n- [ ] **07.11 — Build help/journal/accessibility menu** `[ALPHA]` `[M]`\n  - **Why:** Reduce support costs\n  - **Build:** Show next task, combat basics, remap keys, reduced FX, text size/contrast and audio sliders\n  - **Proof:** Tester can re-read any required instruction\n  - **Tool:** Studio UI\n- [ ] **07.12 — Run 5-player onboarding study** `[CORE]` `[M]`\n  - **Why:** Design is invalid until real users understand it\n  - **Build:** Observe silently: time to first hit, first reward, errors, death count, exits; write findings\n  - **Proof:** At least 4/5 can find next goal; target fun \u003c5 min\n  - **Tool:** OBS + test group\n\n"},{"title":"08 — Soul Reaper journey: complete route implementation (22 deliverables)","content":"### 08 — Soul Reaper journey: complete route implementation (22 deliverables)\n\n**Goal:** Playable novice-to-captain-class arc with a strong first release and later top forms.  \n**Prerequisites:** 07 complete intro, 06 progression, 12 ability framework (phase 12 can begin in parallel)  \n**Exit gate:** Alpha: academy→basic duties→first release works. Long-term: bankai and captain-class trials have endgame design specs.\n\n- [ ] **08.01 — Define Soul Reaper progression graph** `[CORE]` `[M]`\n  - **Why:** Rank cannot be a vague XP bar\n  - **Build:** Story nodes recruit → academy → field trainee → officer → seated officer → lieutenant calibre → captain calibre; distinguish ability from official rank\n  - **Proof:** Every node has prerequisites, quests and unlocks\n  - **Tool:** ChatGPT + quest schema\n- [ ] **08.02 — Create soul recruitment event** `[ALPHA]` `[M]`\n  - **Why:** Connect opening to race path\n  - **Build:** After supernatural encounter offer a purification/rescue opportunity, follow recruiter to a spiritual district\n  - **Proof:** Choosing route never loses saved character\n  - **Tool:** Claude + Studio\n- [ ] **08.03 — Build starter spiritual district** `[ALPHA]` `[L]`\n  - **Why:** Provide safe home and context\n  - **Build:** Greybox inhabited street, vendor, recruitment gate, noticeboard, dorm/room option later\n  - **Proof:** All opening NPCs reachable with map pointers\n  - **Tool:** Studio\n- [ ] **08.04 — Create spiritual aptitude assessment** `[ALPHA]` `[M]`\n  - **Why:** Teach reiryoku/reiatsu simply\n  - **Build:** Three short tasks: sense target, controlled output and dodge; reward starter uniform\n  - **Proof:** Test can be completed alone without exact talent roll\n  - **Tool:** Claude + UI\n- [ ] **08.05 — Build training school micro-slice** `[ALPHA]` `[L]`\n  - **Why:** Long academy simulation is optional future scope\n  - **Build:** One multifunctional hall, courtyard, sword yard and spell lane; parallel NPC lessons possible\n  - **Proof:** Player can do sword, movement and basic spell lessons\n  - **Tool:** Studio + Blender\n- [ ] **08.06 — Implement issued practice sword** `[ALPHA]` `[M]`\n  - **Why:** Give new players a milestone\n  - **Build:** Asauchi-like unnamed starter blade: equip, block, parry and practise; no named release yet\n  - **Proof:** Save blade ownership and never duplicate it\n  - **Tool:** Claude\n- [ ] **08.07 — Make Zanjutsu lessons** `[ALPHA]` `[L]`\n  - **Why:** Ground progression in skill\n  - **Build:** Three escalating exercises: combo timing, guard break, duel vs NPC; score accuracy not only damage\n  - **Proof:** Good timing advances quicker than button spam\n  - **Tool:** Claude + Studio\n- [ ] **08.08 — Make Hohō lessons** `[ALPHA]` `[M]`\n  - **Why:** Give movement mastery\n  - **Build:** Dash through markers, avoid moving attacks, short mobility trial with checkpoint\n  - **Proof:** Fails reset only this trial and save progress\n  - **Tool:** Claude + Studio\n- [ ] **08.09 — Make Kidō lessons** `[ALPHA]` `[L]`\n  - **Why:** Teach non-sword utility\n  - **Build:** Target practice for 2 attack spells and one binding utility, incantation bonus choice\n  - **Proof:** Both fast and chanted casts share one service\n  - **Tool:** Claude + Studio\n- [ ] **08.10 — Make Hakuda lessons** `[BETA]` `[M]`\n  - **Why:** Support unarmed build diversity\n  - **Build:** Guard breaks, grab escape, counter drill; unarmed and sword use same server combat\n  - **Proof:** Player can complete with default starter stats\n  - **Tool:** Claude\n- [ ] **08.11 — Create academy assignment board** `[ALPHA]` `[M]`\n  - **Why:** Turn training into variety\n  - **Build:** Optional repeatable solo/co-op assignments: defend, escort, cleanse, scout\n  - **Proof:** Quest templates generate objectives without manual script changes\n  - **Tool:** Claude\n- [ ] **08.12 — Create first Soul Burial mechanic** `[ALPHA]` `[M]`\n  - **Why:** Signature fantasy other games may underteach\n  - **Build:** Contextual short ritual on eligible lost soul NPC, channel interrupted by nearby attacks\n  - **Proof:** Wrong target does nothing; action yields verified quest credit\n  - **Tool:** Claude + Studio\n- [ ] **08.13 — Build field patrol events** `[ALPHA]` `[M]`\n  - **Why:** Make training matter in world\n  - **Build:** Patrol 3 districts, identify ghost vs hostile, protect NPCs, close small rift\n  - **Proof:** Encounter variations feel different but use common AI\n  - **Tool:** Claude\n- [ ] **08.14 — Build sword-spirit interaction system** `[BETA]` `[L]`\n  - **Why:** Power unlock needs story depth\n  - **Build:** Spirit NPC scene reacts to chosen fighting focus, dialogue flags and trial results\n  - **Proof:** Conversation saved and not replayed on reconnect\n  - **Tool:** Claude + ChatGPT\n- [ ] **08.15 — Create the first Shikai-style release** `[ALPHA]` `[L]`\n  - **Why:** First headline reward\n  - **Build:** Pick ONE original element theme, model weapon form, 3 moves, one transformation animation and ultimate drawback\n  - **Proof:** Completing spirit trial unlocks form; cooldown/cost/server validation pass\n  - **Tool:** Blender + Studio + Claude\n- [ ] **08.16 — Build three release archetypes** `[BETA]` `[L]`\n  - **Why:** Replay through style choice\n  - **Build:** Create 3 well-distinguished kits (aggressive, defensive, mobility) with shared definitions and counters\n  - **Proof:** Each defeats same boss in different ways; no auto-win theme\n  - **Tool:** Claude + art tools\n- [ ] **08.17 — Build Gotei-like division reputation** `[BETA]` `[L]`\n  - **Why:** Make ranks and social role matter\n  - **Build:** Choose division role by tasks, gain reputation through duties, no irreversible wrong choice\n  - **Proof:** UI displays rank and next promotion conditions\n  - **Tool:** Claude\n- [ ] **08.18 — Build officer field mission arc** `[BETA]` `[L]`\n  - **Why:** Bridge to stronger enemies\n  - **Build:** Rogue spirit investigation, suspect duel, multi-enemy defense, escort to base\n  - **Proof:** First promotion not gated by another human player\n  - **Tool:** Claude\n- [ ] **08.19 — Build lieutenant-calibre challenge** `[LATER]` `[L]`\n  - **Why:** Raise stakes\n  - **Build:** Timed combat gauntlet, spirit control benchmark, story duel with situational boss\n  - **Proof:** Requires demonstrated mastery not just arbitrary XP\n  - **Tool:** Claude + Studio\n- [ ] **08.20 — Create Bankai-style awakening arc** `[LATER]` `[L]`\n  - **Why:** Second headline transformation\n  - **Build:** Multi-stage relationship test, inner-world fight, distinct 3D battlefield modifier, 4 skill variants and recoverable failed tries\n  - **Proof:** Unblock on mastery; no random irreversible failure\n  - **Tool:** Claude + Blender\n- [ ] **08.21 — Design captain-class mastery** `[LATER]` `[L]`\n  - **Why:** Top end goal not automatic job title\n  - **Build:** Endgame achievements: tactical boss, defensive service, high-level sword trial and group operation; power class separate from political captain slot\n  - **Proof:** Solo/casual player still has non-ranked endgame route\n  - **Tool:** ChatGPT + Claude\n- [ ] **08.22 — Make prestige/endgame duties** `[L
